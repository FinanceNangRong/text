    <script>
        // กำหนด Worker สำหรับ PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ตัวแปรสถานะ
        let loadedPdfs = {}; // เก็บ File Object ต้นฉบับ
        let pagesState = []; // เก็บข้อมูลของแต่ละหน้า { id, pdfId, pageIndex, fileIndex, thumbUrl }
        let currentFileIndex = 0;
        let finalPdfBlobUrl = null;
        let sortableInstance = null; // เพิ่มตัวแปรเก็บ Sortable ป้องกันบั๊กอีเวนต์ทับซ้อน

        // Elements
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const thumbnailsContainer = document.getElementById('thumbnails-container');
        const updateBtn = document.getElementById('update-preview-btn');
        const downloadBtn = document.getElementById('download-btn');
        const clearBtn = document.getElementById('clear-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const pageCountTxt = document.getElementById('page-count');

        // ฟังก์ชันสุ่ม ID
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // เปิด-ปิด Loading
        const showLoading = (show, text = 'กำลังประมวลผล...') => {
            loadingText.innerText = text;
            loadingOverlay.style.display = show ? 'flex' : 'none';
        };

        // --- ระบบ Drag & Drop สำหรับไฟล์อัปโหลด ---
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-blue-50');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault(); dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        // จัดการไฟล์ที่อัปโหลด
        async function handleFiles(files) {
            const pdfFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            if (pdfFiles.length === 0) return alert('กรุณาอัปโหลดไฟล์ PDF เท่านั้น');

            showLoading(true, `กำลังอ่านไฟล์... (0/${pdfFiles.length})`);
            const emptyStateEl = document.getElementById('empty-state');
            if (emptyStateEl) emptyStateEl.style.display = 'none';
            clearBtn.style.display = 'block';

            for (let i = 0; i < pdfFiles.length; i++) {
                const file = pdfFiles[i];
                showLoading(true, `กำลังสร้างภาพตัวอย่าง: ${file.name}...`);
                await processPdfFile(file);
            }

            fileInput.value = ''; // รีเซ็ต input
            renderThumbnails();
            await generateMergedPdf(); // สร้าง preview ทันที
        }

        // ดึงข้อมูลและสร้าง Thumbnail สำหรับแต่ละหน้า
        async function processPdfFile(file) {
            const pdfId = generateId();
            loadedPdfs[pdfId] = file; // เก็บ File object ไว้ใช้ตอนรวมไฟล์ ป้องกันปัญหาหน่วยความจำหลุด (Detached Buffer)

            // อ่าน Buffer ใหม่สำหรับ PDF.js โดยเฉพาะ
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            currentFileIndex++;

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                
                // กำหนดขนาด Thumbnail (สเกลเล็กลงเพื่อประหยัดแรม)
                const viewport = page.getViewport({ scale: 0.3 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                const thumbUrl = canvas.toDataURL('image/jpeg', 0.8);

                pagesState.push({
                    id: generateId(),
                    pdfId: pdfId,
                    pageIndex: pageNum - 1, // index สำหรับ pdf-lib เริ่มที่ 0
                    pageNum: pageNum,
                    fileName: file.name,
                    fileIdx: currentFileIndex,
                    thumbUrl: thumbUrl,
                    userRotation: 0 // เพิ่มเก็บค่าการหมุน (องศา)
                });
            }
        }

        // แสดงผลหน้าทั้งหมดลงใน Grid
        function renderThumbnails() {
            thumbnailsContainer.innerHTML = '';
            
            if (pagesState.length === 0) {
                thumbnailsContainer.innerHTML = `
                    <div id="empty-state" class="col-span-full text-center text-gray-400 py-10">
                        ยังไม่มีไฟล์ กรุณาอัปโหลดไฟล์ PDF
                    </div>
                `;
                updateBtn.disabled = true;
                downloadBtn.disabled = true;
                clearBtn.style.display = 'none';
                // ล้างหน้าจอ Preview ของใหม่
                document.getElementById('pdf-preview-container').innerHTML = '';
                pageCountTxt.innerText = '0 หน้า';
                return;
            }

            pagesState.forEach((page) => {
                const div = document.createElement('div');
                // ใช้สีสันแตกต่างกันนิดหน่อยสำหรับแต่ละไฟล์
                const fileColors = ['border-gray-200', 'border-blue-300', 'border-green-300', 'border-yellow-300', 'border-purple-300', 'border-pink-300'];
                const colorClass = fileColors[page.fileIdx % fileColors.length];

                div.className = `relative group bg-white rounded-lg shadow-sm border-2 ${colorClass} overflow-hidden cursor-move hover:shadow-md transition`;
                div.dataset.id = page.id;
                
                div.innerHTML = `
                    <div class="bg-gray-100 flex justify-center items-center h-32 border-b overflow-hidden">
                        <img src="${page.thumbUrl}" class="max-h-full max-w-full object-contain pointer-events-none transition-transform duration-300" style="transform: rotate(${page.userRotation || 0}deg);">
                    </div>
                    <div class="p-2 text-center text-xs">
                        <p class="truncate font-semibold text-gray-700" title="${page.fileName}">${page.fileName}</p>
                        <p class="text-gray-500">หน้า ${page.pageNum}</p>
                    </div>
                    <button class="absolute top-1 right-8 bg-blue-500 hover:bg-blue-600 text-white rounded-full w-6 h-6 flex justify-center items-center opacity-0 group-hover:opacity-100 transition shadow" onclick="rotatePage('${page.id}')" title="หมุนหน้านี้">
                        <i class="fas fa-redo text-xs"></i>
                    </button>
                    <button class="absolute top-1 right-1 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex justify-center items-center opacity-0 group-hover:opacity-100 transition shadow" onclick="deletePage('${page.id}')" title="ลบหน้านี้">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                    <div class="absolute top-1 left-1 bg-gray-800 text-white text-[10px] px-1.5 py-0.5 rounded opacity-70 pointer-events-none">
                        <i class="fas fa-grip-vertical mr-1"></i>ลาก
                    </div>
                `;
                thumbnailsContainer.appendChild(div);
            });

            // เปิดใช้งานปุ่ม
            updateBtn.disabled = false;
            updateBtn.classList.remove('opacity-50');

            // ทำลาย Sortable เก่าทิ้งก่อนสร้างใหม่ เพื่อกันบั๊กจัดเรียงซ้อนทับกัน
            if (sortableInstance) sortableInstance.destroy();

            // ตั้งค่า SortableJS (ลากจัดเรียง)
            sortableInstance = new Sortable(thumbnailsContainer, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    // อัปเดต Array pagesState ให้ตรงกับลำดับใน DOM หลังจากการลากวาง
                    const newOrderIds = Array.from(thumbnailsContainer.children).map(child => child.dataset.id);
                    pagesState = newOrderIds.map(id => pagesState.find(p => p.id === id));
                    
                    // แจ้งเตือนให้อัปเดตตัวอย่าง
                    updateBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    updateBtn.classList.add('animate-pulse', 'bg-yellow-500', 'hover:bg-yellow-600', 'text-black');
                    updateBtn.innerHTML = '<i class="fas fa-exclamation-circle mr-1"></i> มีการเปลี่ยนแปลง (คลิกอัปเดต)';
                }
            });
        }

        // ลบหน้า
        function deletePage(id) {
            pagesState = pagesState.filter(p => p.id !== id);
            renderThumbnails();
            
            updateBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            updateBtn.classList.add('animate-pulse', 'bg-yellow-500', 'hover:bg-yellow-600', 'text-black');
            updateBtn.innerHTML = '<i class="fas fa-exclamation-circle mr-1"></i> มีการเปลี่ยนแปลง (คลิกอัปเดต)';
        }

        // หมุนหน้า
        function rotatePage(id) {
            const page = pagesState.find(p => p.id === id);
            if (page) {
                page.userRotation = ((page.userRotation || 0) + 90) % 360; // หมุนเพิ่มทีละ 90 องศา
                renderThumbnails();
                
                updateBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                updateBtn.classList.add('animate-pulse', 'bg-yellow-500', 'hover:bg-yellow-600', 'text-black');
                updateBtn.innerHTML = '<i class="fas fa-exclamation-circle mr-1"></i> มีการเปลี่ยนแปลง (คลิกอัปเดต)';
            }
        }

        // ล้างข้อมูลทั้งหมด
        function clearAll() {
            if(!confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างไฟล์ทั้งหมด?')) return;
            loadedPdfs = {};
            pagesState = [];
            currentFileIndex = 0;
            if (finalPdfBlobUrl) URL.revokeObjectURL(finalPdfBlobUrl);
            finalPdfBlobUrl = null;
            renderThumbnails();
        }

        // ประมวลผลและสร้าง PDF ตัวใหม่
        async function generateMergedPdf() {
            if (pagesState.length === 0) return;
            showLoading(true, 'กำลังสร้างไฟล์ PDF...');
            
            try {
                // รีเซ็ตปุ่มอัปเดต
                updateBtn.classList.remove('animate-pulse', 'bg-yellow-500', 'hover:bg-yellow-600', 'text-black');
                updateBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white');
                updateBtn.innerHTML = '<i class="fas fa-sync-alt mr-1"></i> อัปเดตตัวอย่าง PDF';

                const { PDFDocument, degrees } = PDFLib; // นำเข้าคำสั่ง degrees สำหรับใช้หมุน
                const finalPdf = await PDFDocument.create();

                // Cache สำหรับ PDF ที่ถูกโหลดโดย pdf-lib เพื่อไม่ให้ต้องโหลดซ้ำ
                const pdfLibCache = {};

                for (const pageInfo of pagesState) {
                    if (!pdfLibCache[pageInfo.pdfId]) {
                        // ดึงข้อมูล Buffer ใหม่จาก File object โดยตรง เพื่อป้องกัน Detached Buffer อย่างเด็ดขาด
                        const file = loadedPdfs[pageInfo.pdfId];
                        const arrayBuffer = await file.arrayBuffer();
                        pdfLibCache[pageInfo.pdfId] = await PDFDocument.load(arrayBuffer);
                    }
                    const sourcePdf = pdfLibCache[pageInfo.pdfId];
                    // คัดลอกหน้าตาม index ที่ระบุ
                    const [copiedPage] = await finalPdf.copyPages(sourcePdf, [pageInfo.pageIndex]);
                    
                    // ถ้าระบุให้หมุน ให้ตั้งค่าองศาการหมุนบวกเพิ่มเข้าไปจากของเดิม
                    if (pageInfo.userRotation) {
                        const currentRotation = copiedPage.getRotation().angle;
                        copiedPage.setRotation(degrees(currentRotation + pageInfo.userRotation));
                    }

                    finalPdf.addPage(copiedPage);
                }

                const pdfBytes = await finalPdf.save();
                
                // ล้าง URL เก่าคืนหน่วยความจำ
                if (finalPdfBlobUrl) URL.revokeObjectURL(finalPdfBlobUrl);

                // สร้าง Blob URL สำหรับปุ่มดาวน์โหลด
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                finalPdfBlobUrl = URL.createObjectURL(blob);

                // --- เปลี่ยนมาใช้ PDF.js วาด Canvas แทน Iframe ---
                const previewContainer = document.getElementById('pdf-preview-container');
                previewContainer.innerHTML = ''; // ล้างหน้าต่างพรีวิวเดิม

                showLoading(true, 'กำลังสร้างภาพตัวอย่างหน้าจอ...');
                
                // นำไฟล์ที่รวมเสร็จมาอ่านด้วย PDF.js
                const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
                const mergedPdfDoc = await loadingTask.promise;
                
                for (let pageNum = 1; pageNum <= mergedPdfDoc.numPages; pageNum++) {
                    const page = await mergedPdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.2 }); // ขนาดสเกลภาพกำลังดี
                    
                    const canvas = document.createElement('canvas');

                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    previewContainer.appendChild(canvas);
                }
                
                // อัปเดต UI
                pageCountTxt.innerText = `รวมทั้งหมด ${pagesState.length} หน้า`;
                downloadBtn.disabled = false;

            } catch (error) {
                console.error(error);

            }
        }

            if (!finalPdfBlobUrl) return;
            const a = document.createElement('a');
            a.href = finalPdfBlobUrl;
            a.download = `merged_document_${new Date().getTime()}.pdf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        let uniqueCategories = [];

        async function fetchGoogleSheetsData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('ไม่สามารถเชื่อมต่อกับฐานข้อมูล Google Sheets ได้');
                
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processData(results.data);
                    },
                    error: function(err) {
                        showError('การประมวลผลข้อมูลล้มเหลว: ' + err.message);
                    }
                });
            } catch (error) {
                showError('เกิดข้อผิดพลาดในการโหลดข้อมูล<br><span class="text-sm font-normal mt-2 block text-gray-500">โปรดตรวจสอบว่าเปิดการแชร์ลิงก์ Google Sheets เป็น "ทุกคนที่มีลิงก์ (Anyone with the link)" แล้วหรือไม่</span>');
                console.error(error);
            }
        }

        function processData(rows) {
            // เงื่อนไขที่ 2: เริ่มใช้ข้อมูลตั้งแต่แถวที่ 2 เป็นต้นไป (ตัดแถวที่ 1 ซึ่งเป็น Header ออก)
            const dataRows = rows.slice(1);
            let tempCategories = new Set();

            formsData = dataRows.map((row, index) => {
                const colA = row[0] ? row[0].trim() : ''; // ประเภท (หมวดหมู่)
                const colB = row[1] ? row[1].trim() : ''; // ชื่อรายการ
                const colC = row[2] ? row[2].trim() : ''; // ลิงก์

                if (!colB) return null;

                // เงื่อนไขที่ 3: แยกหมวดหมู่ด้วยลูกน้ำ (,) เพื่อรองรับ 1 รายการอยู่หลายหมวดหมู่
                const categories = colA.split(',').map(c => c.trim()).filter(c => c !== '');
                if (categories.length === 0) categories.push('ทั่วไป');

                categories.forEach(c => tempCategories.add(c));

                return {
                    id: index,
                    categories: categories,
                    name: colB,
                    url: colC || '#'
                };
            }).filter(item => item !== null);

            // เรียงลำดับชื่อตามตัวเลขแบบธรรมชาติ (Natural Sort)
            formsData.sort((a, b) => a.name.localeCompare(b.name, 'th', { numeric: true }));

            uniqueCategories = ['ทั้งหมด', ...Array.from(tempCategories).sort()];

                btn.textContent = category;
                
                btn.onclick = () => {
                    currentCategory = category;
                    renderCategoryButtons();
                    renderContent();
                };
                
                container.appendChild(btn);

        }

                btnGrid.className = 'view-btn inactive px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2';
            }

            renderContent();
        }

        function getFileIcon(url) {
            const lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('word') || lowerUrl.includes('document') || lowerUrl.includes('.doc')) {
                return { class: "fa-solid fa-file-word text-blue-600", bg: "bg-blue-100/50", border: "border-blue-100" };
            } else if (lowerUrl.includes('excel') || lowerUrl.includes('spreadsheet') || lowerUrl.includes('.xls')) {
                return { class: "fa-solid fa-file-excel text-emerald-600", bg: "bg-emerald-100/50", border: "border-emerald-100" };
            } else if (lowerUrl.includes('drive') || lowerUrl.includes('google')) {
                return { class: "fa-brands fa-google-drive text-yellow-500", bg: "bg-yellow-100/50", border: "border-yellow-100" };
            } else if (lowerUrl.includes('pdf')) {
                return { class: "fa-solid fa-file-pdf text-red-500", bg: "bg-red-100/50", border: "border-red-100" };
            } else if (url === '#' || url === '') {
                return { class: "fa-solid fa-file-circle-xmark text-gray-400", bg: "bg-gray-100", border: "border-gray-200" };
            }
            return { class: "fa-solid fa-file-lines text-indigo-500", bg: "bg-indigo-50", border: "border-indigo-100" };
        }

        function handleSearch(value) {
            searchQuery = value.toLowerCase().trim();
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content-display-area');

                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            container.classList.remove('hidden');

            if (currentView === 'grid') {
                // โครงสร้างแบบ Grid/Cards
                container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6";
                
                filteredForms.forEach(form => {
                    const iconStyle = getFileIcon(form.url);
                    const badgesHTML = form.categories.map(cat => 
                        `<span class="px-2 py-0.5 bg-gray-100 text-gray-600 text-[10px] rounded font-medium border border-gray-200">${cat}</span>`

                                <h3 class="text-base font-semibold text-gray-800 mb-3 leading-tight line-clamp-3">${form.name}</h3>
                                <div class="flex flex-wrap gap-1.5 mb-6 mt-auto">
                                    ${badgesHTML}
                                </div>
                            </div>
                            <a href="${isNoLink ? 'javascript:void(0)' : form.url}" ${isNoLink ? '' : 'target="_blank" rel="noopener noreferrer"'} 
                               class="relative z-10 w-full flex items-center justify-center px-4 py-2.5 text-sm font-medium rounded-xl transition-colors duration-200 ${btnClass}">
                                ${isNoLink ? 'ไม่มีไฟล์แนบ' : '<i class="fa-solid fa-download mr-2"></i> โหลดเอกสาร'}

                        </div>
                    `;
                });
            } else {
                // โครงสร้างแบบ List/Rows
                container.className = "flex flex-col gap-3";
                
                filteredForms.forEach(form => {
                    const iconStyle = getFileIcon(form.url);
                    const badgesHTML = form.categories.map(cat => 
                        `<span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-md font-medium whitespace-nowrap">${cat}</span>`
                    ).join('');

                    const isNoLink = form.url === '#' || form.url === '';
                    const btnClass = isNoLink ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-primary text-white hover:bg-secondary shadow-sm shadow-indigo-200';

                    container.innerHTML += `
                        <div class="bg-white rounded-xl p-4 border border-gray-200 list-hover flex flex-col md:flex-row md:items-center gap-4 group">
                            <div class="flex items-center gap-4 flex-grow">
                                <div class="w-10 h-10 flex-shrink-0 ${iconStyle.bg} rounded-lg flex items-center justify-center text-lg">

                                </div>
                                <div>
                                    <h3 class="text-base font-semibold text-gray-800 leading-snug group-hover:text-primary transition-colors">${form.name}</h3>
                                    <div class="flex flex-wrap gap-1.5 mt-2 md:hidden">
                                        ${badgesHTML}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="hidden md:flex flex-wrap gap-1.5 justify-end">
                                ${badgesHTML}
                            </div>
                            
                            <div class="mt-3 md:mt-0 md:ml-4 flex-shrink-0 w-full md:w-auto border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                                <a href="${isNoLink ? 'javascript:void(0)' : form.url}" ${isNoLink ? '' : 'target="_blank" rel="noopener noreferrer"'} 
                                   class="w-full md:w-auto inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium rounded-lg transition-all ${btnClass}">
                                    ${isNoLink ? 'ไม่มีไฟล์แนบ' : '<i class="fa-solid fa-download mr-2"></i> ดาวน์โหลด'}
                                </a>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function showError(message) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.getElementById('error-state').classList.add('flex');
            document.getElementById('error-message').innerHTML = message;
        }

        window.addEventListener('DOMContentLoaded', fetchGoogleSheetsData);

    </script>

                    window.open(linkUrl, '_blank');
                }
            }

            const tabList = document.getElementById('tabList');
            tabList.innerHTML = '';
            
            openTabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const isHome = tab.id === 'home';
                
                const tabBtn = document.createElement('div');
                tabBtn.className = `group flex items-center gap-2 px-4 py-2 rounded-t-xl cursor-pointer border-t border-x transition-all duration-200 select-none ${

                    ? 'bg-[#f1f5f9] text-indigo-600 font-bold border-t-2 border-t-indigo-600 border-x-slate-300/80 shadow-[0_-2px_6px_rgba(0,0,0,0.02)] z-10'

                }`;
                tabBtn.setAttribute('onclick', `switchTab('${tab.id}')`);
                
                let iconHtml = '';
                if (isHome) {
                    iconHtml = `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>`;
                } else {
                    iconHtml = `<svg class="w-4 h-4 shrink-0 text-slate-400 group-hover:text-indigo-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;

                tabBtn.innerHTML = `
                    ${iconHtml}
                    <span class="text-xs sm:text-[13px] truncate max-w-[95px] sm:max-w-[150px]">${tab.title}</span>
                    ${!isHome ? `
                        <button onclick="closeTab('${tab.id}', event)" class="p-0.5 rounded-full hover:bg-slate-300/60 text-slate-400 hover:text-red-500 transition-all opacity-60 group-hover:opacity-100 ml-1">

                        </button>
                    ` : ''}
                `;
                tabList.appendChild(tabBtn);
            });
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            renderTabs();
            
            // สลับการแสดงผลของคอนเทนเนอร์เนื้อหา
            const containers = document.querySelectorAll('.tab-content-container');
            containers.forEach(container => {
                if (container.id === `tab-content-${tabId}`) {
                    container.classList.remove('hidden');
                } else {
                    container.classList.add('hidden');
                }
            });

            // อัปเดต Sidebar Highlight
            renderSidebar();
        }

        function openPageTab(tabId, title, templateId) {
            // ค้นหาว่าเปิดแท็บนี้อยู่แล้วหรือไม่
            const existingTab = openTabs.find(t => t.id === tabId);
            if (existingTab) {
                switchTab(tabId);
                return;
            }
            
            // จำกัดแท็บสูงสุดที่ 12 แท็บ
            if (openTabs.length >= 12) {
                alert('คุณเปิดระบบงานย่อยเยอะเกินไป กรุณาปิดแท็บระบบที่ไม่ใช้งานออกบ้างเพื่อความเร็วในการคำนวณของเบราว์เซอร์');
                return;
            }
            
            // เพิ่มสถานะแท็บ
            openTabs.push({ id: tabId, title: title, templateId: templateId, type: 'iframe' });
            
            // สร้างคอนเทนเนอร์ iframe และเพิ่มเข้าไปใน DOM
            const contentsContainer = document.getElementById('tabContentsContainer');
            const newTabContent = document.createElement('div');
            newTabContent.id = `tab-content-${tabId}`;
            newTabContent.className = 'tab-content-container w-full h-full flex flex-col hidden animate-fade-in';
            
            const iframe = document.createElement('iframe');
            iframe.className = 'w-full h-full border-0 bg-white';
            newTabContent.appendChild(iframe);
            contentsContainer.appendChild(newTabContent);
            
            // ดึงข้อมูลและเขียนโค้ด HTML ลงใน IFrame
            const template = document.getElementById(templateId);
            if (template) {
                const iframeDoc = iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(template.innerHTML);
                iframeDoc.close();
            } else {
                console.error(`Template ${templateId} not found`);
                iframe.srcdoc = `<div style="font-family: sans-serif; padding: 40px; text-align: center; color: #64748b;">
                    <h2>ไม่พบหน้าเพจที่เลือก</h2>
                    <p>รหัสระบบงาน ${templateId} ยังไม่ได้รับการติดตั้งโค้ดภายในบิลด์นี้</p>
                </div>`;
            }
            
            switchTab(tabId);
        }

        function closeTab(tabId, event) {
            if (event) {
                event.stopPropagation();
            }
            
            const tabIndex = openTabs.findIndex(t => t.id === tabId);
            if (tabIndex === -1) return;
            
            // ลบแท็บออกจากสถานะ
            openTabs.splice(tabIndex, 1);
            
            // ลบ iframe ออกจาก DOM
            const contentDOM = document.getElementById(`tab-content-${tabId}`);
            if (contentDOM) {
                contentDOM.remove();
            }
            
            // หากแท็บที่ถูกปิดเป็นแท็บที่กำลังทำงานอยู่ ให้สลับไปแท็บอื่น
            if (activeTabId === tabId) {
                const newActiveIndex = Math.max(0, tabIndex - 1);
                activeTabId = openTabs[newActiveIndex].id;
            }
            
            renderTabs();
            switchTab(activeTabId);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();
            renderTabs();
        });

    </script>
</body>
</html>
