<body class="h-screen flex flex-col overflow-hidden">

    <!-- แถบด้านบน -->
    <header class="bg-blue-800 text-white p-4 shadow-md no-print shrink-0 flex justify-between items-center">
        <div class="flex items-center gap-3">

            <img src="https://github.com/FinanceNangRong/financial-system/raw/main/NRHOS.png" alt="NRHOS Logo" class="h-8 w-auto bg-white rounded-sm p-0.5">
            <h1 class="text-2xl font-bold">1. แบบรายงานเจ้าหนี้คงเหลือ</h1>
        </div>
        <div id="statusBadge" class="text-sm px-3 py-1 rounded-full bg-yellow-100 text-yellow-800 font-medium flex items-center gap-2">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
            </span>
            กำลังโหลดข้อมูล...
        </div>
    </header>

    <!-- ช่องแสดงผล -->
    <main class="flex-1 bg-white overflow-auto p-4 sm:p-6" id="printArea">
        <div id="contentContainer" class="w-full h-full mx-auto">
            <div class="text-center text-gray-400 mt-20 no-print">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 text-gray-300 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <p class="text-lg">กำลังโหลดข้อมูลอัตโนมัติ กรุณารอสักครู่...</p>
            </div>
        </div>
    </main>

    <script>
        let appData = []; 
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vY0-Ic04efRHyFptGVLR3UCipBUBhJiFSCWl_3RDAbQP6cUdQaz53D_1Sru3rg/pub?output=csv";

        // ฟังก์ชันอัปเดตสถานะการโหลดข้อมูล
        function updateStatus(isSuccess) {
            const statusBadge = document.getElementById('statusBadge');
            if (!statusBadge) return;
            
            if (isSuccess) {
                statusBadge.className = "text-sm px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 font-medium flex items-center gap-2";
                statusBadge.innerHTML = `
                    <span class="relative flex h-3 w-3">
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    ข้อมูลพร้อมใช้งาน
                `;
            } else {
                statusBadge.className = "text-sm px-3 py-1 rounded-full bg-red-100 text-red-800 font-medium flex items-center gap-2";
                statusBadge.innerHTML = `
                    <span class="relative flex h-3 w-3">
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                    โหลดข้อมูลล้มเหลว
                `;
            }
        }

        function parseNumberValue(val) {
            if (!val) return 0;
            if (typeof val === 'string') {
                val = val.replace(/,/g, '');
            }
            const num = parseFloat(val);
            return isNaN(num) ? 0 : num;
        }

        function formatNumber(num) {
            const val = parseFloat(num);
            if (isNaN(val) || val === 0) return '0.00';
            return val.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // ฟังก์ชันเตรียมข้อมูลดิบ (คงฟังก์ชันนี้ไว้ทั้งหมดเพื่อความสมบูรณ์ของโครงสร้างข้อมูลแม้จะใช้ไม่ครบในหน้านี้)
        function enrichData(rows) {
            return rows.map(row => {
                row._e = parseNumberValue(row[4]);
                row._f = parseNumberValue(row[5]);
                row._g = parseNumberValue(row[6]);
                row._h = parseNumberValue(row[7]);
                
                let valM = String(row[12] || '').trim();
                row._valM = valM === '' ? 'ไม่ระบุหมวดหมู่' : valM;

                return row;
            });
        }

        function processRawData(data) {
            if(data.length < 5) {
                alert("ข้อมูลมีน้อยกว่า 5 แถว ไม่สามารถแสดงผลได้");
                updateStatus(false);
                return;
            }
            
            let rawRows = data.slice(4).filter(row => row.length > 0 && row.some(cell => cell !== "" && cell !== null && cell !== undefined));
            appData = enrichData(rawRows);

            updateStatus(true);
            renderReport1(document.getElementById('contentContainer'));
        }

        // ฟังก์ชันดึงข้อมูลจาก Google Sheet
        function fetchGoogleSheetData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    processRawData(results.data);
                },
                error: function(err) {
                    console.error("Error fetching data:", err);
                    updateStatus(false);
                    document.getElementById('contentContainer').innerHTML = `<div class="text-center text-red-500 mt-20 no-print"><p class="text-xl">ไม่สามารถโหลดข้อมูลได้ โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต</p></div>`;
                }
            });
        }

        // ==========================================
        // รายงานที่ 1: แบบรายงานเจ้าหนี้คงเหลือ
        // ==========================================
        function renderReport1(container) {
            if (appData.length === 0) return;

            const groupedData = {};
            
            // ประมวลผลและจัดกลุ่มข้อมูลตามหมวดหมู่
            appData.forEach(row => {
                let valM = row._valM;
                
                if (valM === 'ไม่ระบุหมวดหมู่') {
                     if(row._e === 0 && row._f === 0 && row._g === 0 && row._h === 0) return;
                }

                if (!groupedData[valM]) {
                    groupedData[valM] = { E: 0, F: 0, G: 0, H: 0 };
                }

                groupedData[valM].E += row._e;
                groupedData[valM].F += row._f;
                groupedData[valM].G += row._g;
                groupedData[valM].H += row._h;
            });

            // สร้างส่วนหัว HTML
            let headerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-6 gap-4 no-print">
                    <h3 class="text-2xl font-bold text-gray-800">แบบรายงานเจ้าหนี้คงเหลือ</h3>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="exportExcel()" class="flex-1 sm:flex-none bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded shadow flex items-center justify-center gap-2 transition-colors shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            ส่งออก Excel
                        </button>
                        <button onclick="window.print()" class="flex-1 sm:flex-none bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded shadow flex items-center justify-center gap-2 transition-colors shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                            </svg>
                            พิมพ์รายงาน
                        </button>
                    </div>
                </div>
            `;

            // สร้างส่วนตาราง HTML
            let tableHTML = `
                <div class="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm">
                    <table class="w-full text-sm text-left report1-table-print">
                        <thead class="bg-blue-50 text-blue-900 border-b border-gray-200">
                            <tr>
                                <th class="px-4 py-3 font-semibold text-center w-16">ลำดับ</th>
                                <th class="px-4 py-3 font-semibold text-center min-w-[250px] w-auto">ค่า</th>
                                <th class="px-4 py-3 font-semibold text-center w-32 sm:w-40">จำนวนเงิน</th>
                                <th class="px-4 py-3 font-semibold text-center w-32 sm:w-40">จ่าย</th>
                                <th class="px-4 py-3 font-semibold text-center w-32 sm:w-40">ปรับปรุง</th>
                                <th class="px-4 py-3 font-semibold text-center w-32 sm:w-40">คงเหลือ</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
            `;

            let index = 1;
            let sumE = 0, sumF = 0, sumG = 0, sumH = 0;
            const keys = Object.keys(groupedData).sort(); 

            if (keys.length === 0) {
                tableHTML += `<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">ไม่พบข้อมูลในตาราง</td></tr>`;
            } else {
                keys.forEach(key => {
                    const data = groupedData[key];
                    sumE += data.E; sumF += data.F; sumG += data.G; sumH += data.H;

                    tableHTML += `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-2 text-center text-gray-500">${index++}</td>
                            <td class="px-4 py-2 text-gray-800 font-medium truncate max-w-[200px] sm:max-w-[300px] md:max-w-[400px] lg:max-w-[500px] print-truncate" title="${key}">${key}</td>
                            <td class="px-4 py-2 text-right text-gray-800">${formatNumber(data.E)}</td>
                            <td class="px-4 py-2 text-right text-gray-800">${formatNumber(data.F)}</td>
                            <td class="px-4 py-2 text-right text-gray-800">${formatNumber(data.G)}</td>
                            <td class="px-4 py-2 text-right text-blue-700 font-semibold">${formatNumber(data.H)}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                        <tfoot class="bg-gray-100 border-t-2 border-gray-300 font-bold">
                            <tr>
                                <td colspan="2" class="px-4 py-3 text-center text-gray-800">รวมทั้งสิ้น</td>
                                <td class="px-4 py-3 text-right text-gray-900">${formatNumber(sumE)}</td>
                                <td class="px-4 py-3 text-right text-gray-900">${formatNumber(sumF)}</td>
                                <td class="px-4 py-3 text-right text-gray-900">${formatNumber(sumG)}</td>
                                <td class="px-4 py-3 text-right text-blue-800">${formatNumber(sumH)}</td>
                            </tr>
                        </tfoot>
                `;
            }

            tableHTML += `
                    </table>
                </div>
            `;

            container.innerHTML = headerHTML + tableHTML;
        }

        // ฟังก์ชันสำหรับส่งออกข้อมูลเป็น Excel
        function exportExcel() {
            if (appData.length === 0) {
                alert("ไม่มีข้อมูลสำหรับส่งออก");
                return;
            }

            const groupedData = {};
            
            // ประมวลผลข้อมูล
            appData.forEach(row => {
                let valM = row._valM;
                if (valM === 'ไม่ระบุหมวดหมู่') {
                     if(row._e === 0 && row._f === 0 && row._g === 0 && row._h === 0) return;
                }
                if (!groupedData[valM]) groupedData[valM] = { E: 0, F: 0, G: 0, H: 0 };
                groupedData[valM].E += row._e;
                groupedData[valM].F += row._f;
                groupedData[valM].G += row._g;
                groupedData[valM].H += row._h;
            });

            // สร้าง Array สำหรับข้อมูล Excel
            const ws_data = [
                ["ลำดับ", "ค่า", "จำนวนเงิน", "จ่าย", "ปรับปรุง", "คงเหลือ"]
            ];

            let index = 1;
            let sumE = 0, sumF = 0, sumG = 0, sumH = 0;
            const keys = Object.keys(groupedData).sort(); 

            keys.forEach(key => {
                const data = groupedData[key];
                sumE += data.E; sumF += data.F; sumG += data.G; sumH += data.H;
                ws_data.push([
                    index++, 
                    key, 
                    data.E, 
                    data.F, 
                    data.G, 
                    data.H
                ]);
            });

            // แถวสรุปยอดรวม
            ws_data.push([

                <div class="w-full flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                    <div class="flex-1 w-full">
                        
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-sm space-y-4">
                            <div class="flex flex-col sm:flex-row gap-6">
                                <div class="flex flex-col items-start gap-2">

                                        </button>

                        <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow flex items-center gap-2">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg> ดาวน์โหลด Excel
                        </button>
                        <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded shadow flex items-center gap-2">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg> พิมพ์รายงาน

            <div id="tableContainer">
                <div class="text-center text-gray-400 mt-20 no-print" id="loadingText">กำลังโหลดข้อมูลอัตโนมัติ กรุณารอสักครู่...</div>

    </main>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vY0-Ic04efRHyFptGVLR3UCipBUBhJiFSCWl_3RDAbQP6cUdQaz53D_1Sru3rg/pub?output=csv";
        let appData = [];
        
        let selectedCategories_forReport12 = []; 
        let currentAvailableCategories12 = []; 
        let report12DropdownOpen = false;
        let selectedFiscalYear_forReport12 = "";

        function updateStatus(success) {
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.className = `text-sm px-3 py-1 rounded-full ${success ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'} font-medium flex items-center gap-2`;
                badge.innerHTML = `<span class="relative flex h-3 w-3"><span class="relative inline-flex rounded-full h-3 w-3 ${success ? 'bg-emerald-500' : 'bg-red-500'}"></span></span>${success ? 'ข้อมูลพร้อมใช้งาน' : 'โหลดล้มเหลว'}`;
            }
        }

        function parseNumberValue(v) {
            if (!v) return 0;
            if (typeof v === 'string') v = v.replace(/,/g, '');
            const n = parseFloat(v);
            return isNaN(n) ? 0 : n;
        }

        function formatNumber(n) {
            const v = parseFloat(n);
            return (isNaN(v) || v === 0) ? '0.00' : v.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getJSDate(v) {
            if (!v) return null;
            if (typeof v === 'number') return new Date(new Date(Date.UTC(1899, 11, 30)).getTime() + v * 86400000);
            
            const p = String(v).trim().split(/[-/]/);
            if (p.length === 3) {
                let d = parseInt(p[0]), m = parseInt(p[1]) - 1, y = parseInt(p[2]);
                if (p[0].length === 4) {
                    y = parseInt(p[0]); m = parseInt(p[1]) - 1; d = parseInt(p[2]);
                }
                if (y < 100) y += y >= 50 ? 2500 : 2000;
                if (y > 2400) y -= 543;
                return new Date(y, m, d);
            }
            return isNaN(new Date(v).getTime()) ? null : new Date(v);
        }

        const parseDateForFilter = (s) => {
            if (!s || String(s).trim() === '-' || String(s).trim() === '') return null;
            let c = String(s).trim();
            
            const p = c.split(/[\/\-]/);
            if (p.length === 3) {
                let d = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, y = parseInt(p[2], 10);
                if (p[0].length === 4) {
                    y = parseInt(p[0], 10); m = parseInt(p[1], 10) - 1; d = parseInt(p[2], 10);
                }
                if (y < 100) y += y > 40 ? 2500 : 2000;
                if (y >= 2400) y -= 543;
                let dObj = new Date(y, m, d);
                if (!isNaN(dObj.getTime())) return dObj.getTime();
            }
            
            const tS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            const tF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
            const tM = c.match(/(\d{1,2})\s+([ก-๙\.]+)\s+(\d{2,4})/);
            
            if (tM) {
                let d = parseInt(tM[1], 10), mo = tM[2], y = parseInt(tM[3], 10);
                let m = tS.findIndex(t => mo.includes(t));
                if (m === -1) m = tF.findIndex(t => mo.includes(t));
                if (m === -1) m = 0;
                if (y < 100) y += y > 40 ? 2500 : 2000;
                if (y >= 2400) y -= 543;
                return new Date(y, m, d).getTime();
            }
            
            if (!isNaN(c) && Number(c) > 10000) {
                return new Date(Date.UTC(1899, 11, 30)).getTime() + Number(c) * 86400000;
            }
            
            let dObj = new Date(c);
            return isNaN(dObj.getTime()) ? null : dObj.getTime();
        };

        function formatThaiDate(v, s = false) {
            if (!v) return '-';
            let d, m, y;
            if (typeof v === 'number') {
                const doObj = new Date(new Date(Date.UTC(1899, 11, 30)).getTime() + v * 86400000);
                d = doObj.getUTCDate();
                m = doObj.getUTCMonth() + 1;
                y = doObj.getUTCFullYear();
                if (y < 2500) y += 543;
            } else {
                let ds = String(v).trim();
                const p = ds.split(/[-/]/);
                if (p.length === 3) {
                    d = parseInt(p[0]); m = parseInt(p[1]); y = parseInt(p[2]);
                    if (p[0].length === 4) {
                        y = parseInt(p[0]); m = parseInt(p[1]); d = parseInt(p[2]);
                    }
                    if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
                        if (y < 100) y += y >= 50 ? 2500 : 2000;
                        if (y < 2500) y += 543;
                    } else return ds;
                } else return ds;
            }
            return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${s ? String(y).slice(-2) : y}`;
        }

        function formatThaiDateShort(v) {
            if (!v) return '-';
            const jd = getJSDate(v);
            if (!jd) return String(v);
            const tS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            return `${jd.getDate()} ${tS[jd.getMonth()]} ${String(jd.getFullYear()).slice(-2)}`;
        }

        function filterDropdownOptions(i, t) {
            const c = document.getElementById(i);
            if (!c) return;
            const ls = c.getElementsByTagName('label');
            const f = t.toLowerCase().replace(/\s+/g, '');
            for (let j = 0; j < ls.length; j++) {
                const s = ls[j].querySelector('span');
                if (s) {
                    ls[j].style.display = (s.textContent || s.innerText).toLowerCase().replace(/\s+/g, '').indexOf(f) > -1 ? "" : "none";
                }
            }
        }

        function enrichData(rows) {
            return rows.map(r => {
                r._e = parseNumberValue(r[4]);
                r._f = parseNumberValue(r[5]);
                r._g = parseNumberValue(r[6]);
                r._h = parseNumberValue(r[7]);
                r._compC = String(r[2] || '').trim();
                r._compCSearch = r._compC.toLowerCase().replace(/\s+/g, '');
                r._invD = r[3] || '-';
                r._valM = String(r[12] || '').trim() || 'ไม่ระบุหมวดหมู่';
                r._dept = String(r[13] || '').trim();
                r._status = String(r[22] || '').trim();
                r._taxId = String(r[21] || '').trim();
                
                r._dateRecTs = parseDateForFilter(r[1]);
                r._datePayTs = parseDateForFilter(r[8]);
                
                let jd = getJSDate(r[23]);
                r._dateProcessTs = jd ? jd.getTime() : null;
                
                r._dateRecStr = formatThaiDate(r[1]);
                r._datePayStr = formatThaiDate(r[8]);
                r._dateProcessStr = formatThaiDate(r[23], true);
                r._dateProcessStrShort = formatThaiDateShort(r[23]);
                
                return r;
            });
        }

        // Logic Report 4
        function getFiscalYear(dateTs) {
            if (!dateTs) return null;
            const d = new Date(dateTs);
            let y = d.getFullYear(); 
            // ปีงบประมาณไทย เริ่ม 1 ตุลาคม (เดือน 9 ใน JS Date)
            if (d.getMonth() >= 9) y += 1; 
            return String(y + 543);
        }

        function toggleReport12Dropdown() {
            report12DropdownOpen = !report12DropdownOpen;
            const dd = document.getElementById('catDropdown12');
            if (dd) {
                report12DropdownOpen ? dd.classList.remove('hidden') : dd.classList.add('hidden');
            }
        }

        function updateCategoryButtonText() {
            const btnText = document.getElementById('catDropdownBtnText');
            if (btnText) {
                btnText.textContent = selectedCategories_forReport12.length > 0 
                    ? selectedCategories_forReport12.join(', ') 
                    : '-- กรุณาเลือกหมวดหมู่ --';
            }
        }

        function selectAllCategories12() { 
            selectedCategories_forReport12 = [...currentAvailableCategories12]; 
            const checkboxes = document.querySelectorAll('.category-checkbox');
            checkboxes.forEach(cb => cb.checked = true);
            updateCategoryButtonText();
            renderTable(); 
        }

        function clearAllCategories12() { 
            selectedCategories_forReport12 = []; 
            const checkboxes = document.querySelectorAll('.category-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            updateCategoryButtonText();
            renderTable(); 
        }

        function updateReport12CategoryFilter(val, isChecked) {
            if (isChecked) { 
                if (!selectedCategories_forReport12.includes(val)) selectedCategories_forReport12.push(val); 
            } else { 
                selectedCategories_forReport12 = selectedCategories_forReport12.filter(item => item !== val); 
            }
            updateCategoryButtonText();
            renderTable();
        }

        function changeFiscalYear12(val) { 
            selectedFiscalYear_forReport12 = val; 
            renderTable(); 
        }

        window.addEventListener('click', function(e) {
            const dd = document.getElementById('catDropdown12');
            const btn = document.getElementById('catDropdownBtn12');
            if (dd && btn && report12DropdownOpen && !dd.contains(e.target) && !btn.contains(e.target)) {
                report12DropdownOpen = false; 
                dd.classList.add('hidden');
            }
        });

        function setupFilters() {
            const uniqueCategoriesSet = new Set();
            const uniqueFYsSet = new Set();
            
            appData.forEach(row => {
                if (row._e === 0 && row._f === 0 && row._g === 0 && row._h === 0) return;
                uniqueCategoriesSet.add(row._valM);
                const fy = getFiscalYear(row._dateRecTs);
                if (fy) uniqueFYsSet.add(fy);
            });
            
            currentAvailableCategories12 = [...uniqueCategoriesSet].sort();
            const uniqueFYs = [...uniqueFYsSet].sort((a, b) => Number(b) - Number(a));

            if (typeof window.report12Initialized === 'undefined') {
                selectedCategories_forReport12 = [];
                selectedFiscalYear_forReport12 = uniqueFYs.length > 0 ? uniqueFYs[0] : "";
                window.report12Initialized = true;
            }

            const fySelect = document.getElementById('fiscalYearSelect');
            if(fySelect) {
                let fyOptions = `<option value="">-- แสดงทุกปีงบประมาณ --</option>`;
                uniqueFYs.forEach(fy => {
                    fyOptions += `<option value="${fy}" ${selectedFiscalYear_forReport12 === fy ? 'selected' : ''}>${fy}</option>`;
                });
                fySelect.innerHTML = fyOptions;
            }

            const catList = document.getElementById('catListContainer12');
            if(catList) {
                if (currentAvailableCategories12.length > 0) {
                    catList.innerHTML = currentAvailableCategories12.map(cat => `
                        <label class="flex items-center py-2 cursor-pointer hover:bg-gray-50 border-b border-gray-100 last:border-0">
                            <input type="checkbox" value="${cat}" ${selectedCategories_forReport12.includes(cat) ? 'checked' : ''} class="category-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded mr-3">
                            <span class="text-sm text-gray-700">${cat}</span>
                        </label>
                    `).join('');
                    
                    const checkboxes = catList.querySelectorAll('.category-checkbox');
                    checkboxes.forEach(cb => {
                        cb.addEventListener('change', (e) => {
                            updateReport12CategoryFilter(e.target.value, e.target.checked);
                        });
                    });
                } else {
                    catList.innerHTML = '<div class="py-2 text-sm text-gray-500">ไม่พบหมวดหมู่</div>';
                }
            }

            document.getElementById('filterSection').classList.remove('hidden');
            document.getElementById('filterSection').classList.add('flex');
            updateCategoryButtonText();
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            if (!container) return;

            // กรองข้อมูลพื้นฐานตามหมวดหมู่ที่เลือก
            let baseFilteredData = appData.filter(row => {
                if (row._e === 0 && row._f === 0 && row._g === 0 && row._h === 0) return false;
                if (selectedCategories_forReport12.length === 0) return false;
                if (!selectedCategories_forReport12.includes(row._valM)) return false;
                return true;
            });

            // หาปีงบประมาณที่ต้องแสดง
            let yearsToRender = [];
            if (selectedFiscalYear_forReport12) {
                yearsToRender = [selectedFiscalYear_forReport12];
            } else {
                const uniqueYears = new Set();
                baseFilteredData.forEach(row => {
                    const fy = getFiscalYear(row._dateRecTs);
                    if (fy) uniqueYears.add(fy);
                });
                yearsToRender = [...uniqueYears].sort((a, b) => Number(b) - Number(a)); // เรียงปีล่าสุดขึ้นก่อน
            }

            if (selectedCategories_forReport12.length === 0 || yearsToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-8 bg-white rounded-lg border border-gray-200 shadow-sm mt-4">ไม่พบข้อมูลตามเงื่อนไขที่เลือก หรือยังไม่ได้เลือกหมวดหมู่</div>`;
                return;
            }

            const fiscalMonths = [
                { m: 9, label: 'ต.ค.' }, { m: 10, label: 'พ.ย.' }, { m: 11, label: 'ธ.ค.' },
                { m: 0, label: 'ม.ค.' }, { m: 1, label: 'ก.พ.' }, { m: 2, label: 'มี.ค.' },
                { m: 3, label: 'เม.ย.' }, { m: 4, label: 'พ.ค.' }, { m: 5, label: 'มิ.ย.' },
                { m: 6, label: 'ก.ค.' }, { m: 7, label: 'ส.ค.' }, { m: 8, label: 'ก.ย.' }
            ];

            let allHtml = "";

            yearsToRender.forEach(currentYear => {
                // ดึงข้อมูลเฉพาะปีงบประมาณรอบนี้
                let yearData = baseFilteredData.filter(row => getFiscalYear(row._dateRecTs) === currentYear);
                
                if (yearData.length === 0) return; // ข้ามถ้าไม่มีข้อมูลในปีนี้

                const pivotData = {};
                let totalCols = { total: 0 };
                fiscalMonths.forEach(fm => totalCols[fm.m] = 0);

                yearData.forEach(row => {
                    const cat = row._valM;
                    if (!pivotData[cat]) {
                        pivotData[cat] = { total: 0 };
                        fiscalMonths.forEach(fm => pivotData[cat][fm.m] = 0);
                    }
                    if (row._dateRecTs) {
                        const d = new Date(row._dateRecTs);
                        const monthStr = d.getMonth();
                        const valToSum = row._h; 
                        if (pivotData[cat][monthStr] !== undefined) {
                            pivotData[cat][monthStr] += valToSum;
                            pivotData[cat].total += valToSum;
                            totalCols[monthStr] += valToSum;
                            totalCols.total += valToSum;
                        }
                    }
                });

                let printTitle = `รายงานแยกประเภท ประจำปีงบประมาณ แบบสรุปรายเดือน ประจำปีงบประมาณ ${currentYear}`;

                let monthHeaders = '';
                fiscalMonths.forEach(fm => {
                    let fy = parseInt(currentYear);
                    let yearLabel = "";
                    if (fm.m >= 9) yearLabel = ` ${(fy - 1).toString().slice(-2)}`;
                    else yearLabel = ` ${fy.toString().slice(-2)}`;
                    monthHeaders += `<th class="px-2 py-3 font-semibold text-center border border-gray-300 w-[95px] min-w-[95px] whitespace-nowrap bg-blue-100 print:static print:bg-blue-50">${fm.label}${yearLabel}</th>`;
                });

                let html = `
                    <div class="mb-10 last:mb-0">
                        <h3 class="text-xl font-bold text-center mb-4 print-only">${printTitle}</h3>
                        <h4 class="text-lg font-bold text-gray-800 mb-2 no-print border-l-4 border-blue-600 pl-3">ตารางประจำปีงบประมาณ ${currentYear}</h4>
                        <div class="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm" style="max-height: 60vh;">
                            <table class="min-w-full text-sm text-left border-collapse print-fixed-table" style="table-layout: auto;">
                                <thead class="bg-blue-100 text-blue-900 border-b-2 border-gray-300">
                                    <tr>
                                        <th class="px-3 py-3 font-semibold text-center border border-gray-300 w-[47px] min-w-[47px] sticky left-0 z-20 bg-blue-100 print:static print:bg-blue-50">ลำดับ</th>
                                        <th class="px-4 py-3 font-semibold text-center border border-gray-300 w-[200px] min-w-[200px] max-w-[200px] sticky left-[47px] z-20 bg-blue-100 print:static print:bg-blue-50">ค่า</th>
                                        ${monthHeaders}
                                        <th class="px-3 py-3 font-bold text-center border border-gray-300 w-[114px] min-w-[114px] bg-blue-200 print:static print:bg-blue-100">รวมทั้งสิ้น</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200 bg-white">
                `;

                const catKeys = Object.keys(pivotData).sort();

                let index = 1;
                catKeys.forEach(catKey => {
                    const rowData = pivotData[catKey];
                    html += `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-3 py-2 text-center text-gray-500 border border-gray-200 sticky left-0 z-10 bg-white print:static">${index++}</td>
                            <td class="px-4 py-2 text-gray-800 font-medium border border-gray-200 sticky left-[47px] z-10 bg-white print:static truncate print-truncate w-[200px] max-w-[200px]" title="${catKey}">${catKey}</td>
                    `;
                    fiscalMonths.forEach(fm => {
                        const val = rowData[fm.m];
                        html += `<td class="px-2 py-2 text-right text-gray-700 border border-gray-200 w-[95px] min-w-[95px]">${val !== 0 ? formatNumber(val) : ''}</td>`;
                    });
                    html += `<td class="px-2 py-2 text-right text-blue-700 font-bold border border-gray-200 bg-blue-50/30 print:bg-transparent w-[114px] min-w-[114px]">${formatNumber(rowData.total)}</td></tr>`;
                });

                html += `
                                </tbody>

                    } else {
                        sheetName = text.substring(0, 31); // ชื่อ Sheet ใน Excel ห้ามยาวเกิน 31 ตัวอักษร
                    }

                // แปลงข้อมูลตารางเป็น Worksheet

                const wscols = [

                    wscols.push({wch: 15});
                }
                ws['!cols'] = wscols;

                // เพิ่ม Worksheet ลงใน Workbook
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            // สร้างชื่อไฟล์ตามวันที่ปัจจุบัน
            const today = new Date();
            const dateStr = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear() + 543}`;

            // ดาวน์โหลดไฟล์
            XLSX.writeFile(wb, fileName);
        }

        // Init App
        document.addEventListener('DOMContentLoaded', () => {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, 
                header: false,
                complete: function(results) {
                    if(results.data.length < 5) return updateStatus(false);

                    appData = enrichData(results.data.slice(4).filter(r => r.length > 0 && r.some(c => c !== "")));
                    updateStatus(true);
                    setupFilters();
                    renderTable();
                }, 
                error: function() { 
                    updateStatus(false); 
                }
            });
        });

<body class="h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md no-print shrink-0 flex justify-between items-center">

            <h1 class="text-2xl font-bold">7. ทะเบียนคุมส่งทำเช็ค</h1>
        </div>
        <div id="statusBadge" class="text-sm px-3 py-1 rounded-full bg-yellow-100 text-yellow-800 font-medium flex items-center gap-2">
            กำลังโหลดข้อมูล...
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 bg-white overflow-auto p-6 print-full-width" id="printArea">
        <div id="contentContainer" class="max-w-7xl mx-auto">
            <div class="text-center text-gray-400 mt-20 no-print">กำลังโหลดข้อมูลอัตโนมัติ กรุณารอสักครู่...</div>
        </div>
    </main>

    <script>
        // URL สำหรับดึงข้อมูลจาก Google Sheets รูปแบบ CSV
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-vY0-Ic04efRHyFptGVLR3UCipBUBhJiFSCWl_3RDAbQP6cUdQaz53D_1Sru3rg/pub?output=csv";
        let appData = [];
        
        // ตัวแปรสำหรับเก็บค่า Filter
        let startDate_forReport5 = "";
        let endDate_forReport5 = "";
        let selectedCategoriesM_forReport5 = []; 
        let selectedCompanies_forReport5 = []; 
        let currentAvailableCompanies5 = []; 
        let currentAvailableCategories5 = []; 
        let report5DropdownOpen = false; 
        let report5CompanyDropdownOpen = false; 

        // ฟังก์ชันอัปเดตสถานะการโหลดข้อมูล
        function updateStatus(isSuccess) {
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.className = `text-sm px-3 py-1 rounded-full ${isSuccess ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'} font-medium flex items-center gap-2`;
                badge.innerHTML = `<span class="relative flex h-3 w-3"><span class="relative inline-flex rounded-full h-3 w-3 ${isSuccess ? 'bg-emerald-500' : 'bg-red-500'}"></span></span>${isSuccess ? 'ข้อมูลพร้อมใช้งาน' : 'โหลดล้มเหลว'}`;
            }
        }

        // ฟังก์ชันแปลงค่าเป็นตัวเลข
        function parseNumberValue(v) {
            if (!v) return 0;
            if (typeof v === 'string') v = v.replace(/,/g, '');
            const n = parseFloat(v);
            return isNaN(n) ? 0 : n;
        }

        // ฟังก์ชันจัดรูปแบบตัวเลข (เพิ่มคอมม่าและทศนิยม 2 ตำแหน่ง)
        function formatNumber(n) {
            const v = parseFloat(n);
            return (isNaN(v) || v === 0) ? '0.00' : v.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // ฟังก์ชันแปลงค่าวันที่จาก Excel/Sheet เป็น JavaScript Date Object
        function getJSDate(v) {
            if (!v) return null;
            if (typeof v === 'number') return new Date(new Date(Date.UTC(1899, 11, 30)).getTime() + v * 86400000);
            
            const p = String(v).trim().split(/[-/]/);
            if (p.length === 3) {
                let d = parseInt(p[0]), m = parseInt(p[1]) - 1, y = parseInt(p[2]);
                if (p[0].length === 4) {
                    y = parseInt(p[0]); m = parseInt(p[1]) - 1; d = parseInt(p[2]);
                }
                if (y < 100) y += y >= 50 ? 2500 : 2000;
                if (y > 2400) y -= 543;
                return new Date(y, m, d);
            }
            return isNaN(new Date(v).getTime()) ? null : new Date(v);
        }

        // ฟังก์ชันแปลงวันที่สำหรับการกรอง (ค้นหา Timestamp)
        const parseDateForFilter = (s) => {
            if (!s || String(s).trim() === '-' || String(s).trim() === '') return null;
            let c = String(s).trim();
            const p = c.split(/[\/\-]/);
            
            if (p.length === 3) {
                let d = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, y = parseInt(p[2], 10);
                if (p[0].length === 4) {
                    y = parseInt(p[0], 10); m = parseInt(p[1], 10) - 1; d = parseInt(p[2], 10);
                }
                if (y < 100) y += y > 40 ? 2500 : 2000;
                if (y >= 2400) y -= 543;
                let dObj = new Date(y, m, d);
                if (!isNaN(dObj.getTime())) return dObj.getTime();
            }
            
            const tS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            const tF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
            const tM = c.match(/(\d{1,2})\s+([ก-๙\.]+)\s+(\d{2,4})/);
            
            if (tM) {
                let d = parseInt(tM[1], 10), mo = tM[2], y = parseInt(tM[3], 10);
                let m = tS.findIndex(t => mo.includes(t));
                if (m === -1) m = tF.findIndex(t => mo.includes(t));
                if (m === -1) m = 0;
                if (y < 100) y += y > 40 ? 2500 : 2000;
                if (y >= 2400) y -= 543;
                return new Date(y, m, d).getTime();
            }
            
            if (!isNaN(c) && Number(c) > 10000) return new Date(Date.UTC(1899, 11, 30)).getTime() + Number(c) * 86400000;
            let dObj = new Date(c);
            return isNaN(dObj.getTime()) ? null : dObj.getTime();
        };

        // ฟังก์ชันจัดรูปแบบวันที่แบบไทย
        function formatThaiDate(v, isShortYear = false) {
            if (!v) return '-';
            let d, m, y;
            if (typeof v === 'number') {
                const doObj = new Date(new Date(Date.UTC(1899, 11, 30)).getTime() + v * 86400000);
                d = doObj.getUTCDate();
                m = doObj.getUTCMonth() + 1;
                y = doObj.getUTCFullYear();
                if (y < 2500) y += 543;
            } else {
                let ds = String(v).trim();
                const p = ds.split(/[-/]/);
                if (p.length === 3) {
                    d = parseInt(p[0]); m = parseInt(p[1]); y = parseInt(p[2]);
                    if (p[0].length === 4) {
                        y = parseInt(p[0]); m = parseInt(p[1]); d = parseInt(p[2]);
                    }
                    if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
                        if (y < 100) y += y >= 50 ? 2500 : 2000;
                        if (y < 2500) y += 543;
                    } else {
                        return ds;
                    }
                } else {
                    return ds;
                }
            }
            return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${isShortYear ? String(y).slice(-2) : y}`;
        }

        // ฟังก์ชันจัดรูปแบบวันที่แบบไทยอย่างย่อ (เช่น 1 ม.ค. 67)
        function formatThaiDateShort(v) {
            if (!v) return '-';
            const jd = getJSDate(v);
            if (!jd) return String(v);
            const tS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            return `${jd.getDate()} ${tS[jd.getMonth()]} ${String(jd.getFullYear()).slice(-2)}`;
        }

        // ฟังก์ชันค้นหาและกรองตัวเลือกใน Dropdown
        function filterDropdownOptions(containerId, text) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const labels = container.getElementsByTagName('label');
            const filterText = text.toLowerCase().replace(/\s+/g, '');
            
            for (let j = 0; j < labels.length; j++) {
                const span = labels[j].querySelector('span');
                if (span) {
                    const optionText = (span.textContent || span.innerText).toLowerCase().replace(/\s+/g, '');
                    labels[j].style.display = optionText.indexOf(filterText) > -1 ? "" : "none";
                }
            }
        }

        // ฟังก์ชันเตรียมและเพิ่มข้อมูลที่จำเป็นลงใน Array ของข้อมูลที่ได้จาก CSV
        function enrichData(rows) {
            return rows.map(r => {
                r._e = parseNumberValue(r[4]);
                r._f = parseNumberValue(r[5]);
                r._g = parseNumberValue(r[6]);
                r._h = parseNumberValue(r[7]);
                r._compC = String(r[2] || '').trim();
                r._compCSearch = r._compC.toLowerCase().replace(/\s+/g, '');
                r._invD = r[3] || '-';
                r._valM = String(r[12] || '').trim() || 'ไม่ระบุหมวดหมู่';
                r._dept = String(r[13] || '').trim();
                r._status = String(r[22] || '').trim();
                r._taxId = String(r[21] || '').trim();
                
                r._dateRecTs = parseDateForFilter(r[1]);
                r._datePayTs = parseDateForFilter(r[8]);
                
                let jd = getJSDate(r[23]);
                r._dateProcessTs = jd ? jd.getTime() : null;
                
                r._dateRecStr = formatThaiDate(r[1]);
                r._datePayStr = formatThaiDate(r[8]);
                r._dateProcessStr = formatThaiDate(r[23], true);
                r._dateProcessStrShort = formatThaiDateShort(r[23]);
                
                return r;
            });
        }

        // จัดรูปแบบวันที่สำหรับแสดงผล HTML Input
        function formatHTMLDate(yyyy_mm_dd) {
            if (!yyyy_mm_dd) return ''; 
            const parts = yyyy_mm_dd.split('-'); 
            if (parts.length !== 3) return yyyy_mm_dd; 
            return `${parts[2]}/${parts[1]}/${parseInt(parts[0]) + 543}`;
        }

        // --- Logic สำหรับการทำงานและการกรอง Report 5 (หรือที่นี่คือ Report 7) ---
        
        function updateReport5Dates(type, val) { 
            if (type === 'start') startDate_forReport5 = val; 
            if (type === 'end') endDate_forReport5 = val; 
            renderReport5(document.getElementById('contentContainer')); 
        }

        function selectAllCompanies5() { 
            selectedCompanies_forReport5 = [...currentAvailableCompanies5]; 
            const checkboxes = document.querySelectorAll('#compListContainer5 input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
            const btnSpan = document.querySelector('#compDropdownBtn5 span');
            if(btnSpan) btnSpan.textContent = selectedCompanies_forReport5.join(', ');
        }

        function clearAllCompanies5() { 
            selectedCompanies_forReport5 = []; 
            const checkboxes = document.querySelectorAll('#compListContainer5 input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            const btnSpan = document.querySelector('#compDropdownBtn5 span');
            if(btnSpan) btnSpan.textContent = '-- เลือกบริษัททั้งหมด --';
        }

        function selectAllCategories5() { 
            selectedCategoriesM_forReport5 = [...currentAvailableCategories5]; 
            const checkboxes = document.querySelectorAll('#catListContainer5 input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
            const btnSpan = document.querySelector('#catDropdownBtn5 span');
            if(btnSpan) btnSpan.textContent = selectedCategoriesM_forReport5.join(', ');
        }

        function clearAllCategories5() { 
            selectedCategoriesM_forReport5 = []; 
            const checkboxes = document.querySelectorAll('#catListContainer5 input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            const btnSpan = document.querySelector('#catDropdownBtn5 span');
            if(btnSpan) btnSpan.textContent = '-- เลือกค่าทั้งหมด --';
        }

        function updateReport5CompanyFilter(val, isChecked) { 
            if (isChecked) { 
                if (!selectedCompanies_forReport5.includes(val)) selectedCompanies_forReport5.push(val); 
            } else { 
                selectedCompanies_forReport5 = selectedCompanies_forReport5.filter(item => item !== val); 
            } 
            const btnSpan = document.querySelector('#compDropdownBtn5 span');
            if(btnSpan) btnSpan.textContent = selectedCompanies_forReport5.length > 0 ? selectedCompanies_forReport5.join(', ') : '-- เลือกบริษัททั้งหมด --';
        }

        function toggleReport5CompanyDropdown() { 
            report5CompanyDropdownOpen = !report5CompanyDropdownOpen; 
            const dd = document.getElementById('compDropdown5'); 
            if (dd) {
                if (report5CompanyDropdownOpen) {
                    dd.classList.remove('hidden');
                } else {
                    dd.classList.add('hidden');
                    renderReport5(document.getElementById('contentContainer')); 
                }
            }
        }

        function toggleReport5Dropdown() { 
            report5DropdownOpen = !report5DropdownOpen; 
            const dd = document.getElementById('catDropdown5'); 
            if (dd) {
                if (report5DropdownOpen) {
                    dd.classList.remove('hidden');
                } else {
                    dd.classList.add('hidden');
                    renderReport5(document.getElementById('contentContainer')); 
                }
            }
        }

        function updateReport5CategoryFilter(val, isChecked) { 
            if (isChecked) { 
                if (!selectedCategoriesM_forReport5.includes(val)) selectedCategoriesM_forReport5.push(val); 
            } else { 
                selectedCategoriesM_forReport5 = selectedCategoriesM_forReport5.filter(item => item !== val); 
            } 
            const btnSpan = document.querySelector('#catDropdownBtn5 span');
            if(btnSpan) btnSpan.textContent = selectedCategoriesM_forReport5.length > 0 ? selectedCategoriesM_forReport5.join(', ') : '-- เลือกค่าทั้งหมด --';
        }

        // ปิด Dropdown เมื่อคลิกที่อื่น (Outside Click Detection)
        window.addEventListener('click', function(e) {
            let shouldRender = false;
            const catDd = document.getElementById('catDropdown5');
            const catBtn = document.getElementById('catDropdownBtn5');
            if (catDd && catBtn && report5DropdownOpen && !catDd.contains(e.target) && !catBtn.contains(e.target)) { 
                report5DropdownOpen = false; 
                catDd.classList.add('hidden'); 
                shouldRender = true;
            }
            
            const compDd = document.getElementById('compDropdown5');
            const compBtn = document.getElementById('compDropdownBtn5');
            if (compDd && compBtn && report5CompanyDropdownOpen && !compDd.contains(e.target) && !compBtn.contains(e.target)) { 
                report5CompanyDropdownOpen = false; 
                compDd.classList.add('hidden'); 
                shouldRender = true;
            }

            // รีเฟรชตารางเมื่อมีการปิด Dropdown เท่านั้น
            if (shouldRender) {
                renderReport5(document.getElementById('contentContainer'));
            }
        });

        // ฟังก์ชันหลักสำหรับ Render ตาราง
        function renderReport5(container) {
            // 1. กรองเฉพาะสถานะ "กำลังดำเนินการจ่าย"
            let dateFilteredData = appData.filter(row => row._status.includes('กำลังดำเนินการจ่าย'));
            
            // 2. กรองตามวันที่ระบุ
            if (startDate_forReport5) { 
                const sDate = new Date(startDate_forReport5); 
                sDate.setHours(0, 0, 0, 0); 
                dateFilteredData = dateFilteredData.filter(row => row._dateProcessTs && row._dateProcessTs >= sDate.getTime()); 
            }
            if (endDate_forReport5) { 
                const eDate = new Date(endDate_forReport5); 
                eDate.setHours(23, 59, 59, 999); 
                dateFilteredData = dateFilteredData.filter(row => row._dateProcessTs && row._dateProcessTs <= eDate.getTime()); 
            }

            // หาบริษัทที่มีทั้งหมดในช่วงที่เลือก
            currentAvailableCompanies5 = [...new Set(dateFilteredData.map(row => row._compC).filter(val => val !== ''))].sort();
            
            // 3. กรองตามบริษัท
            let compFilteredData = dateFilteredData;
            if (selectedCompanies_forReport5.length > 0) {
                compFilteredData = compFilteredData.filter(row => selectedCompanies_forReport5.includes(row._compC));
            }

            // หาหมวดหมู่ที่มีทั้งหมดจากข้อมูลที่กรองบริษัทแล้ว
            currentAvailableCategories5 = [...new Set(compFilteredData.map(row => row._valM).filter(val => val !== 'ไม่ระบุหมวดหมู่'))].sort();
            
            // 4. กรองตามหมวดหมู่
            let finalFilteredData = compFilteredData;
            if (selectedCategoriesM_forReport5.length > 0) {
                finalFilteredData = finalFilteredData.filter(row => selectedCategoriesM_forReport5.includes(String(row[12] || '').trim()));
            }

            // สร้าง HTML ในส่วนของตัวกรอง (Filter Controls)
            let headerHTML = `
                <div class="flex flex-col mb-6 gap-4 no-print">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end gap-4">
                        <div class="w-full lg:w-auto">
                            <h3 class="text-2xl font-bold text-gray-800 mb-3">7. ทะเบียนคุมส่งทำเช็ค</h3>
                            
                            <!-- วันที่ Filter -->
                            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 mb-3">
                                <label class="text-gray-700 font-medium whitespace-nowrap">ตั้งแต่วันที่:</label>
                                <input type="date" value="${startDate_forReport5}" onchange="updateReport5Dates('start', this.value)" class="border border-gray-300 rounded-lg px-3 py-2 outline-none w-full sm:w-auto focus:ring-2 focus:ring-blue-500">
                                
                                <label class="text-gray-700 font-medium whitespace-nowrap mt-2 sm:mt-0">ถึงวันที่:</label>
                                <input type="date" value="${endDate_forReport5}" onchange="updateReport5Dates('end', this.value)" class="border border-gray-300 rounded-lg px-3 py-2 outline-none w-full sm:w-auto focus:ring-2 focus:ring-blue-500">
                            </div>

                            <!-- Dropdown Filter -->
                            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                                
                                <!-- Dropdown บริษัท -->
                                <label class="text-gray-700 font-medium whitespace-nowrap">บริษัท:</label>
                                <div class="relative inline-block text-left w-full sm:w-auto">
                                    <button type="button" id="compDropdownBtn5" onclick="toggleReport5CompanyDropdown()" class="border border-gray-300 rounded-lg px-4 py-2 bg-white text-gray-800 shadow-sm flex items-center justify-between w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        <span class="truncate">${selectedCompanies_forReport5.length > 0 ? selectedCompanies_forReport5.join(', ') : '-- เลือกบริษัททั้งหมด --'}</span>
                                        <svg class="-mr-1 ml-2 h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                                    </button>
                                    <div id="compDropdown5" class="${report5CompanyDropdownOpen ? '' : 'hidden'} origin-top-right absolute left-0 mt-2 w-full sm:w-80 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-30">
                                        <div class="sticky top-0 z-10 bg-white rounded-t-md shadow-sm">
                                            <div class="px-3 py-2 border-b border-gray-200 flex justify-between bg-gray-50 rounded-t-md">
                                                <button type="button" onclick="selectAllCompanies5()" class="text-xs font-semibold text-blue-600 hover:text-blue-800">เลือกทั้งหมด</button>
                                                <button type="button" onclick="clearAllCompanies5()" class="text-xs font-semibold text-red-600 hover:text-red-800">ล้าง</button>
                                            </div>
                                            <div class="p-2 border-b border-gray-200">
                                                <input type="text" placeholder="พิมพ์ค้นหาบริษัท..." oninput="filterDropdownOptions('compListContainer5', this.value)" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-blue-500">
                                            </div>
                                        </div>
                                        <div id="compListContainer5" class="py-1 max-h-48 overflow-y-auto px-3">

            let sortedRows = [...filteredRows].sort((a, b) => {

                const getTs = (r) => {
                    if (r._status === "" || r._status === "มีเอกสาร") return r._dateRecTs || Number.MAX_SAFE_INTEGER;

                else if (row._status === "มีเอกสาร") { displayDate = row._dateRecStr; dHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full mr-1.5 print:hidden"></span>มีเอกสาร สามารถวางบิลได้</span>'; }

                else if (row._status === "ชำระแล้ว") { displayDate = row._datePayStr; dHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 print:hidden"></span>ชำระแล้ว</span>'; }

                return { compName: row._compC || "-", rawPaymentMethod: row._valM, displayDate, recDate, actionDate, docNo: row._invD, pType, pClass, amount: formatNumber(row._e), dHtml };

            // สร้างหัวตาราง (ปรับตามเงื่อนไขว่าแทรกคอลัมน์หรือไม่)

                    for (let j = 1; j < groupCount; j++) {

                        let subDateColsHtml = showExtraCol 
                            ? `<td class="border border-slate-200 py-2.5 px-4 text-slate-700 align-top">${subItem.recDate}</td><td class="border border-slate-200 py-2.5 px-4 text-blue-700 font-medium align-top bg-blue-50/20">${subItem.actionDate}</td>`
                            : `<td class="border border-slate-200 py-2.5 px-4 text-slate-700 align-top">${subItem.displayDate}</td>`;

                        tbodyHtml += `
                            <tr class="hover:bg-slate-50 transition-colors text-sm">
                                ${subDateColsHtml}

                                <td class="border border-slate-200 py-2.5 px-4 text-slate-900 font-semibold text-right align-top">${subItem.amount}</td>
                                <td class="border border-slate-200 py-2.5 px-4 align-top whitespace-nowrap">${subItem.dHtml}</td>

                    }
                    cIdx += groupCount;

            }

            if (tbodyHtml === '') tbodyHtml = `<tr><td colspan="${colSpanCount}" class="border border-slate-200 py-8 px-4 text-center text-sm text-slate-500 bg-slate-50/50">ไม่มีรายการข้อมูลสำหรับสถานะที่เลือก</td></tr>`;

            resultsArea.innerHTML = `
                <div class="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl shadow-slate-200/30 ring-1 ring-slate-100 relative overflow-hidden">

                        <h2 class="text-xl font-bold text-slate-800">ข้อมูลผู้เสียภาษี</h2>
                    </div>
                    
                    <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 mb-6 print:hidden">
                        <h3 class="text-2xl font-bold text-blue-800">${compNameDisplay}</h3>
                        <div class="mt-2 flex items-center text-slate-600">
                            <span>เลขประจำตัวผู้เสียภาษี: <span class="font-semibold text-slate-900 ml-1">${taxIdDisplay}</span></span>
                        </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 print:hidden">
                        <div class="bg-rose-50/50 p-4 rounded-xl border border-rose-100 flex flex-col justify-between">
                            <span class="text-[0.7rem] md:text-xs font-semibold text-rose-600 mb-1 leading-tight flex items-center"><span class="mr-1 text-sm">+</span> มีหนี้ในระบบฯ<br>แต่ไม่สามารถวางบิลได้</span>
                            <span class="text-lg md:text-xl font-bold text-rose-700 mt-2 break-all">${formatNumber(sumEmpty)}</span>
                        </div>
                        <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 flex flex-col justify-between">
                            <span class="text-[0.7rem] md:text-xs font-semibold text-blue-600 mb-1 leading-tight flex items-center"><span class="mr-1 text-sm">+</span> มีเอกสาร<br>สามารถวางบิลได้</span>
                            <span class="text-lg md:text-xl font-bold text-blue-700 mt-2 break-all">${formatNumber(sumHasDoc)}</span>
                        </div>
                        <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-100 flex flex-col justify-between">
                            <span class="text-[0.7rem] md:text-xs font-semibold text-amber-600 mb-1 leading-tight flex items-center"><span class="mr-1 text-sm">+</span> กำลังดำเนินการ<br>จ่าย</span>
                            <span class="text-lg md:text-xl font-bold text-amber-700 mt-2 break-all">${formatNumber(sumProcessing)}</span>
                        </div>
                        <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 flex flex-col justify-between">
                            <span class="text-[0.7rem] md:text-xs font-semibold text-emerald-600 mb-1 leading-tight flex items-center">ชำระแล้ว<br>&nbsp;</span>
                            <span class="text-lg md:text-xl font-bold text-emerald-700 mt-2 break-all">${formatNumber(sumPaid)}</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-6 md:p-8 rounded-2xl shadow-lg border border-slate-700 flex flex-col md:flex-row items-center justify-between print:hidden">

        function exportToExcel() {
            let exportData = [];
            
            // ดึงข้อมูลหัวตารางจากหน้าจอแบบไดนามิก เพื่อรองรับคอลัมน์ที่ยืดหยุ่น
            let headers = [];
            document.querySelectorAll(".main-table thead th").forEach(th => headers.push(th.innerText.trim()));
            exportData.push(headers);
            
            let currentCategory = "";
            const rows = document.querySelectorAll("#mainTableBody tr");
            const colCount = headers.length;
            
            rows.forEach(row => {
                let cols = row.querySelectorAll("td");
                let rowData = [];
                
                if (cols.length === 1 && cols[0].getAttribute('colspan')) {
                    // แถวชื่อบริษัท
                    rowData.push(cols[0].innerText.trim());
                } else if (cols.length === colCount) {
                    // แถวแรกของกลุ่มข้อมูล (มี rowspan)
                    currentCategory = cols[0].innerText.trim();
                    for (let i = 0; i < cols.length; i++) rowData.push(cols[i].innerText.trim());
                } else if (cols.length === colCount - 1) {
                    // แถวย่อย
                    rowData.push(currentCategory);
                    for (let i = 0; i < cols.length; i++) rowData.push(cols[i].innerText.trim());
                }
                
                if (rowData.length > 0) exportData.push(rowData);
            });
            
            exportData.push([]);
            exportData.push(["สรุปยอดรวม"]);
            exportData.push(["มีหนี้ในระบบฯ แต่ไม่สามารถวางบิลได้", ...Array(colCount - 2).fill(""), formatNumber(currentSummary.sumEmpty)]);
            exportData.push(["มีเอกสาร สามารถวางบิลได้", ...Array(colCount - 2).fill(""), formatNumber(currentSummary.sumHasDoc)]);
            exportData.push(["กำลังดำเนินการจ่าย", ...Array(colCount - 2).fill(""), formatNumber(currentSummary.sumProcessing)]);
            exportData.push(["ชำระแล้ว", ...Array(colCount - 2).fill(""), formatNumber(currentSummary.sumPaid)]);
            exportData.push(["ยอดคงเหลือสุทธิ", ...Array(colCount - 2).fill(""), formatNumber(currentSummary.netBalance)]);

            let ws = XLSX.utils.aoa_to_sheet(exportData);
            ws['!pageSetup'] = { orientation: 'landscape' };
            
            let wscols = [{ wpx: 120 }];
            if (colCount === 7) {
                wscols.push({ wpx: 100 }, { wpx: 100 }, { wpx: 120 }, { wpx: 100 }, { wpx: 100 }, { wpx: 120 });
            } else {
                wscols.push({ wpx: 100 }, { wpx: 120 }, { wpx: 100 }, { wpx: 100 }, { wpx: 120 });
            }
            ws['!cols'] = wscols;
            
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, "Data_Outstanding_Creditors.xlsx");

        // ฟังก์ชันอรรถประโยชน์
        const parseNumberValue = v => { if (!v) return 0; if (typeof v === 'string') v = v.replace(/,/g, ''); const n = parseFloat(v); return isNaN(n) ? 0 : n; };
        const formatNumber = n => { const v = parseFloat(n); return (isNaN(v) || v === 0) ? '0.00' : v.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
        const getJSDate = v => { if (!v) return null; if (typeof v === 'number') return new Date(new Date(Date.UTC(1899, 11, 30)).getTime() + v * 86400000); const p = String(v).trim().split(/[-/]/); if (p.length === 3) { let d = parseInt(p[0]), m = parseInt(p[1]) - 1, y = parseInt(p[2]); if (p[0].length === 4) { y = parseInt(p[0]); m = parseInt(p[1]) - 1; d = parseInt(p[2]); } if (y < 100) y += y >= 50 ? 2500 : 2000; if (y > 2400) y -= 543; return new Date(y, m, d); } return isNaN(new Date(v).getTime()) ? null : new Date(v); };
        const formatThaiDate = (v) => { const jd = getJSDate(v); if (!jd) return String(v || '-').trim(); let d = jd.getDate(), m = jd.getMonth() + 1, y = jd.getFullYear(); if (y < 2500) y += 543; return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`; };

        function updateStatus(isSuccess) {

        function enrichData(rows) {
            return rows.map(row => {
                row._e = parseNumberValue(row[4]);
                row._compC = String(row[2] || '').trim();
                row._invD = row[3] || '-';
                row._status = String(row[22] || '').trim();
                row._dateRecStr = formatThaiDate(row[1]);
                return row;
            });
        }

        function fetchData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true, header: false,
                complete: function(results) {
                    if (results.data.length < 5) { alert("ข้อมูลมีน้อยกว่า 5 แถว"); return; }
                    let rawRows = results.data.slice(4).filter(row => row.length > 0 && row.some(cell => cell !== ""));
                    appData = enrichData(rawRows);
                    updateStatus(true);
                    renderReport();

                if (!row._status.includes("มีเอกสาร") || row._compC === "") continue;

                    date: row._dateRecStr,
                    companyRaw: row._compC,

                    docNo: row._invD,

            } else if (formatted.includes("หสม.")) {

            }
            return formatted.replace(/\s+/g, ' ');

        function handleSearchInput(val) {

            if (!list) return;

                displayMatches.forEach(name => {

                    li.textContent = name;
                    li.onmousedown = (e) => { e.preventDefault(); selectCompany(name); };
                    list.appendChild(li);
                });
                if(displayMatches.length > 0) list.classList.remove('hidden');
                return;
            }

            const matches = uniqueNames.filter(name => sanitizeForSearch(name).includes(val));

            if (matches.length > 0) {
                const displayMatches = matches.slice(0, 50);
                displayMatches.forEach(name => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-2 hover:bg-blue-50 hover:text-blue-700 cursor-pointer text-gray-700 transition-colors border-b border-gray-100 last:border-0';

            const tF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
            const tM = c.match(/(\d{1,2})\s+([ก-๙\.]+)\s+(\d{2,4})/);
            
            if (tM) {
                let d = parseInt(tM[1], 10), mo = tM[2], y = parseInt(tM[3], 10);
                let m = tS.findIndex(t => mo.includes(t));
                if (m === -1) m = tF.findIndex(t => mo.includes(t));
                if (m === -1) m = 0;
                if (y < 100) y += y > 40 ? 2500 : 2000;
                if (y >= 2400) y -= 543;
                return new Date(y, m, d).getTime();
            }
            
            if (!isNaN(c) && Number(c) > 10000) {
                return new Date(Date.UTC(1899, 11, 30)).getTime() + Number(c) * 86400000;
            }
            
            let dObj = new Date(c);
            return isNaN(dObj.getTime()) ? null : dObj.getTime();
        };

        function formatThaiDate(v, s = false) {
            if (!v) return '-';
            let d, m, y;
            if (typeof v === 'number') {
                const doObj = new Date(new Date(Date.UTC(1899, 11, 30)).getTime() + v * 86400000);
                d = doObj.getUTCDate();
                m = doObj.getUTCMonth() + 1;
                y = doObj.getUTCFullYear();
                if (y < 2500) y += 543;
            } else {
                let ds = String(v).trim();
                const p = ds.split(/[-/]/);
                if (p.length === 3) {
                    d = parseInt(p[0]); m = parseInt(p[1]); y = parseInt(p[2]);
                    if (p[0].length === 4) {
                        y = parseInt(p[0]); m = parseInt(p[1]); d = parseInt(p[2]);
                    }
                    if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
                        if (y < 100) y += y >= 50 ? 2500 : 2000;
                        if (y < 2500) y += 543;
                    } else return ds;
                } else return ds;
            }
            return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${s ? String(y).slice(-2) : y}`;
