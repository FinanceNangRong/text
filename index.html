                        <div class="hidden absolute top-full left-0 w-64 mt-1 bg-white border border-gray-200 rounded-md shadow-xl z-50 max-h-48 overflow-y-auto item-options">
                            ${itemOptionsHtml}
                        </div>
                    </div>
                </td>
                <td class="p-2"><input type="number" step="0.01" class="w-full border border-gray-300 rounded-md p-2 amount-input input-amount outline-none focus:ring-2 focus:ring-blue-400 text-sm text-right font-medium text-blue-700" required oninput="calculateTotal()"></td>
                <td class="p-2"><input type="text" class="w-full border border-gray-300 rounded-md p-2 input-note outline-none focus:ring-2 focus:ring-blue-400 text-sm"></td>
                <td class="p-2 text-center">
                    <button type="button" onclick="removeRow(this)" class="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-md p-2 transition-colors"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(row);
        }

        function removeRow(btn) {
            const tbody = document.getElementById('itemsTable');
            if (tbody.children.length > 1) {
                btn.closest('tr').remove();
                calculateTotal();
            } else { alert("ต้องมีอย่างน้อย 1 รายการ"); }
        }

        function calculateTotal() {
            const amountInputs = document.querySelectorAll('.amount-input');
            let total = 0;
            amountInputs.forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val)) total += val;
            });
            document.getElementById('totalAmount').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        async function submitForm(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';
            const rawDate = document.getElementById('date').value;
            const thaiDate = getThaiDate(rawDate);
            const payload = {
                staffName: document.getElementById('staffName').value,
                position: document.getElementById('position').value,
                date: thaiDate,
                shift: document.getElementById('shift').value,
                servicePoint: document.getElementById('servicePoint').value,
                items: []
            };
            const rows = document.getElementById('itemsTable').children;
            for (let tr of rows) {
                payload.items.push({
                    bookNo: tr.querySelector('.input-bookNo').value,
                    receiptNo: tr.querySelector('.input-receiptNo').value,
                    item: tr.querySelector('.input-item').value,
                    amount: tr.querySelector('.input-amount').value,
                    note: tr.querySelector('.input-note').value
                });
            }
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    alert("บันทึกข้อมูลเรียบร้อยแล้ว");
                    document.getElementById('medicalForm').reset();
                    document.getElementById('itemsTable').innerHTML = '';
                    addRow(); calculateTotal();
                } else alert("เกิดข้อผิดพลาด: " + result.message);
            } catch (error) {
                alert("ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่ (Error: " + error.message + ")");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-save"></i> บันทึกข้อมูล';
            }
        }

        // ==========================================
        // ฟังก์ชันระบบพิมพ์และพิมพ์ค้นหา วันที่ หน้า 2
        // ==========================================
        async function loadPage2Data() {
            try {
                document.getElementById('loading-p2').classList.remove('hidden');
                document.getElementById('btn-actions').classList.add('hidden'); 

                const response = await fetch(CSV_SAVED_DATA_URL);
                const text = await response.text();
                const rows = CSVToArray(text);
                
                savedRecords = rows.filter(r => r.length >= 9 && r[0] && r[0].trim() !== '');

                const dates = new Set();
                savedRecords.forEach(r => dates.add(r[0].trim())); 

                // สร้าง Dropdown ค้นหาวันที่ หน้า 2
                initP2DateDropdown(dates);
                
                updateSelectOptions('p2-staff', new Set(), '-- เลือกเจ้าหน้าที่ --');
                updateSelectOptions('p2-shift', new Set(), '-- เลือกเวร --');
                document.getElementById('p2-position').value = '';

                document.getElementById('loading-p2').classList.add('hidden');
            } catch (error) {
                console.error("Error loading page 2 data:", error);
                document.getElementById('loading-p2').classList.add('hidden');
                alert("ไม่สามารถดึงข้อมูลประวัติได้");
            }
        }

        function initP2DateDropdown(datesSet) {
            const listDiv = document.getElementById('p2-date-options-list');
            listDiv.innerHTML = '';
            let sortedDates = Array.from(datesSet).sort();
            sortedDates.forEach(date => {
                listDiv.innerHTML += `
                    <div class="p2-date-option px-3 py-2 hover:bg-indigo-50 cursor-pointer text-sm border-b border-slate-100 last:border-b-0 text-slate-700" data-value="${date}" onclick="selectP2Date(this)">${date}</div>
                `;
            });
            document.getElementById('p2-date-input').value = '';
        }

        function toggleP2DateDropdown() {
            const optionsDiv = document.getElementById('p2-date-options');
            document.querySelectorAll('.receipt-options, .item-options, #p3-date-options, #p3-staff-options, #p3-point-options').forEach(el => el.classList.add('hidden'));
            optionsDiv.classList.remove('hidden');
            filterP2Dates(document.getElementById('p2-date-input'));
        }

        function filterP2Dates(input) {
            const filter = input.value.toLowerCase();
            const optionsDiv = document.getElementById('p2-date-options');
            optionsDiv.classList.remove('hidden');
            const options = optionsDiv.querySelectorAll('.p2-date-option');
            options.forEach(opt => {
                opt.style.display = opt.innerText.toLowerCase().includes(filter) ? 'block' : 'none';
            });
        }

        function selectP2Date(div) {
            const input = document.getElementById('p2-date-input');
            input.value = div.dataset.value;
            document.getElementById('p2-date-options').classList.add('hidden');
            
            // เรียกทำงานฟังก์ชันอัปเดตเมื่อเลือกวันที่
            onP2DateChange(div.dataset.value);
        }

        function onP2DateChange(date) {
            if (!date) {
                updateSelectOptions('p2-staff', new Set(), '-- เลือกเจ้าหน้าที่ --');
                updateSelectOptions('p2-shift', new Set(), '-- เลือกเวร --');
                document.getElementById('p2-position').value = '';
                return;
            }
            const staffs = new Set();
            savedRecords.forEach(r => {
                if (r[0].trim() === date && r[3] && r[3].trim() !== '') staffs.add(r[3].trim());
            });
            updateSelectOptions('p2-staff', staffs, '-- เลือกเจ้าหน้าที่ --');
            updateSelectOptions('p2-shift', new Set(), '-- เลือกเวร --');
            document.getElementById('p2-position').value = '';
        }

        function onP2StaffChange() {
            const date = document.getElementById('p2-date-input').value;
            const staff = document.getElementById('p2-staff').value;
            if (!staff) {
                document.getElementById('p2-position').value = '';
                updateSelectOptions('p2-shift', new Set(), '-- เลือกเวร --');
                return;
            }
            const shifts = new Set();
            let position = '';
            savedRecords.forEach(r => {
                if (r[0].trim() === date && r[3].trim() === staff) {
                    if (r[1] && r[1].trim() !== '') shifts.add(r[1].trim());
                    if (!position && r[4]) position = r[4].trim();
                }
            });
            document.getElementById('p2-position').value = position;
            updateSelectOptions('p2-shift', shifts, '-- เลือกเวร --');
        }

        function parseReceipts(str) {
            if(!str) return [];
            let nums = [];
            let parts = str.split(',');
            parts.forEach(p => {
                let range = p.split('-');
                if(range.length === 1) {
                    nums.push(parseInt(range[0].trim(), 10));
                } else if(range.length === 2) {
                    let start = parseInt(range[0].trim(), 10), end = parseInt(range[1].trim(), 10);
                    if(!isNaN(start) && !isNaN(end)) for(let i=start; i<=end; i++) nums.push(i);
                }
            });
            return nums.filter(n => !isNaN(n));
        }

        function generateSummary() {
            const selDate = document.getElementById('p2-date-input').value;
            const selStaff = document.getElementById('p2-staff').value;
            const selShift = document.getElementById('p2-shift').value;
            const selPosition = document.getElementById('p2-position').value;

            if(!selDate || !selStaff || !selShift) {
                alert('กรุณาเลือก วันที่, ชื่อผู้ทำรายการ และเวร ให้ครบถ้วน');
                return;
            }

            let filtered = savedRecords.filter(r => r[0].trim() === selDate && r[3].trim() === selStaff && r[1].trim() === selShift);
            let groups = {}; currentServicePoint = ""; 

            filtered.forEach(r => {
                if(!currentServicePoint && r[2]) currentServicePoint = r[2].trim(); 
                let bookNo = r[5] ? r[5].trim() : '';
                let receiptStr = r[6] ? r[6].trim() : '';
                let item = r[7] ? r[7].trim() : '';
                let amount = parseFloat((r[8] || '0').replace(/,/g, '')) || 0;
                if (!bookNo) return; 

                if(!groups[bookNo]) groups[bookNo] = { receipts: new Set(), items: {} };
                let parsedNums = parseReceipts(receiptStr);
                parsedNums.forEach(n => groups[bookNo].receipts.add(n));

                let isQR = item.toUpperCase().includes('QR-CODE');
                if(!groups[bookNo].items[item]) groups[bookNo].items[item] = { amount: 0, isQR: isQR };
                groups[bookNo].items[item].amount += amount;
            });

            let tbody = document.getElementById('p2-summaryTable');
            tbody.innerHTML = '';
            
            let totalCash = 0, totalQR = 0, hasData = false;
            let sortedBooks = Object.keys(groups).sort();
            let printRows = [];

            sortedBooks.forEach(bookNo => {
                hasData = true;
                let g = groups[bookNo];
                let receiptArray = Array.from(g.receipts);
                let receiptFormatted = formatReceiptRanges(receiptArray); 
                let itemKeys = Object.keys(g.items).sort();
                
                itemKeys.forEach((item, index) => {
                    let itemData = g.items[item];
                    let cashAmt = itemData.isQR ? 0 : itemData.amount;
                    let qrAmt = itemData.isQR ? itemData.amount : 0;
                    totalCash += cashAmt; totalQR += qrAmt;

                    let cashStr = cashAmt > 0 ? cashAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';
                    let qrStr = qrAmt > 0 ? qrAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';

                    // UI Table Row
                    let tr = document.createElement('tr');
                    tr.className = "border-b hover:bg-slate-50 transition-colors";
                    if (index === 0) {
                        tr.innerHTML = `
                            <td class="p-3 border-r align-top text-center text-sm font-medium text-slate-700" rowspan="${itemKeys.length}">${bookNo}/${receiptFormatted}</td>
                            <td class="p-3 border-r text-sm text-slate-600">${item}</td>
                            <td class="p-3 border-r text-right text-sm font-medium text-emerald-600">${cashStr}</td>
                            <td class="p-3 text-right text-sm font-medium text-blue-600">${qrStr}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="p-3 border-r text-sm text-slate-600">${item}</td>
                            <td class="p-3 border-r text-right text-sm font-medium text-emerald-600">${cashStr}</td>
                            <td class="p-3 text-right text-sm font-medium text-blue-600">${qrStr}</td>
                        `;
                    }
                    tbody.appendChild(tr);

                    // เก็บรายการเรียบแบนไว้สำหรับการสร้างหน้าเอกสารพิมพ์ A4 และการส่งออก Excel
                    printRows.push({
                        bookNo: bookNo,
                        receiptFormatted: receiptFormatted,
                        item: item,
                        cashAmt: cashAmt,
                        qrAmt: qrAmt
                    });
                });
            });

            if(!hasData) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">ไม่พบข้อมูลสำหรับเงื่อนไขที่เลือก</td></tr>`;
                document.getElementById('btn-actions').classList.add('hidden');
                return;
            }

            let grandTotal = totalCash + totalQR;

            // อัปเดตยอดรวมบนหน้าจอ UI
            document.getElementById('p2-totalCash').innerText = totalCash.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('p2-totalQR').innerText = totalQR.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('p2-totalAll').innerText = grandTotal.toLocaleString('en-US', {minimumFractionDigits:2});

            // สร้าง HTML ลงใน printArea (A4 Modern Split Pages)
            generatePrintAreaHTML(printRows, selDate, currentServicePoint, selShift, selStaff, selPosition, totalCash, totalQR, grandTotal, true);

            document.getElementById('btn-actions').classList.remove('hidden');
        } // -- สิ้นสุดฟังก์ชัน generateSummary ตรงนี้ --

        // สร้างโครงสร้างหน้ากระดาษพิมพ์แบบไดนามิกแยกหน้า และสร้างตารางซ่อนสำหรับดาวน์โหลด Excel
        function generatePrintAreaHTML(printRows, selDate, currentServicePoint, selShift, selStaff, selPosition, totalCash, totalQR, grandTotal, showShift = true) {
            // ส่วนที่แก้ไข: ปรับ padding ให้เล็กลง (4px 6px) และลด font-size ลงเหลือ 9pt
            const cellStyle = "border: 1px solid #94a3b8; padding: 4px 6px; font-size: 9pt;";
            const headerStyle = "border: 1px solid #94a3b8; text-align:center; padding: 5px; font-weight: bold; font-size: 9pt;";
            
            // กำหนดจำนวนแถวสูงสุดในแต่ละหน้าคงที่ เพราะทุกหน้าตอนนี้จะมีทั้งส่วนหัวและส่วนท้ายพร้อมลายเซ็นที่ขนาดเท่ากัน
            const ROWS_PER_PAGE = 14;
            
            let shiftRowHtml = showShift ? `
                <tr>
                    <td style="padding: 5px 10px; font-size: 11pt;"><strong>รอบเวร:</strong> <span style="color: #1e40af;">${selShift}</span></td>
                </tr>
            ` : '';

            let pages = [];
            let tempRows = [...printRows];
            let pageNum = 1;
            
            while (tempRows.length > 0) {
                let chunk = tempRows.splice(0, ROWS_PER_PAGE);
                pages.push({
                    pageNumber: pageNum,
                    rows: chunk,
                    isFirst: (pageNum === 1),
                    isLast: (tempRows.length === 0)
                });
                pageNum++;
            }
            
            // คำนวณหายอดสะสม ยกไป และ ยกมา ของแต่ละหน้า
            let runningCash = 0;
            let runningQR = 0;
            pages.forEach(page => {
                page.broughtForwardCash = runningCash;
                page.broughtForwardQR = runningQR;
                
                let pageCash = 0;
                let pageQR = 0;
                page.rows.forEach(r => {
                    pageCash += r.cashAmt;
                    pageQR += r.qrAmt;
                });
                
                runningCash += pageCash;
                runningQR += pageQR;
                
                page.carriedForwardCash = runningCash;
                page.carriedForwardQR = runningQR;
            });

            // 1. สร้างตารางแบบต่อเนื่องตารางเดียว (Single Table) ไว้สำหรับดาวน์โหลด Excel (id="export-table")
            let excelRowsHtml = "";
            let processedExcelIndex = 0;
            while (processedExcelIndex < printRows.length) {
                let currentBook = printRows[processedExcelIndex].bookNo;
                let currentReceipt = printRows[processedExcelIndex].receiptFormatted;
                let spanCount = 0;
                for (let i = processedExcelIndex; i < printRows.length; i++) {
                    if (printRows[i].bookNo === currentBook && printRows[i].receiptFormatted === currentReceipt) {
                        spanCount++;
                    } else {
                        break;
                    }
                }
                for (let j = 0; j < spanCount; j++) {
                    let r = printRows[processedExcelIndex + j];
                    let cashStr = r.cashAmt > 0 ? r.cashAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';
                    let qrStr = r.qrAmt > 0 ? r.qrAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';
                    
                    let trHtml = "<tr>";
                    if (j === 0) {
                        trHtml += `<td style="${cellStyle} text-align: center; vertical-align: top;" rowspan="${spanCount}">${r.bookNo}/${r.receiptFormatted}</td>`;
                    }
                    trHtml += `
                        <td style="${cellStyle} text-align: left;">${r.item}</td>
                        <td style="${cellStyle} text-align: right;">${cashStr}</td>
                        <td style="${cellStyle} text-align: right;">${qrStr}</td>
                    </tr>`;
                    excelRowsHtml += trHtml;
                }
                processedExcelIndex += spanCount;
            }

            let excelTableHtml = `
                <table id="export-table" class="print-hide" style="display: none; width: 100%; max-width: 180mm; margin: 0 auto; border-collapse: collapse; font-family: 'Sarabun', sans-serif; font-size: 10pt; color: #1f2937;">
                    <thead>
                        <tr>
                            <th colspan="4" style="text-align: center; border: none; padding-bottom: 5px;">
                                <h1 style="font-size: 18pt; margin: 0; font-weight: bold; color: #1e3a8a;">สถานบริการสาธารณสุข โรงพยาบาลนางรอง</h1>
                            </th>
                        </tr>
                        <tr>
                            <th colspan="4" style="text-align: center; border: none; padding-bottom: 25px; border-bottom: 2px solid #2563eb;">
                                <h2 style="font-size: 14pt; margin: 0; font-weight: normal; color: #4b5563;">บันทึกการนำส่งเงิน</h2>
                            </th>
                        </tr>
                        <tr><td colspan="4" style="border: none; padding: 10px 0;"></td></tr>
                        <tr>
                            <td colspan="4" style="border: none; padding-bottom: 15px;">
                                <table style="width: 100%; border: 1px solid #e5e7eb; background-color: #f8fafc; border-radius: 4px; padding: 10px;">
                                    <tr>
                                        <td style="padding: 5px 10px; font-size: 11pt;"><strong>ผู้ส่งเงิน:</strong> <span style="color: #1e40af;">${selStaff}</span></td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 5px 10px; font-size: 11pt;"><strong>วันที่ทำรายการ:</strong> <span style="color: #1e40af;">${formatThaiDateFull(selDate)}</span></td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 5px 10px; font-size: 11pt;"><strong>จุดบริการ:</strong> <span style="color: #1e40af;">${currentServicePoint}</span></td>
                                    </tr>
                                    ${shiftRowHtml}                                
                                </table>
                            </td>
                        </tr>
                        <tr><td colspan="4" style="border: none; padding: 5px 0;"></td></tr>
                        <tr style="background-color: #f1f5f9;">
                            <th rowspan="2" style="${headerStyle} width: 4cm;">เล่มที่ / เลขที่</th>
                            <th rowspan="2" style="${headerStyle}">รายการ</th>
                            <th colspan="2" style="${headerStyle}">จำนวนเงิน (บาท)</th>
                        </tr>
                        <tr style="background-color: #f8fafc;">
                            <th style="${headerStyle} width: 3cm;">เงินสด</th>
                            <th style="${headerStyle} width: 3cm;">QR-Code</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${excelRowsHtml}
                    </tbody>
                    <tfoot>
                        <tr style="background-color: #f8fafc;">
                            <td colspan="2" style="${cellStyle} text-align:right; font-weight: bold;">รวมแยกประเภท:</td>
                            <td style="${cellStyle} text-align:right; font-weight: bold;">${totalCash.toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                            <td style="${cellStyle} text-align:right; font-weight: bold;">${totalQR.toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                        </tr>
                        <tr style="background-color: #e2e8f0;">
                            <td colspan="2" style="${cellStyle} text-align:right; font-weight: bold; font-size: 11pt;">ยอดนำส่งสุทธิทั้งสิ้น:</td>
                            <td colspan="2" style="${cellStyle} text-align:center; font-weight: bold; font-size: 12pt; color: #b91c1c;">${grandTotal.toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                        </tr>
                        <tr>
                            <td colspan="4" style="border: none; padding-top: 20px;">
                                <div style="text-align: center; font-size: 12pt; font-weight: bold; background-color: #eff6ff; padding: 12px; border: 1px dashed #93c5fd; border-radius: 6px;">
                                    (ตัวอักษร) <span>${ThaiBaht(grandTotal)}</span>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="4" style="border: none; padding-top: 50px;">
                                <table style="width: 100%; border: none; text-align: center; margin-top: 20px;">
                                    <tr>
                                        <td style="width: 50%; border: none;">
                                            <div style="width: 60%; margin: 0 auto; border-bottom: 1px dotted #000; height: 30px;"></div>
                                            <div style="margin-top: 8px; font-weight: bold; font-size: 11pt;">(...................................................)</div>
                                            <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">ตำแหน่ง............................................</div>
                                            <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">(ผู้รับเงิน)</div>
                                        </td>
                                        <td style="width: 50%; border: none;">
                                            <div style="width: 60%; margin: 0 auto; border-bottom: 1px dotted #000; height: 30px;"></div>
                                            <div style="margin-top: 8px; font-weight: bold; font-size: 11pt;">${selStaff}</div>
                                            <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">${selPosition}</div>
                                            <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">(ผู้ส่งเงิน)</div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            `;

            // 2. สร้างโครงสร้าง HTML แยกเป็นแผ่นๆ (A4 Page Split Container) สำหรับการพิมพ์ PDF จริง
            let pagesHtml = "";
            pages.forEach((page) => {
                let pageBreakStyle = page.isLast ? "" : "page-break-after: always;";
                
                // ทุกๆ หน้าตั้งแต่หน้าแรกถึงหน้าถัดไป มีส่วนหัวกระดาษที่รายละเอียดครบถ้วนและเหมือนกันทุกประการ
                let pageHeaderHtml = `
                    <div style="text-align: center; margin-bottom: 5px;">
                        <h1 style="font-size: 18pt; margin: 0; font-weight: bold; color: #1e3a8a;">สถานบริการสาธารณสุข โรงพยาบาลนางรอง</h1>
                        <h2 style="font-size: 14pt; margin: 5px 0 0 0; font-weight: normal; color: #4b5563; border-bottom: 2px solid #2563eb; padding-bottom: 15px;">บันทึกการนำส่งเงิน</h2>
                    </div>
                    <div style="padding: 10px 0;"></div>
                    <table style="width: 100%; border: 1px solid #e5e7eb; background-color: #f8fafc; border-radius: 4px; padding: 10px; margin-bottom: 10px;">
                        <tr>
                            <td style="padding: 5px 10px; font-size: 11pt;"><strong>ผู้ส่งเงิน:</strong> <span style="color: #1e40af;">${selStaff}</span></td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 10px; font-size: 11pt;"><strong>วันที่ทำรายการ:</strong> <span style="color: #1e40af;">${formatThaiDateFull(selDate)}</span></td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 10px; font-size: 11pt;"><strong>จุดบริการ:</strong> <span style="color: #1e40af;">${currentServicePoint}</span></td>
                        </tr>
                        ${shiftRowHtml}
                    </table>
                    <div style="text-align: right; font-size: 9pt; color: #4b5563; margin-bottom: 5px;">หน้าที่ ${page.pageNumber} / ${pages.length}</div>
                `;

                // สร้างเนื้อหาแถวข้อมูลในตาราง
                let tableRowsHtml = "";
                
                // หากหน้าปัจจุบันเป็นหน้าที่มากกว่า 1 ให้เอา "รวมแยกประเภท ยกมา:" มาแทรกไว้ในแถวแรกสุดของตาราง
                if (page.pageNumber > 1) {
                    let broughtCashStr = page.broughtForwardCash.toLocaleString('en-US', {minimumFractionDigits:2});
                    let broughtQRStr = page.broughtForwardQR.toLocaleString('en-US', {minimumFractionDigits:2});
                    tableRowsHtml += `
                        <tr style="background-color: #f8fafc;">
                            <td style="${cellStyle} text-align: center; font-style: italic; color: #6b7280;">-</td>
                            <td style="${cellStyle} text-align: left; font-weight: bold; color: #4b5563;">รวมแยกประเภท ยกมา:</td>
                            <td style="${cellStyle} text-align: right; font-weight: bold; color: #4b5563;">${broughtCashStr}</td>
                            <td style="${cellStyle} text-align: right; font-weight: bold; color: #4b5563;">${broughtQRStr}</td>
                        </tr>
                    `;
                }

                // การคำนวณและประมวลผล Rowspan สำหรับข้อมูลบนหน้านี้
                let processedPageIndex = 0;
                while (processedPageIndex < page.rows.length) {
                    let currentBook = page.rows[processedPageIndex].bookNo;
                    let currentReceipt = page.rows[processedPageIndex].receiptFormatted;
                    
                    let spanCount = 0;
                    for (let i = processedPageIndex; i < page.rows.length; i++) {
                        if (page.rows[i].bookNo === currentBook && page.rows[i].receiptFormatted === currentReceipt) {
                            spanCount++;
                        } else {
                            break;
                        }
                    }
                    
                    for (let j = 0; j < spanCount; j++) {
                        let r = page.rows[processedPageIndex + j];
                        let cashStr = r.cashAmt > 0 ? r.cashAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';
                        let qrStr = r.qrAmt > 0 ? r.qrAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';
                        
                        let trHtml = "<tr>";
                        if (j === 0) {
                            trHtml += `<td style="${cellStyle} text-align: center; vertical-align: top;" rowspan="${spanCount}">${r.bookNo}/${r.receiptFormatted}</td>`;
                        }
                        trHtml += `
                            <td style="${cellStyle} text-align: left;">${r.item}</td>
                            <td style="${cellStyle} text-align: right;">${cashStr}</td>
                            <td style="${cellStyle} text-align: right;">${qrStr}</td>
                        </tr>`;
                        tableRowsHtml += trHtml;
                    }
                    processedPageIndex += spanCount;
                }

                // สรุปยอดรวมประเภท: ถ้าเป็นหน้าธรรมดาระหว่างกลางให้ใช้คำว่า "รวมแยกประเภท ยกไป:" แต่ถ้าเป็นหน้าสุดท้ายให้ใช้คำว่า "รวมแยกประเภท:"
                let tableFooterHtml = "";
                let currentTotalCash = page.carriedForwardCash;
                let currentTotalQR = page.carriedForwardQR;
                let currentGrandTotal = currentTotalCash + currentTotalQR;
                
                let totalLabel = page.isLast ? "รวมแยกประเภท:" : "รวมแยกประเภท ยกไป:";
                
                tableFooterHtml = `
                    <tr style="background-color: #f8fafc;">
                        <td colspan="2" style="${cellStyle} text-align:right; font-weight: bold;">${totalLabel}</td>
                        <td style="${cellStyle} text-align:right; font-weight: bold;">${currentTotalCash.toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                        <td style="${cellStyle} text-align:right; font-weight: bold;">${currentTotalQR.toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                    </tr>
                    <tr style="background-color: #e2e8f0;">
                        <td colspan="2" style="${cellStyle} text-align:right; font-weight: bold; font-size: 11pt;">ยอดนำส่งสุทธิทั้งสิ้น:</td>
                        <td colspan="2" style="${cellStyle} text-align:center; font-weight: bold; font-size: 12pt; color: #b91c1c;">${currentGrandTotal.toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                    </tr>
                `;

                // บังคับให้ส่วนสรุปตัวอักษรไทย บล็อกลงชื่อผู้รับและผู้ส่ง แสดงอยู่ใน "ทุกหน้าของเอกสาร" ด้วยความละเอียดระดับเดียวกัน
                let signaturesHtml = `
                    <div style="margin-top: 15px; page-break-inside: avoid;">
                        <div style="text-align: center; font-size: 11pt; font-weight: bold; background-color: #eff6ff; padding: 10px; border: 1px dashed #93c5fd; border-radius: 6px;">
                            (ตัวอักษร) <span>${ThaiBaht(currentGrandTotal)}</span>
                        </div>
                    </div>
                    <div style="margin-top: 35px; page-break-inside: avoid;">
                        <table style="width: 100%; border: none; text-align: center;">
                            <tr>
                                <td style="width: 50%; border: none;">
                                    <div style="width: 65%; margin: 0 auto; border-bottom: 1px dotted #000; height: 30px;"></div>
                                    <div style="margin-top: 8px; font-weight: bold; font-size: 11pt;">(...................................................)</div>
                                    <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">ตำแหน่ง............................................</div>
                                    <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">(ผู้รับเงิน)</div>
                                </td>
                                <td style="width: 50%; border: none;">
                                    <div style="width: 65%; margin: 0 auto; border-bottom: 1px dotted #000; height: 30px;"></div>
                                    <div style="margin-top: 8px; font-weight: bold; font-size: 11pt;">${selStaff}</div>
                                    <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">${selPosition}</div>
                                    <div style="margin-top: 2px; font-size: 10pt; color: #4b5563;">(ผู้ส่งเงิน)</div>
                                </td>
                            </tr>
                        </table>
                    </div>
                `;

                pagesHtml += `
                    <div class="print-container" style="${pageBreakStyle} padding: 10px 0; box-sizing: border-box;">
                        ${pageHeaderHtml}
                        <table style="width: 100%; border-collapse: collapse; font-family: 'Sarabun', sans-serif; font-size: 10pt; color: #1f2937;">
                            <thead>
                                <tr style="background-color: #f1f5f9;">
                                    <th rowspan="2" style="${headerStyle} width: 4cm;">เล่มที่ / เลขที่</th>
                                    <th rowspan="2" style="${headerStyle}">รายการรับเงิน</th>
                                    <th colspan="2" style="${headerStyle} width: 6cm;">รูปแบบการชำระ (บาท)</th>
                                </tr>
                                <tr style="background-color: #f8fafc;">
                                    <th style="${headerStyle} width: 3cm;">เงินสด</th>
                                    <th style="${headerStyle} width: 3cm;">QR-Code</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRowsHtml}
                            </tbody>
                            <tfoot>
                                ${tableFooterHtml}
                            </tfoot>
                        </table>
                        ${signaturesHtml}
                    </div>
                `;
            });

            // เขียนชุดข้อมูลตารางเดี่ยว Excel และหน้าพิมพ์แยกแผ่น ลงในตู้คอนเทนเนอร์ printArea ทั้งหมด
            document.getElementById('printArea').innerHTML = excelTableHtml + pagesHtml;
        }

        // ==========================================
        // ฟังก์ชันและสคริปต์ใหม่สำหรับหน้า 3 (สรุปส่งเงินหลายวัน)
        // ==========================================
        async function loadPage3Data() {
            try {
                document.getElementById('loading-p3').classList.remove('hidden');
                document.getElementById('p3-btn-actions').classList.add('hidden');

                const response = await fetch(CSV_SAVED_DATA_URL);
                const text = await response.text();
                const rows = CSVToArray(text);
                
                savedRecords = rows.filter(r => r.length >= 9 && r[0] && r[0].trim() !== '');

                const dates = new Set();
                savedRecords.forEach(r => dates.add(r[0].trim())); 

                p3SelectedDates = [];
                document.getElementById('p3-date-input').value = '';
                
                // สร้าง Checkbox List ใน Dropdown วันที่
                let dateOptionsDiv = document.getElementById('p3-date-checkbox-list');
                dateOptionsDiv.innerHTML = '';
                let sortedDates = Array.from(dates).sort();
                
                sortedDates.forEach(d => {
                    dateOptionsDiv.innerHTML += `
                        <label class="flex items-center px-3 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-gray-100 last:border-b-0">
                            <input type="checkbox" value="${d}" class="mr-2 p3-date-cb rounded text-teal-600 focus:ring-teal-500" onchange="onP3DateCheckboxChange()">
                            <span class="text-gray-700">${d}</span>
                        </label>
                    `;
                });

                // สร้าง Dropdown ผู้ส่งเงิน (ดึงข้อมูลเจ้าหน้าที่)
                initP3StaffDropdown();
                
                // สร้าง Dropdown จุดบริการ
                initP3PointDropdown();

                // ล้างกล่องแสดงข้อมูลเวร
                document.getElementById('p3-shift-container').innerHTML = `
                    <div class="text-slate-400 text-sm text-center py-4">-- กรุณาเลือกวันที่ด้านซ้ายก่อน --</div>
                `;

                document.getElementById('loading-p3').classList.add('hidden');
            } catch (error) {
                console.error("Error loading page 3 data:", error);
                document.getElementById('loading-p3').classList.add('hidden');
                alert("ไม่สามารถดึงข้อมูลสำหรับหน้าสรุปส่งเงินได้");
            }
        }

        function initP3StaffDropdown() {
            const listDiv = document.getElementById('p3-staff-options-list');
            listDiv.innerHTML = '';
            let sortedStaffs = Object.keys(staffData).sort();
            sortedStaffs.forEach(staff => {
                listDiv.innerHTML += `
                    <div class="p3-staff-option px-3 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-slate-100 last:border-b-0 text-slate-700" data-value="${staff}" data-pos="${staffData[staff] || ''}" onclick="selectP3Staff(this)">${staff}</div>
                `;
            });
            document.getElementById('p3-staff-input').value = '';
            document.getElementById('p3-position-input').value = '';
        }

        function toggleP3StaffDropdown() {
            const optionsDiv = document.getElementById('p3-staff-options');
            document.querySelectorAll('.receipt-options, .item-options, #p3-date-options, #p2-date-options, #p3-point-options').forEach(el => el.classList.add('hidden'));
            optionsDiv.classList.remove('hidden');
            filterP3Staffs(document.getElementById('p3-staff-input'));
        }

        function filterP3Staffs(input) {
            const filter = input.value.toLowerCase();
            const optionsDiv = document.getElementById('p3-staff-options');
            optionsDiv.classList.remove('hidden');
            const options = optionsDiv.querySelectorAll('.p3-staff-option');
            options.forEach(opt => {
                opt.style.display = opt.innerText.toLowerCase().includes(filter) ? 'block' : 'none';
            });
        }

        function selectP3Staff(div) {
            const input = document.getElementById('p3-staff-input');
            input.value = div.dataset.value;
            document.getElementById('p3-position-input').value = div.dataset.pos;
            document.getElementById('p3-staff-options').classList.add('hidden');
        }

        function initP3PointDropdown() {
            const listDiv = document.getElementById('p3-point-options-list');
            listDiv.innerHTML = '';
            uniqueServicePoints.forEach(point => {
                listDiv.innerHTML += `
                    <div class="p3-point-option px-3 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-slate-100 last:border-b-0 text-slate-700" data-value="${point}" onclick="selectP3Point(this)">${point}</div>
                `;
            });
            document.getElementById('p3-point-input').value = '';
        }

        function toggleP3PointDropdown() {
            const optionsDiv = document.getElementById('p3-point-options');
            document.querySelectorAll('.receipt-options, .item-options, #p3-date-options, #p2-date-options, #p3-staff-options').forEach(el => el.classList.add('hidden'));
            optionsDiv.classList.remove('hidden');
            filterP3Points(document.getElementById('p3-point-input'));
        }

        function filterP3Points(input) {
            const filter = input.value.toLowerCase();
            const optionsDiv = document.getElementById('p3-point-options');
            optionsDiv.classList.remove('hidden');
            const options = optionsDiv.querySelectorAll('.p3-point-option');
            options.forEach(opt => {
                opt.style.display = opt.innerText.toLowerCase().includes(filter) ? 'block' : 'none';
            });
        }

        function selectP3Point(div) {
            const input = document.getElementById('p3-point-input');
            input.value = div.dataset.value;
            document.getElementById('p3-point-options').classList.add('hidden');
        }

        function toggleP3DateDropdown(input) {
            const optionsDiv = document.getElementById('p3-date-options');
            document.querySelectorAll('.receipt-options, .item-options, #p2-date-options, #p3-staff-options, #p3-point-options').forEach(el => el.classList.add('hidden'));
            if (optionsDiv.classList.contains('hidden')) {
                optionsDiv.classList.remove('hidden');
            } else {
                optionsDiv.classList.add('hidden');
            }
        }

        function filterP3Dates(input) {
            const filter = input.value.toLowerCase();
            const labels = document.querySelectorAll('#p3-date-checkbox-list label');
            labels.forEach(label => {
                const span = label.querySelector('span');
                if (span && span.innerText.toLowerCase().includes(filter)) {
                    label.style.display = 'flex';
                } else {
                    label.style.display = 'none';
                }
            });
        }

        function onP3DateCheckboxChange() {
            const checkboxes = document.querySelectorAll('.p3-date-cb:checked');
            p3SelectedDates = [];
            checkboxes.forEach(cb => p3SelectedDates.push(cb.value));
            
            // แสดงวันที่ที่เลือกทั้งหมดในช่อง Input
            p3SelectedDates.sort();
            document.getElementById('p3-date-input').value = p3SelectedDates.join(', ');

            // อัปเดตรายการวันที่และรอบเวรทางขวา
            updateP3ShiftsTable();
        }

        function updateP3ShiftsTable() {
            const container = document.getElementById('p3-shift-container');
            if (p3SelectedDates.length === 0) {
                container.innerHTML = `
                    <div class="text-slate-400 text-sm text-center py-4">-- กรุณาเลือกวันที่ด้านซ้ายก่อน --</div>
                `;
                return;
            }

            let html = `
                <table class="w-full text-left border-collapse border border-slate-200 rounded-lg overflow-hidden">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200">
                            <th class="p-2 text-sm font-semibold text-slate-700 w-1/2">วันที่ทำรายการ</th>
                            <th class="p-2 text-sm font-semibold text-slate-700 w-1/2">รอบเวรที่มีข้อมูล (ติ๊กเลือกเพื่อรวมข้อมูล)</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            p3SelectedDates.forEach(date => {
                // ค้นหาเวรทั้งหมดที่มีการบันทึกในวันนั้น
                let shiftsForDate = new Set();
                savedRecords.forEach(r => {
                    if (r[0].trim() === date && r[1] && r[1].trim() !== '') {
                        shiftsForDate.add(r[1].trim());
                    }
                });

                let sortedShifts = Array.from(shiftsForDate).sort();
                let shiftCheckboxesHtml = "";

                if (sortedShifts.length === 0) {
                    shiftCheckboxesHtml = `<span class="text-xs text-rose-500 font-medium">ไม่พบข้อมูลเวร</span>`;
                } else {
                    sortedShifts.forEach(shift => {
                        shiftCheckboxesHtml += `
                            <label class="inline-flex items-center bg-white border border-slate-200 hover:border-teal-400 rounded-lg px-2.5 py-1 text-xs cursor-pointer select-none transition-colors shadow-sm">
                                <input type="checkbox" value="${shift}" data-date="${date}" class="p3-shift-cb mr-1.5 rounded text-teal-600 focus:ring-teal-500" checked>
                                <span class="text-slate-700 font-medium">${shift}</span>
                            </label>
                        `;
                    });
                }

                html += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                        <td class="p-2 text-sm font-medium text-slate-600">${date}</td>
                        <td class="p-2 flex flex-wrap gap-2">${shiftCheckboxesHtml}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;
            container.innerHTML = html;
        }

        function generateP3Summary() {
            if (p3SelectedDates.length === 0) {
                alert('กรุณาเลือกวันที่ก่อนทำรายการสรุปข้อมูล');
                return;
            }

            // รับค่าเงื่อนไขผู้ส่งเงิน วันที่สรุปส่งเงิน และจุดบริการที่ต้องการจัดพิมพ
            const p3Staff = document.getElementById('p3-staff-input').value;
            const p3Pos = document.getElementById('p3-position-input').value;
            const p3PrintDate = document.getElementById('p3-print-date-picker').value;
            const p3ServicePoint = document.getElementById('p3-point-input').value;

            if(!p3Staff || !p3PrintDate || !p3ServicePoint) {
                alert('กรุณาระบุ ผู้ส่งเงิน, วันที่สรุปส่งเงิน และ จุดบริการ ให้ครบถ้วน');
                return;
            }

            // รวบรวมข้อมูล วันที่ และ เวร ที่ถูกเลือกติ๊กไว้
            const checkedShifts = document.querySelectorAll('.p3-shift-cb:checked');
            if (checkedShifts.length === 0) {
                alert('กรุณาติ๊กเลือกเวรของแต่ละวันที่ต้องการสรุปข้อมูลอย่างน้อย 1 รายการ');
                return;
            }

            let filterConditions = []; // เก็บ object {date, shift}
            checkedShifts.forEach(cb => {
                filterConditions.push({
                    date: cb.dataset.date,
                    shift: cb.value
                });
            });

            // ดึงข้อมูลตามเงื่อนไขที่ติ๊กเลือกทั้งหมดมารวมกัน
            let filtered = savedRecords.filter(r => {
                return filterConditions.some(cond => r[0].trim() === cond.date && r[1].trim() === cond.shift);
            });

            let groups = {}; 

            filtered.forEach(r => {
                let bookNo = r[5] ? r[5].trim() : '';
                let receiptStr = r[6] ? r[6].trim() : '';
                let item = r[7] ? r[7].trim() : '';
                let amount = parseFloat((r[8] || '0').replace(/,/g, '')) || 0;
                if (!bookNo) return; 

                if(!groups[bookNo]) groups[bookNo] = { receipts: new Set(), items: {} };
                let parsedNums = parseReceipts(receiptStr);
                parsedNums.forEach(n => groups[bookNo].receipts.add(n));

                let isQR = item.toUpperCase().includes('QR-CODE');
                if(!groups[bookNo].items[item]) groups[bookNo].items[item] = { amount: 0, isQR: isQR };
                groups[bookNo].items[item].amount += amount;
            });

            let tbody = document.getElementById('p3-summaryTable');
            tbody.innerHTML = '';
            
            let totalCash = 0, totalQR = 0, hasData = false;
            let sortedBooks = Object.keys(groups).sort();
            let printRows = [];

            sortedBooks.forEach(bookNo => {
                hasData = true;
                let g = groups[bookNo];
                let receiptArray = Array.from(g.receipts);
                let receiptFormatted = formatReceiptRanges(receiptArray); 
                let itemKeys = Object.keys(g.items).sort();
                
                itemKeys.forEach((item, index) => {
                    let itemData = g.items[item];
                    let cashAmt = itemData.isQR ? 0 : itemData.amount;
                    let qrAmt = itemData.isQR ? itemData.amount : 0;
                    totalCash += cashAmt; totalQR += qrAmt;

                    let cashStr = cashAmt > 0 ? cashAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';
                    let qrStr = qrAmt > 0 ? qrAmt.toLocaleString('en-US', {minimumFractionDigits:2}) : '-';

                    // UI Table Row
                    let tr = document.createElement('tr');
                    tr.className = "border-b hover:bg-slate-50 transition-colors";
                    if (index === 0) {
                        tr.innerHTML = `
                            <td class="p-3 border-r align-top text-center text-sm font-medium text-slate-700" rowspan="${itemKeys.length}">${bookNo}/${receiptFormatted}</td>
                            <td class="p-3 border-r text-sm text-slate-600">${item}</td>
                            <td class="p-3 border-r text-right text-sm font-medium text-emerald-600">${cashStr}</td>
                            <td class="p-3 text-right text-sm font-medium text-blue-600">${qrStr}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="p-3 border-r text-sm text-slate-600">${item}</td>
                            <td class="p-3 border-r text-right text-sm font-medium text-emerald-600">${cashStr}</td>
                            <td class="p-3 text-right text-sm font-medium text-blue-600">${qrStr}</td>
                        `;
                    }
                    tbody.appendChild(tr);

                    // เก็บข้อมูลไว้ทำโหมดพิมพ์
                    printRows.push({
                        bookNo: bookNo,
                        receiptFormatted: receiptFormatted,
                        item: item,
                        cashAmt: cashAmt,
                        qrAmt: qrAmt
                    });
                });
            });

            if(!hasData) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">ไม่พบข้อมูลตามช่วงวันที่และเวรที่เลือก</td></tr>`;
                document.getElementById('p3-btn-actions').classList.add('hidden');
                return;
            }

            let grandTotal = totalCash + totalQR;

            // อัปเดตยอดรวมบนหน้าจอ UI หน้า 3
            document.getElementById('p3-totalCash').innerText = totalCash.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('p3-totalQR').innerText = totalQR.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('p3-totalAll').innerText = grandTotal.toLocaleString('en-US', {minimumFractionDigits:2});

            // แปลงรอบเวรที่เลือกส่งนำไปพิมพ
            let shiftLabel = filterConditions.map(c => `${c.date.split('/')[0]} (${c.shift})`).join(', ');

            // สร้าง HTML ลงใน printArea (A4 Modern Split Pages)
            generatePrintAreaHTML(printRows, p3PrintDate, p3ServicePoint, shiftLabel, p3Staff, p3Pos, totalCash, totalQR, grandTotal, false);

            document.getElementById('p3-btn-actions').classList.remove('hidden');
        }

        // ==========================================
        // ฟังก์ชันสั่งพิมพ์และส่งออกเอกสารที่กู้คืนกลับมา
        // ==========================================
        function executePrint() { 
            window.print(); 
        }

        function exportExcel() {
            const table = document.getElementById("export-table");
            let html = table.outerHTML;
            let dataUri = 'data:application/vnd.ms-excel;charset=utf-8,' + encodeURIComponent('<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>' + html + '</body></html>');
            
            // ตรวจสอบวันที่จากหน้าจอที่เปิดใช้งานอยู่แบบไดนามิกเพื่อใช้ตั้งชื่อไฟล์
            let dateStr = "รายงาน";
            const p2DateEl = document.getElementById('p2-date-input');
            const p3DateEl = document.getElementById('p3-print-date-picker');
            
            if (p2DateEl && p2DateEl.value) {
                dateStr = p2DateEl.value.replace(/\//g, '-');
            } else if (p3DateEl && p3DateEl.value) {
                dateStr = p3DateEl.value.replace(/\//g, '-');
            }
            
            let link = document.createElement('a');
            link.href = dataUri; 
            link.download = `บันทึกนำส่งเงิน_${dateStr}.xls`;
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link);
        }

        window.onload = loadData;
    </script>
</head>

                            <th class="px-4 py-4 text-left text-[11px] font-bold text-slate-500 uppercase border-r">วัตถุประสงค์</th>

                <div id="loading" class="hidden flex flex-col justify-center items-center py-16 bg-white no-print">
                    <div class="loader mb-4"></div>
                    <span class="text-blue-600 font-bold animate-pulse">กำลังเรียกข้อมูลจากฐานข้อมูล...</span>

                    <i class="fas fa-folder-open text-4xl mb-3 block opacity-20"></i>
                    ไม่พบข้อมูลผู้บริจาคตามเงื่อนไขที่เลือก

    </div>

    <!-- MODAL: ยืนยันการลบ -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center transform transition-all scale-100">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-trash-alt text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">ยืนยันการลบข้อมูล?</h3>
            <p class="text-slate-500 mb-8 leading-relaxed text-sm">คุณต้องการลบข้อมูลของ <strong id="deleteTargetName" class="text-slate-800"></strong> ถาวรใช่หรือไม่?</p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeDeleteModal()" class="bg-slate-100 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-200 transition">ยกเลิก</button>
                <button onclick="executeDelete()" id="btnConfirmDelete" class="bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 shadow-lg shadow-red-200 transition">ยืนยันการลบ</button>
            </div>
        </div>
    </div>

    <!-- MODAL: แก้ไขข้อมูล -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto transform transition-all scale-100">
            <div class="bg-blue-700 text-white p-6 sticky top-0 flex justify-between items-center">
                <h2 class="text-xl font-bold flex items-center"><i class="fas fa-user-edit mr-3"></i> แก้ไขข้อมูลผู้บริจาค</h2>
                <button onclick="closeEditModal()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/20 transition text-2xl">&times;</button>
            </div>
            
            <form id="editDonationForm" onsubmit="submitEditForm(event)" class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">เลขบัตรประชาชน</label>
                        <input type="text" id="editIdCard" maxlength="13" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ชื่อ-สกุล</label>
                        <input type="text" id="editName" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">ที่อยู่</label>
                    <textarea id="editAddress" rows="2" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition resize-none"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
