                        <select id="editObjective" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition">
                            <option value="เพื่อซื้อครุภัณฑ์ทางการแพทย์">เพื่อซื้อครุภัณฑ์ทางการแพทย์</option>
                            <option value="เพื่อซื้อวัสดุทางการแพทย์">เพื่อซื้อวัสดุทางการแพทย์</option>
                            <option value="ไม่ระบุวัตถุประสงค์">ไม่ระบุวัตถุประสงค์</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">รูปแบบการบริจาค</label>
                        <select id="editFormat" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition">
                            <option value="เงินสด">เงินสด</option>
                            <option value="เงินโอน">เงินโอน</option>
                            <option value="QR-Code">QR-Code</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">จำนวนเงิน (บาท)</label>
                        <input type="number" id="editAmount" min="0" step="0.01" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">วันที่บริจาค</label>
                        <input type="date" id="editDateInput" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 outline-none focus:border-blue-500 transition">
                    </div>
                </div>
                <div class="pt-6 flex justify-end space-x-4 border-t">
                    <button type="button" onclick="closeEditModal()" class="bg-slate-100 text-slate-600 font-bold py-3 px-8 rounded-xl hover:bg-slate-200 transition">ยกเลิก</button>
                    <button type="submit" id="btnSubmitEdit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center transform active:scale-95">
                        <i class="fas fa-save mr-2"></i> บันทึกการแก้ไข
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ALERT BOX -->
    <div id="messageBox" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center">
            <div id="msgIcon" class="text-5xl mb-4"></div>
            <h3 id="msgTitle" class="text-xl font-bold mb-2 text-slate-800"></h3>
            <p id="msgText" class="text-slate-500 mb-8 leading-relaxed"></p>
            <button onclick="closeMessage()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition transform active:scale-95">ตกลง</button>
        </div>
    </div>

    <script>
        // =================================================================
        // CONFIGURATION: อัปเดต URL สคริปต์ล่าสุดที่นี่
        // =================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfkrttY3TlUgs6MSksLwewomTnT4QgoCXJ8Wb44Kg7_d6jwf1nOXApCTBov0naFmFi/exec'; 
        const SHEET_ID = '1Th-IKpc8o9lQPLCzk-BOzbeJ13nMlhFgIdXvOgIYXd4';
        
        let allData = []; 
        let currentFilteredData = []; 
        let selectedItemForEdit = null; 
        let selectedItemForDelete = null;

        // สลับหน้าจอ Form/Report
        function switchTab(tab) {
            document.getElementById('formSection').classList.toggle('hidden', tab !== 'form');
            document.getElementById('reportSection').classList.toggle('hidden', tab !== 'report');
            document.getElementById('btnForm').classList.toggle('bg-blue-800', tab === 'form');
            document.getElementById('btnForm').classList.toggle('shadow-inner', tab === 'form');
            document.getElementById('btnReport').classList.toggle('bg-blue-800', tab === 'report');
            document.getElementById('btnReport').classList.toggle('shadow-inner', tab === 'report');
            if(tab === 'report') fetchReport();
        }

        // แปลง ค.ศ. -> พ.ศ.
        function convertToBuddhistYear(dateString) {
            if(!dateString) return "";
            const d = new Date(dateString);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const yearBE = d.getFullYear() + 543;
            return `${day}/${month}/${yearBE}`;
        }

        // แปลง พ.ศ. -> ค.ศ. (สำหรับ Input Date)
        function convertBEtoInputFormat(beString) {
            if(!beString) return "";
            const parts = beString.split('/');
            if(parts.length !== 3) return "";
            const yearCE = parseInt(parts[2]) - 543;
            return `${yearCE}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
        }

        // แปลงข้อความ พ.ศ. เป็น Date Object
        function parseBEString(beString) {
            if(!beString) return null;
            const parts = beString.split('/');
            if(parts.length !== 3) return null;
            return new Date(`${parseInt(parts[2])-543}-${parts[1]}-${parts[0]}T00:00:00`);
        }

        // --- 1. บันทึกข้อมูล (Action: insert) ---
        async function submitForm(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-3"></i> กำลังบันทึก...';
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('action', 'insert');
            formData.append('idCard', document.getElementById('idCard').value);
            formData.append('name', document.getElementById('name').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('objective', document.getElementById('objective').value);
            formData.append('format', document.getElementById('format').value);
            formData.append('amount', document.getElementById('amount').value);
            formData.append('dateBE', convertToBuddhistYear(document.getElementById('dateInput').value));

            try {
                // ใช้ no-cors เพราะ GAS redirect ตลอดเวลา
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });
                showMessage("สำเร็จ", "บันทึกข้อมูลผู้บริจาคลงฐานข้อมูลเรียบร้อยแล้ว", "success");
                document.getElementById('donationForm').reset();
                document.getElementById('dateInput').valueAsDate = new Date();
                allData = []; // Clear cache
            } catch (e) {
                showMessage("ผิดพลาด", "ไม่สามารถเชื่อมต่อฐานข้อมูลได้ในขณะนี้", "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // --- 2. ดึงข้อมูลรายงาน (Read via GViz API) ---
        async function fetchReport() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('noData').classList.add('hidden');

            try {
                // ใช้ Google Visualization API เพื่อเลี่ยงปัญหา CORS
                const response = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
                const text = await response.text();
                const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));

                allData = json.table.rows
                    .filter(r => r.c && r.c[1] && r.c[1].v)
                    .map(r => ({
                        idCard: String(r.c[1].v).trim(),
                        name: r.c[2]?.v ? String(r.c[2].v).trim() : '',
                        address: r.c[3]?.v || '',
                        objective: r.c[4]?.v || '',
                        format: r.c[5]?.v || '',
                        amount: parseFloat(r.c[6]?.v || 0),
                        dateBE: r.c[7] ? (r.c[7].f || String(r.c[7].v)).trim() : ''
                    }))
                    .filter(item => !item.idCard.includes('บัตร') && item.idCard !== 'idCard');

                filterAndRender();
            } catch (e) {
                document.getElementById('noData').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
                document.getElementById('noData').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function filterAndRender() {
            const start = document.getElementById('filterStartDate').value;
            const end = document.getElementById('filterEndDate').value;
            const sDate = start ? new Date(start) : null;
            const eDate = end ? new Date(end) : null;

            currentFilteredData = allData.filter(row => {
                const d = parseBEString(row.dateBE);
                if(!d) return true;
                if(sDate && d < sDate) return false;
                if(eDate && d > eDate) return false;
                return true;
            });

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if(currentFilteredData.length === 0) { 
                document.getElementById('noData').classList.remove('hidden'); 
                return; 
            }

            let grandTotal = 0;
            currentFilteredData.forEach((item, i) => {
                const tr = document.createElement('tr');
                tr.className = i % 2 === 0 ? 'bg-white hover:bg-slate-50 transition-colors' : 'bg-slate-50/50 hover:bg-slate-100 transition-colors';
                grandTotal += item.amount;
                
                tr.innerHTML = `
                    <td class="px-4 py-4 text-center border-r text-sm text-slate-500">${i + 1}</td>
                    <td class="px-4 py-4 border-r text-sm font-medium text-slate-800">${item.dateBE}</td>
                    <td class="px-4 py-4 border-r text-sm text-slate-600">${item.idCard}</td>
                    <td class="px-4 py-4 border-r text-sm font-bold text-slate-800">${item.name}</td>
                    <td class="px-4 py-4 border-r text-xs text-slate-500 max-w-xs truncate">${item.address}</td>
                    <td class="px-4 py-4 border-r text-sm text-slate-600">${item.objective}</td>
                    <td class="px-4 py-4 border-r text-sm text-slate-600">${item.format}</td>
                    <td class="px-4 py-4 text-right border-r text-sm font-bold text-blue-700">${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                    <td class="px-4 py-4 text-center no-print">
                        <div class="flex justify-center space-x-2">
                            <button onclick="openEdit(${i})" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition shadow-sm" title="แก้ไข"><i class="fas fa-edit text-xs"></i></button>
                            <button onclick="openDelete(${i})" class="w-8 h-8 flex items-center justify-center rounded-lg bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition shadow-sm" title="ลบ"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </td>`;
                tbody.appendChild(tr);
            });

            const footerRow = document.createElement('tr');
            footerRow.className = 'bg-slate-800 text-white font-bold';
            footerRow.innerHTML = `
                <td colspan="7" class="px-4 py-4 text-right text-xs uppercase tracking-widest border-r">ยอดเงินรวมทั้งหมด (Grand Total)</td>
                <td class="px-4 py-4 text-right text-base border-r">${grandTotal.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                <td class="no-print border-r"></td>`;
            tbody.appendChild(footerRow);
        }

        // --- 3. ลบข้อมูล (Action: delete) ---
        function openDelete(i) {
            selectedItemForDelete = currentFilteredData[i];
            document.getElementById('deleteTargetName').innerText = selectedItemForDelete.name;
            document.getElementById('deleteModal').classList.remove('hidden');
        }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); }
        
        async function executeDelete() {
            const btn = document.getElementById('btnConfirmDelete');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            
            const formData = new URLSearchParams();
            formData.append('action', 'delete');
            formData.append('idCard', selectedItemForDelete.idCard);
            formData.append('name', selectedItemForDelete.name);
            formData.append('dateBE', selectedItemForDelete.dateBE);

            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });
                closeDeleteModal();
                showMessage("ลบสำเร็จ", "ลบข้อมูลผู้บริจาคออกจากระบบเรียบร้อยแล้ว", "success");
                allData = []; 
                fetchReport();
            } catch (e) { showMessage("ผิดพลาด", "ไม่สามารถลบข้อมูลได้ในขณะนี้", "error"); }
            finally { btn.disabled = false; btn.innerHTML = 'ยืนยันการลบ'; }
        }

        // --- 4. แก้ไขข้อมูล (Action: edit) ---
        function openEdit(i) {
            selectedItemForEdit = currentFilteredData[i];
            document.getElementById('editIdCard').value = selectedItemForEdit.idCard;
            document.getElementById('editName').value = selectedItemForEdit.name;
            document.getElementById('editAddress').value = selectedItemForEdit.address;
            document.getElementById('editObjective').value = selectedItemForEdit.objective;
            document.getElementById('editFormat').value = selectedItemForEdit.format;
            document.getElementById('editAmount').value = selectedItemForEdit.amount;
            document.getElementById('editDateInput').value = convertBEtoInputFormat(selectedItemForEdit.dateBE);
            document.getElementById('editModal').classList.remove('hidden');
        }
        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }
        
        async function submitEditForm(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitEdit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-3"></i> กำลังอัปเดต...';

            const formData = new URLSearchParams();
            formData.append('action', 'edit');
            formData.append('old_idCard', selectedItemForEdit.idCard);
            formData.append('old_name', selectedItemForEdit.name);
            formData.append('old_dateBE', selectedItemForEdit.dateBE);
            
            formData.append('idCard', document.getElementById('editIdCard').value);
            formData.append('name', document.getElementById('editName').value);
            formData.append('address', document.getElementById('editAddress').value);
            formData.append('objective', document.getElementById('editObjective').value);
            formData.append('format', document.getElementById('editFormat').value);
            formData.append('amount', document.getElementById('editAmount').value);
            formData.append('dateBE', convertToBuddhistYear(document.getElementById('editDateInput').value));

            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });
                closeEditModal();
                showMessage("สำเร็จ", "อัปเดตข้อมูลผู้บริจาคเรียบร้อยแล้ว", "success");
                allData = []; 
                fetchReport();
            } catch (e) { showMessage("ผิดพลาด", "ไม่สามารถอัปเดตข้อมูลได้", "error"); }
            finally { btn.disabled = false; btn.innerHTML = 'บันทึกการแก้ไข'; }
        }

        // --- ระบบแจ้งเตือน ---
        function showMessage(title, text, type) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            const icon = document.getElementById('msgIcon');
            if(type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i>';
                document.getElementById('msgTitle').className = "text-xl font-bold mb-2 text-emerald-700";
            } else {
                icon.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                document.getElementById('msgTitle').className = "text-xl font-bold mb-2 text-red-700";
            }
            document.getElementById('messageBox').classList.remove('hidden');
        }
        function closeMessage() { document.getElementById('messageBox').classList.add('hidden'); }

        function exportToExcel() {
            const table = document.getElementById("reportTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Donations"});
            XLSX.writeFile(wb, `Donation_Report_${new Date().getTime()}.xlsx`);
        }

        // ตั้งค่าเริ่มต้น
        document.getElementById('dateInput').valueAsDate = new Date();
    </script>
</body>
</html>
    </template>

    <template id="temp_receive_excel">
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Sheet Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 600; background-color: white; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white; padding: 0; }
            .max-w-6xl { max-width: 100%; width: 100%; padding: 0; margin: 0; }
            .shadow-lg { box-shadow: none; border: none; }
            table { font-size: 10pt; width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #e2e8f0; padding: 8px; }
            .overflow-y-auto { overflow: visible !important; max-height: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-4 md:p-8">
        
        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <!-- Navigation Tabs -->
            <div class="flex border-b border-gray-200 bg-gray-100 no-print">
                <button onclick="showPage('upload')" id="btn-upload" class="flex-1 py-4 text-center transition-all hover:bg-white tab-active">
                    Upload
                </button>
                <button onclick="showPage('report')" id="btn-report" class="flex-1 py-4 text-center transition-all hover:bg-white text-gray-500">
                    Report
                </button>
            </div>

            <div class="p-6">
                <!-- PAGE 1: UPLOAD (Upload & Display Data) -->
                <div id="page-upload" class="block space-y-6 no-print">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                            📤 อัปโหลดและแสดงผลข้อมูล
                        </h2>
                        <button onclick="clearData()" class="px-6 py-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition shadow-sm text-sm font-semibold">
                            ล้างข้อมูลทั้งหมด
                        </button>
                    </div>
                    
                    <!-- Upload Box -->
                    <div class="bg-blue-50 p-6 rounded-xl border-2 border-dashed border-blue-200 text-center">
                        <div class="max-w-md mx-auto">
                            <label class="block text-sm font-semibold text-gray-700 mb-3 text-lg">เลือกไฟล์ Excel หรือ CSV</label>
                            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" 
                                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer transition-all shadow-sm">
                        </div>
                    </div>

                    <!-- Status Display -->
                    <div id="statusMessage" class="text-sm font-medium p-2 rounded hidden"></div>

                    <!-- Table View -->
                    <div class="overflow-x-auto border border-gray-200 rounded-xl max-h-[500px] shadow-sm bg-white">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th class="p-4 border-b w-10"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" class="w-4 h-4 rounded text-blue-600 border-gray-300"></th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">ลำดับ</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">ชื่อบัญชี</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">วันที่</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">เวลา</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">ผู้ชำระ</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">Ref 1</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider">Ref 2</th>
                                    <th class="p-4 border-b text-xs font-bold text-gray-500 uppercase tracking-wider text-right">จำนวนเงิน</th>
                                </tr>
                            </thead>
                            <tbody id="dataTableBody" class="text-sm divide-y divide-gray-100">
                                <tr>
                                    <td colspan="9" class="p-12 text-center text-gray-400 italic bg-gray-50/50">
                                        ยังไม่มีข้อมูล กรุณาเลือกไฟล์เพื่อแสดงผลที่นี่
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Action Button -->
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-2">
                        <div id="uploadStatus" class="text-sm font-medium"></div>
                        <button id="uploadBtn" onclick="uploadSelectedData()" disabled
                            class="w-full md:w-auto flex items-center justify-center gap-3 bg-green-600 text-white px-12 py-4 rounded-2xl font-bold hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-all shadow-lg active:scale-95">
                            <span>อัปโหลดไปที่ Google Sheet</span>
                            <div id="btnLoader" class="loader hidden"></div>
                        </button>
                    </div>
                </div>

                <!-- PAGE 2: REPORT -->
                <div id="page-report" class="hidden space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                        <h2 class="text-xl font-bold text-gray-500 flex items-center gap-2">
                            📄 รายงานสรุป
                        </h2>
                        <div class="flex gap-2">
                            <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-green-700 transition flex items-center gap-2 shadow-md">
                                <span>Export Excel</span>
                            </button>
                            <button onclick="window.print()" class="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-500 transition flex items-center gap-2 shadow-md">
                                <span>พิมพ์ PDF</span>
                            </button>
                            <button onclick="fetchExternalData()" class="bg-gray-200 text-gray-500 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition flex items-center gap-2">
                                <span id="refreshIcon">🔄</span> <span>รีเฟรช</span>
                            </button>
                        </div>
                    </div>

                    <!-- Filter Section (Updated to Range) -->
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex flex-wrap items-center gap-4 no-print shadow-sm">
                        <div class="flex flex-wrap items-center gap-4">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-semibold text-gray-600">จากวันที่:</span>
                                <input type="date" id="filterDateFrom" onchange="applyReportFilter()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-semibold text-gray-600">ถึงวันที่:</span>
                                <input type="date" id="filterDateTo" onchange="applyReportFilter()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <button onclick="resetReportFilter()" class="text-sm text-blue-600 hover:underline">ล้างตัวกรอง</button>
                        <div id="reportSummary" class="text-sm text-gray-500 ml-auto"></div>
                    </div>

                    <div class="print-only text-center py-4 hidden">
                        <h1 class="text-2xl font-bold">รายงานสรุปข้อมูลจากระบบ</h1>
                        <p class="text-sm text-gray-500">ข้อมูลอัปเดต ณ วันที่ <span id="printDate"></span></p>
                    </div>

                    <div class="overflow-x-auto border border-gray-200 rounded-xl shadow-sm bg-white overflow-y-auto max-h-[600px]">
                        <table id="reportTable" class="w-full text-left border-collapse">
                            <thead class="bg-gray-100 sticky top-0 z-10">
                                <tr>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">ลำดับ</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">ชื่อบัญชี</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">วันที่</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">เวลา</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">ผู้ชำระ</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">Ref 1</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase">Ref 2</th>
                                    <th class="p-3 border-b text-xs font-bold text-gray-500 uppercase text-right">จำนวนเงิน</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody" class="text-sm divide-y divide-gray-100">
                                <tr>
                                    <td colspan="8" class="p-12 text-center text-gray-400 italic">
                                        กำลังดึงข้อมูลจาก Google Sheets...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="reportLoadingStatus" class="text-xs text-gray-400 text-center no-print"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Embedded Updated Script URL -->
    <input type="hidden" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzZSj3XHiZMWcWl2CSmHHC7vM2GTBTZlryeHt2YY8Kp1jH0VEQvMeGNw-2JJ9LdLUwa/exec">
    <!-- Published Sheet CSV Link -->
    <input type="hidden" id="publicCsvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSk7h2rEdBSZ5u4jAS7uv6XW5m53qUB8fiPAaMizjxUJ5ThTiafYJksPkcuoGprN6sQDLUAlWGJ3-MT/pub?output=csv">

    <script>
        let processedData = [];
        let allReportData = []; // เก็บข้อมูลทั้งหมดที่ดึงมาจาก Sheet

        document.getElementById('fileInput').addEventListener('change', handleFile);

        function showPage(pageId) {
            const pageUpload = document.getElementById('page-upload');
            const pageReport = document.getElementById('page-report');
            const btnUpload = document.getElementById('btn-upload');
            const btnReport = document.getElementById('btn-report');

            if (pageId === 'upload') {
                pageUpload.classList.remove('hidden');
                pageReport.classList.add('hidden');
                btnUpload.classList.add('tab-active');
                btnUpload.classList.remove('text-gray-500');
                btnReport.classList.remove('tab-active');
                btnReport.classList.add('text-gray-500');
            } else {
                pageUpload.classList.add('hidden');
                pageReport.classList.remove('hidden');
                btnReport.classList.add('tab-active');
                btnReport.classList.remove('text-gray-500');
                btnUpload.classList.remove('tab-active');
                btnUpload.classList.add('text-gray-500');
                fetchExternalData();
            }
        }

        async function fetchExternalData() {
            const tbody = document.getElementById('reportTableBody');
            const status = document.getElementById('reportLoadingStatus');
            const csvUrl = document.getElementById('publicCsvUrl').value;
            
            status.textContent = "กำลังซิงค์ข้อมูล...";
            
            try {
                const response = await fetch(csvUrl + '&t=' + new Date().getTime());
                const csvData = await response.text();
                const rows = csvData.split('\n').map(row => {
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : row.split(',');
                });
                
                allReportData = rows.filter((r, i) => i > 0 && r.length >= 5 && r[1]);
                renderReportTable(allReportData);
                
                status.textContent = "อัปเดตล่าสุด: " + new Date().toLocaleTimeString();
                document.getElementById('printDate').textContent = new Date().toLocaleDateString('th-TH');
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="8" class="p-12 text-center text-red-500 italic">เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + err.message + '</td></tr>';
                status.textContent = "โหลดไม่สำเร็จ";
            }
        }

        function formatSimpleCurrency(val) {
            if (typeof val === 'string') {
                val = val.replace(/,/g, ''); 
            }
            const num = parseFloat(val);
            if (isNaN(num)) return "0.00";
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        }

        function renderReportTable(data) {
            const tbody = document.getElementById('reportTableBody');
            const summary = document.getElementById('reportSummary');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-12 text-center text-gray-400 italic">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>';
                summary.textContent = "ไม่พบรายการ";
                return;
            }

            // นับจำนวนข้อมูลที่ซ้ำกันในคอลัมน์ Ref 2 (ข้อมูลจากคอลัมน์ G คือ r[6])
            const ref2Counts = {};
            data.forEach(r => {
                const ref2 = String(r[6] || '').trim();
                if (ref2 && ref2 !== '-') {
                    ref2Counts[ref2] = (ref2Counts[ref2] || 0) + 1;
                }
            });

            let count = 1;
            let totalAmount = 0; // ตัวแปรสำหรับเก็บยอดรวม

            data.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b border-gray-50";
                
                // คอลลัม จำนวนเงิน เอาข้อมูลจาก คอลลัม H เท่านั้น (r[7])
                const formattedAmount = formatSimpleCurrency(r[7]);

                // คำนวณยอดรวมจาก คอลลัม H (r[7])
                const rawVal = String(r[7] || '0').replace(/,/g, '');
                const numVal = parseFloat(rawVal);
                if (!isNaN(numVal)) {
                    totalAmount += numVal;
                }

                // คอลลัม Ref 2 เอาข้อมูลจาก คอลลัม G เท่านั้น (r[6]) และตรวจสอบค่าซ้ำ
                const ref2Value = String(r[6] || '').trim();
                const isDuplicateRef2 = ref2Value && ref2Value !== '-' && ref2Counts[ref2Value] > 1;
                const ref2Class = isDuplicateRef2 ? "p-3 font-bold text-red-600" : "p-3 text-gray-600";

                // โครงสร้างแถวข้อมูลตาราง Report
                tr.innerHTML = `
                    <td class="p-3 font-medium text-gray-500 text-center">${count++}</td>
                    <td class="p-3 font-semibold text-gray-800">${r[1] || '-'}</td>
                    <td class="p-3 font-mono text-blue-600">${r[2] || '-'}</td>
                    <td class="p-3 font-mono text-blue-600">${r[3] || '-'}</td>
                    <td class="p-3 text-gray-700">${r[4] || '-'}</td>
                    <td class="p-3 text-gray-600">${r[5] || '-'}</td> <td class="${ref2Class}">${ref2Value || '-'}</td>  <td class="p-3 font-bold text-right text-green-600">${formattedAmount}</td> `;
                tbody.appendChild(tr);
            });

            // แถวแสดงผลรวมทั้งหมดท้ายตาราง
            const trTotal = document.createElement('tr');
            trTotal.className = "bg-green-50/70 border-t-2 border-green-300 print:bg-gray-100";
            trTotal.innerHTML = `
                <td colspan="7" class="p-4 font-bold text-right text-gray-800">รวมทั้งหมด:</td>
                <td class="p-4 font-bold text-right text-green-700 border-t border-green-400 print:text-black">${formatSimpleCurrency(totalAmount)}</td>
            `;
            tbody.appendChild(trTotal);

            summary.textContent = `พบทั้งหมด ${data.length} รายการ`;
        }

        // ฟังก์ชันแปลงวันที่รูปแบบ d/m/y จาก Sheet เป็น yyyy-mm-dd สำหรับเปรียบเทียบ
        function convertSheetDateToSortable(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split('/');
            if (parts.length !== 3) return dateStr;
            const d = parts[0].padStart(2, '0');
            const m = parts[1].padStart(2, '0');
            const y = parts[2];
            return `${y}-${m}-${d}`;
        }

        function applyReportFilter() {
            const fromDate = document.getElementById('filterDateFrom').value; 
            const toDate = document.getElementById('filterDateTo').value; 

            if (!fromDate && !toDate) {
                renderReportTable(allReportData);
                return;
            }

            const filteredData = allReportData.filter(r => {
                const sheetDate = convertSheetDateToSortable(String(r[2] || '').trim());
                
                if (fromDate && toDate) {
                    return sheetDate >= fromDate && sheetDate <= toDate;
                } else if (fromDate) {
                    return sheetDate >= fromDate;
                } else if (toDate) {
                    return sheetDate <= toDate;
                }
                return true;
            });

            renderReportTable(filteredData);
        }

        function resetReportFilter() {
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            renderReportTable(allReportData);
        }

        function exportToExcel() {
            const table = document.getElementById('reportTable');
            const wb = XLSX.utils.table_to_book(table, { sheet: "Sheet1" });
            XLSX.writeFile(wb, "Report_Export.xlsx");
        }

        /* --- Upload Logic --- */

        function formatThaiDate(val) {
            if (!val) return "";
            const s = String(val).trim().padStart(8, '0');
            if (s === '00000000' || isNaN(parseInt(s))) return s;
            return `${s.substring(0,2)}/${s.substring(2,4)}/${s.substring(4,8)}`;
        }

        function formatThaiTime(val) {
            if (!val) return "";
            let s = String(val).trim();
            if (s.length === 5) s = '0' + s;
            s = s.padStart(6, '0');
            if (isNaN(parseInt(s))) return s;
            const hh = s.substring(0,2);
            const mm = s.substring(2,4);
            const ss = s.substring(4,6);
            let displayHour = hh;
            if (displayHour.startsWith('0') && displayHour.length > 1) displayHour = displayHour.substring(1);
            return `${displayHour}:${mm}:${ss}`;
        }

        function formatCurrency(val) {
            const num = parseFloat(val);
            if (isNaN(num)) return "0.00";
            const result = num / 100;
            return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(result);
        }

        async function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            updateFileStatus(`กำลังประมวลผลไฟล์ ${file.name}...`, "text-blue-600 bg-blue-50");

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const arrayBuffer = evt.target.result;
                    const fileName = file.name.toLowerCase();
                    let workbook;

                    if (fileName.endsWith('.csv')) {
                        const decoder = new TextDecoder('windows-874');
                        const csvString = decoder.decode(arrayBuffer);
                        workbook = XLSX.read(csvString, { type: 'string' });
                    } else {
                        const data = new Uint8Array(arrayBuffer);
                        workbook = XLSX.read(data, { type: 'array' });
                    }

                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (json.length > 0) {
                        renderTable(json);
                        if (processedData.length > 0) {
                            updateFileStatus(`อ่านไฟล์สำเร็จ: พบข้อมูลตรงตามเงื่อนไข ${processedData.length} รายการ`, "text-green-600 bg-green-50");
                        } else {
                            updateFileStatus("ไม่พบข้อมูลที่มีคำว่า 'D' ในคอลัมน์ A", "text-orange-500 bg-orange-50");
                        }
                    } else {
                        updateFileStatus("ไฟล์ว่างเปล่าหรือไม่พบข้อมูล", "text-red-500 bg-red-50");
                    }
                } catch (err) {
                    updateFileStatus("เกิดข้อผิดพลาด: " + err.message, "text-red-500 bg-red-50");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderTable(rows) {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';
            processedData = [];

            let count = 1;
            rows.forEach((row, index) => {
                const colA = String(row[0] || '');
                if (!colA.includes('D')) return;
                if (index === 0 && (String(row[3]).includes('Account') || String(row[6]).includes('Name'))) return;
                if (!row[3] && !row[6] && !row[15]) return; 

                // แก้ไขส่วนชื่อผู้ชำระ: เปลี่ยนเว้นวรรคเป็นเครื่องหมายขีด (-)
                let payerName = row[6] ? String(row[6]).replace(/\s+/g, '-') : '';

                const item = {
                    id: count++,
                    accountName: row[3] || '',
                    payDate: formatThaiDate(row[4]),
                    payTime: formatThaiTime(row[5]),
                    fullName: payerName,
                    ref1: row[7] || '',
                    ref2: row[8] || '',
                    amount: formatCurrency(row[15] || 0),
                    selected: true
                };

                processedData.push(item);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50/50 transition-colors cursor-pointer border-b border-gray-50";
                tr.onclick = (e) => {
                    if (e.target.type !== 'checkbox') {
                        const cb = tr.querySelector('.row-checkbox');
                        cb.checked = !cb.checked;
                        item.selected = cb.checked;
                    }
                };
                
                tr.innerHTML = `
                    <td class="p-4 text-center"><input type="checkbox" class="row-checkbox w-4 h-4 rounded text-blue-600 border-gray-300" checked onchange="event.stopPropagation(); processedData[${count-2}].selected = this.checked;"></td>
                    <td class="p-4 text-gray-500 font-medium">${item.id}</td>
                    <td class="p-4 font-semibold text-gray-700">${item.accountName}</td>
                    <td class="p-4 font-mono text-blue-700">${item.payDate}</td>
                    <td class="p-4 font-mono text-blue-700">${item.payTime}</td>
                    <td class="p-4 text-gray-700">${item.fullName}</td>
                    <td class="p-4 text-gray-600">${item.ref1}</td>
                    <td class="p-4 text-gray-600">${item.ref2}</td>
                    <td class="p-4 font-bold text-right text-green-600">${item.amount}</td>
                `;
                tbody.appendChild(tr);
            });

            if (processedData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="p-12 text-center text-gray-400 italic bg-gray-50/50">ไม่พบข้อมูลที่คอลัมน์ A มีตัวอักษร "D"</td></tr>';
            }

            document.getElementById('uploadBtn').disabled = processedData.length === 0;
            document.getElementById('selectAll').checked = processedData.length > 0;
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = checked);
            processedData.forEach(d => d.selected = checked);
        }

        function clearData() {
            document.getElementById('fileInput').value = '';
            document.getElementById('dataTableBody').innerHTML = '<tr><td colspan="9" class="p-12 text-center text-gray-400 italic bg-gray-50/50">ข้อมูลถูกล้างแล้ว พร้อมรับไฟล์ใหม่</td></tr>';
            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('uploadStatus').textContent = '';
            document.getElementById('selectAll').checked = false;
            processedData = [];
        }

        async function uploadSelectedData() {
            const url = document.getElementById('scriptUrl').value;
            const dataToSend = processedData.filter(d => d.selected);
            const statusEl = document.getElementById('uploadStatus');
            
            if (dataToSend.length === 0) {
                statusEl.textContent = "กรุณาเลือกอย่างน้อย 1 รายการ";
                statusEl.className = "text-sm font-medium text-orange-500";
                return;
            }

            setLoading(true);
            statusEl.textContent = `กำลังส่งข้อมูล ${dataToSend.length} รายการไปยัง Google Sheet...`;
            statusEl.className = "text-sm font-medium text-blue-500";

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(dataToSend)
                });

                statusEl.textContent = "✅ ส่งข้อมูลสำเร็จ! ตรวจสอบที่ Google Sheets";
                statusEl.className = "text-sm font-bold text-green-600";
                
                setTimeout(() => {
                    if (confirm("ส่งข้อมูลสำเร็จแล้ว ต้องการล้างหน้าจอเพื่อเริ่มงานใหม่หรือไม่?")) {
                        clearData();
                    }
                }, 400);

            } catch (error) {
                console.error(error);
                statusEl.textContent = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อ";
                statusEl.className = "text-sm font-medium text-red-600";
            } finally {
                setLoading(false);
            }
        }

        function updateFileStatus(msg, classes) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `text-sm font-medium p-3 rounded-lg mb-4 block ${classes}`;
            el.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('uploadBtn');
            const loader = document.getElementById('btnLoader');
            if (isLoading) {
                btn.disabled = true;
                loader.classList.remove('hidden');
            } else {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>

                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">เล่มที่ / เลขที่ / TRACE</th>
                                    <th class="px-4 py-3 text-right text-xs font-medium text-gray-600 uppercase tracking-wider">จำนวนเงิน</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-600 uppercase tracking-wider">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="edit-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- ข้อมูลค้นหาเพื่อแก้ไขจะแสดงที่นี่ -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- ส่วนที่ 1: การตั้งค่า (Configuration) ---
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby1Yhqqf6P706tqKqGYpnoaIn-BoR66AELHiw7kcOPsXUlA_yj7C1IBNmsnYpcLfE6X/exec"; 
        
        // --- ส่วนที่ 2: ตัวแปรเก็บข้อมูล (State) ---
        let temporaryRecords = [];
        let staffPositionsMap = {}; 
        let editRecordsMap = []; // เก็บข้อมูลที่ค้นหามาเพื่อใช้แก้ไข

        // ตั้งค่าวันที่เริ่มต้นให้เป็นวันนี้
        const today = new Date();
        document.getElementById('input-date').valueAsDate = today;
        document.getElementById('input-report-date-start').valueAsDate = today;
        document.getElementById('input-report-date-end').valueAsDate = today;
        document.getElementById('input-edit-date-start').valueAsDate = today;
        document.getElementById('input-edit-date-end').valueAsDate = today;

        // โหลดรายชื่อเจ้าหน้าที่เมื่อเปิดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', fetchStaffList);

        async function fetchStaffList() {
            const staffSelect = document.getElementById('input-staff');
            const reportStaffSelect = document.getElementById('input-report-staff');
            const editStaffSelect = document.getElementById('input-edit-staff');
            
            try {
                const response = await fetch(GOOGLE_WEB_APP_URL + "?action=getStaff");
                const result = await response.json();
                
                if(result.status === 'success') {
                    staffSelect.innerHTML = '<option value="">-- เลือกเจ้าหน้าที่ --</option>';
                    reportStaffSelect.innerHTML = '<option value="ทั้งหมด">-- ทั้งหมด --</option>';
                    editStaffSelect.innerHTML = '<option value="ทั้งหมด">-- ทั้งหมด --</option>';
                    
                    result.staff.forEach(item => {
                        const name = typeof item === 'object' ? item.name : item;
                        const position = typeof item === 'object' ? item.position : '';

                        if(name.toString().trim() !== '') {
                            staffPositionsMap[name] = position;

                            const option = document.createElement('option');
                            option.value = name;
                            option.innerText = name;
                            staffSelect.appendChild(option);

                            const optionReport = document.createElement('option');
                            optionReport.value = name;
                            optionReport.innerText = name;
                            reportStaffSelect.appendChild(optionReport);

                            const optionEdit = document.createElement('option');
                            optionEdit.value = name;
                            optionEdit.innerText = name;
                            editStaffSelect.appendChild(optionEdit);
                        }
                    });
                }
            } catch (error) {
                console.error("Fetch staff error:", error);
            }
        }

        // --- ส่วนที่ 3: ฟังก์ชันการทำงาน (Functions) ---

        // สลับแท็บ (Tab Switching)
        function switchTab(tabName) {
            const tabs = ['add', 'report', 'edit'];
            
            tabs.forEach(tab => {
                const tabBtn = document.getElementById(`tab-${tab}`);
                const section = document.getElementById(`section-${tab}`);
                
                if (tab === tabName) {
                    if (tabBtn) tabBtn.className = 'tab-active pb-3 px-4 mr-4 focus:outline-none transition-colors whitespace-nowrap';
                    if (section) section.classList.remove('hidden');
                } else {
                    if (tabBtn) tabBtn.className = 'tab-inactive pb-3 px-4 mr-4 focus:outline-none transition-colors whitespace-nowrap';
                    if (section) section.classList.add('hidden');
                }
            });
            
            // แสดงตารางรายการชั่วคราวเฉพาะในแท็บเพิ่มรายการชั่วคราว ('add')
            const sectionView = document.getElementById('section-view');
            if (sectionView) {
                if (tabName === 'add') {
                    sectionView.classList.remove('hidden');
                    renderTable();
                } else {
                    sectionView.classList.add('hidden');
                }
            }
        }

        // รับข้อมูลจากฟอร์มและบันทึกลง Array
        function handleFormSubmit(event) {
            event.preventDefault(); 
            
            let receiptNoVal = document.getElementById('input-receiptNo').value;
            if (receiptNoVal && !isNaN(receiptNoVal)) {
                receiptNoVal = String(receiptNoVal).padStart(3, '0');
            }

            const record = {
                date: document.getElementById('input-date').value,
                shift: document.getElementById('input-shift').value,
                staff: document.getElementById('input-staff').value,
                hn: document.getElementById('input-hn').value,
                bookNo: document.getElementById('input-bookNo').value,
                receiptNo: receiptNoVal,
                trace: document.getElementById('input-trace').value,
                amount: parseFloat(document.getElementById('input-amount').value)
            };

            const editIndex = parseInt(document.getElementById('edit-index').value);

            if (editIndex === -1) {
                temporaryRecords.push(record);
                Swal.fire({ icon: 'success', title: 'เพิ่มรายการสำเร็จ', timer: 1000, showConfirmButton: false });
            } else {
                temporaryRecords[editIndex] = record;
                document.getElementById('edit-index').value = "-1"; 
                document.getElementById('btn-save').innerHTML = '<i class="fas fa-save mr-1"></i> 1.9 เพิ่มรายการชั่วคราว';
                document.getElementById('btn-save').classList.replace('bg-orange-600', 'bg-blue-600');
                document.getElementById('btn-save').classList.replace('hover:bg-orange-700', 'hover:bg-blue-700');
                Swal.fire({ icon: 'success', title: 'แก้ไขสำเร็จ', timer: 1000, showConfirmButton: false });
            }

            updateCounters();
            resetForm();
            // เมื่อกด 1.9 ให้ตารางด้านล่างอัปเดต โดยยังคงอยู่หน้าเดิม
            renderTable();
        }

        function resetForm() {
            const currentDate = document.getElementById('input-date').value;
            const currentStaff = document.getElementById('input-staff').value;
            const currentShift = document.getElementById('input-shift').value;
            
            document.getElementById('recordForm').reset();
            
            document.getElementById('input-date').value = currentDate;
            document.getElementById('input-staff').value = currentStaff;
            document.getElementById('input-shift').value = currentShift;
            
            document.getElementById('edit-index').value = "-1";
            document.getElementById('btn-save').innerHTML = '<i class="fas fa-save mr-1"></i> 1.9 เพิ่มรายการชั่วคราว';
            document.getElementById('btn-save').classList.replace('bg-orange-600', 'bg-blue-600');
            document.getElementById('btn-save').classList.replace('hover:bg-orange-700', 'hover:bg-blue-700');
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            let total = 0;

            if (temporaryRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500 font-medium">ยังไม่มีข้อมูลในรายการชั่วคราว</td></tr>';
                document.getElementById('btn-submit-sheet').disabled = true;
            } else {
                document.getElementById('btn-submit-sheet').disabled = false;
                temporaryRecords.forEach((item, index) => {
                    total += item.amount;
                    const dateObj = new Date(item.date);
                    const formattedDate = dateObj.toLocaleDateString('th-TH');

                    let displayReceiptNo = item.receiptNo;
                    if(displayReceiptNo && !isNaN(displayReceiptNo) && displayReceiptNo !== '-') {
                        displayReceiptNo = String(displayReceiptNo).padStart(3, '0');
                    }

                    const row = document.createElement('tr');
                    row.className = "hover:bg-blue-50 transition-colors";
                    row.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${index + 1}</td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${formattedDate}</div>
                            <div class="text-xs text-gray-500">${item.shift}</div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="text-sm font-bold text-blue-600">HN: ${item.hn}</div>
                            <div class="text-xs text-gray-500"><i class="fas fa-user-md text-gray-400"></i> ${item.staff}</div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="text-sm text-gray-900">เล่ม: ${item.bookNo} | เลข: ${displayReceiptNo}</div>
                            <div class="text-xs text-gray-500">Trace: ${item.trace}</div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-right text-sm font-bold text-green-600">
                            ${item.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-center text-sm font-medium">
                            <button onclick="editItem(${index})" class="text-orange-500 hover:text-orange-700 mx-1 p-1 bg-orange-50 rounded" title="แก้ไข">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteItem(${index})" class="text-red-500 hover:text-red-700 mx-1 p-1 bg-red-50 rounded" title="ลบ">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
            document.getElementById('total-amount').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        function editItem(index) {
            const item = temporaryRecords[index];
            document.getElementById('input-date').value = item.date;
            document.getElementById('input-shift').value = item.shift;
            document.getElementById('input-staff').value = item.staff;
            document.getElementById('input-hn').value = item.hn;
            document.getElementById('input-bookNo').value = item.bookNo;
            document.getElementById('input-receiptNo').value = item.receiptNo;
            document.getElementById('input-trace').value = item.trace;
            document.getElementById('input-amount').value = item.amount;
            
            document.getElementById('edit-index').value = index;
            const btnSave = document.getElementById('btn-save');
            btnSave.innerHTML = `<i class="fas fa-check-circle mr-1"></i> ยืนยันการแก้ไขรายการที่ ${index + 1}`;
            btnSave.classList.replace('bg-blue-600', 'bg-orange-600');
            btnSave.classList.replace('hover:bg-blue-700', 'hover:bg-orange-700');
            switchTab('add');
        }

        function deleteItem(index) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'ใช่, ลบเลย!',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    temporaryRecords.splice(index, 1);
                    updateCounters();
                    renderTable();
                }
            });
        }

        function updateCounters() {
            const count = temporaryRecords.length;
            document.getElementById('item-count').innerText = count;
            document.getElementById('btn-count').innerText = count;
            if (count > 0) {
                document.getElementById('item-count').classList.replace('bg-blue-100', 'bg-red-500');
                document.getElementById('item-count').classList.replace('text-blue-800', 'text-white');
            } else {
                document.getElementById('item-count').classList.replace('bg-red-500', 'bg-blue-100');
                document.getElementById('item-count').classList.replace('text-white', 'text-blue-800');
            }
        }

        async function submitToGoogleSheet() {
            if (temporaryRecords.length === 0) return;

            Swal.fire({
                title: 'กำลังส่งข้อมูล...',
                html: 'โปรดรอสักครู่ ระบบกำลังบันทึกลง Google Sheet',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            try {
                await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(temporaryRecords)
                });

                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกข้อมูลสำเร็จ!',
                    text: `ส่งข้อมูลจำนวน ${temporaryRecords.length} รายการ ลง Sheet เรียบร้อยแล้ว`,
                    confirmButtonColor: '#3085d6',
                });

                temporaryRecords = [];
                updateCounters();
                renderTable();
                switchTab('add');

            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบอินเทอร์เน็ต', 'error');
            }
        }

        // --- ส่วนที่ 4: ฟังก์ชันการดึงรายงานและพิมพ์ ---
        async function fetchReportData() {
            const staff = document.getElementById('input-report-staff').value;
            const startDate = document.getElementById('input-report-date-start').value;
            const endDate = document.getElementById('input-report-date-end').value;
            const shift = document.getElementById('input-report-shift').value;

            if (!startDate || !endDate) return Swal.fire('แจ้งเตือน', 'กรุณาระบุช่วงวันที่ให้ครบถ้วน', 'warning');
            if(startDate > endDate) return Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้น ต้องน้อยกว่าหรือเท่ากับวันที่สิ้นสุด', 'warning');

            Swal.fire({ title: 'กำลังดึงข้อมูลรายงาน...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            try {
                const url = `${GOOGLE_WEB_APP_URL}?action=getReport&staff=${encodeURIComponent(staff)}&startDate=${startDate}&endDate=${endDate}`;
                const response = await fetch(url);
                const result = await response.json();

                if(result.status === 'success') {
                    let filteredData = result.data;
                    if (shift !== "ทั้งหมด") {
                        filteredData = filteredData.filter(item => item.shift === shift);
                    }
                    renderReportResults(filteredData);
                    Swal.close();
                } else {
                    Swal.fire('ผิดพลาด', 'ไม่สามารถดึงข้อมูลได้: ' + result.message, 'error');
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้', 'error');
            }
        }

        function renderReportResults(data) {
            const tbody = document.getElementById('report-table-body');
            const resultsDiv = document.getElementById('report-results');
            const btnPrint = document.getElementById('btn-print');
            
            tbody.innerHTML = '';
            let total = 0;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500 font-medium">ไม่พบข้อมูลในเงื่อนไขที่เลือก</td></tr>';
                btnPrint.disabled = true;
                btnPrint.classList.replace('bg-gray-800', 'bg-gray-400');
                btnPrint.classList.replace('hover:bg-gray-900', 'cursor-not-allowed');
            } else {
                data.sort((a, b) => {
                    let bookA = (a.bookNo || '').toString();
                    let bookB = (b.bookNo || '').toString();
                    if (bookA !== bookB) return bookA.localeCompare(bookB, 'th', {numeric: true});
                    let receiptA = (a.receiptNo || '').toString();
                    let receiptB = (b.receiptNo || '').toString();
                    return receiptA.localeCompare(receiptB, 'th', {numeric: true});
                });

                data.forEach((item, index) => {
                    const amount = parseFloat(item.amount) || 0;
                    total += amount;

                    let dateStr = item.date;
                    const dateObj = new Date(item.date);
                    if(!isNaN(dateObj)) dateStr = dateObj.toLocaleDateString('th-TH');

                    let displayReceiptNo = item.receiptNo;
                    if(displayReceiptNo && !isNaN(displayReceiptNo) && displayReceiptNo !== '-') {
                        displayReceiptNo = String(displayReceiptNo).padStart(3, '0');
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-600">${index + 1}</td>
                        <td class="px-4 py-2 whitespace-nowrap"><div class="text-sm text-gray-900">${dateStr}</div></td>
                        <td class="px-4 py-2 whitespace-nowrap"><div class="text-sm text-gray-800">${item.trace || '-'}</div></td>
                        <td class="px-4 py-2 whitespace-nowrap"><div class="text-sm font-bold text-gray-800">${item.hn || '-'}</div></td>
                        <td class="px-4 py-2 whitespace-nowrap"><div class="text-sm text-gray-800">${item.bookNo || '-'} / ${displayReceiptNo || '-'}</div></td>
                        <td class="px-4 py-2 whitespace-nowrap text-right text-sm font-bold text-green-700">${amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    `;
                    tbody.appendChild(row);
                });
                
                btnPrint.disabled = false;
                btnPrint.classList.replace('bg-gray-400', 'bg-gray-800');
                btnPrint.classList.replace('cursor-not-allowed', 'hover:bg-gray-900');
            }
            document.getElementById('report-total-amount').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2});
            resultsDiv.classList.remove('hidden');
        }

        function printReport() {
            const printHeader = document.createElement('div');
            printHeader.id = 'print-header-temp';
            printHeader.className = 'text-center mb-4';
            
            const staff = document.getElementById('input-report-staff').value;
            const startDateStr = new Date(document.getElementById('input-report-date-start').value).toLocaleDateString('th-TH');
            const endDateStr = new Date(document.getElementById('input-report-date-end').value).toLocaleDateString('th-TH');
            const shift = document.getElementById('input-report-shift').value;
            const position = staff !== "ทั้งหมด" ? (staffPositionsMap[staff] || '-') : '-';
            
            printHeader.innerHTML = `
                <p style="font-size: 12px; margin-bottom: 8px; color: #000; line-height: 1.6;">
                    <strong>เจ้าหน้าที่:</strong> ${staff} &nbsp;&nbsp;<strong>ตำแหน่ง:</strong> ${position} <br>
                    <strong>เวร:</strong> ${shift} &nbsp;&nbsp;<strong>ประจำวันที่:</strong> ${startDateStr} ถึง ${endDateStr}
                </p>
            `;
            
            const resultsDiv = document.getElementById('report-results');
            resultsDiv.parentNode.insertBefore(printHeader, resultsDiv);

            // สร้างส่วนท้ายรายงาน (ชื่อและตำแหน่งมุมขวาล่าง)
            const printFooter = document.createElement('div');
            printFooter.id = 'print-footer-temp';
            printFooter.style.textAlign = 'right';
            printFooter.style.marginTop = '20px';
            printFooter.style.paddingRight = '20px';
            
            // จัดรูปแบบให้มีวงเล็บครอบชื่อ (ถ้าเลือกทั้งหมดให้เว้นว่างไว้)
            let displayStaffName = staff !== "ทั้งหมด" ? `( ${staff} )` : "( ........................................................ )";
            
            printFooter.innerHTML = `
                <div style="display: inline-block; text-align: center;">
                    <p style="margin: 0; padding: 0; font-size: 12px; color: #000;">${displayStaffName}</p>
                    <p style="margin: 0; padding: 0; font-size: 12px; color: #000;">${position}</p>
                </div>
            `;
            
            // แทรกส่วนท้ายต่อจากตารางผลลัพธ์
            resultsDiv.parentNode.insertBefore(printFooter, resultsDiv.nextSibling);

            window.print();

            // ลบของชั่วคราวออกหลังพิมพ์เสร็จ
            printHeader.remove();
            printFooter.remove();
        }

        // --- ส่วนที่ 5: ฟังก์ชันการค้นหาเพื่อแก้ไข ---
        async function fetchEditData() {
            const staff = document.getElementById('input-edit-staff').value;
            const startDate = document.getElementById('input-edit-date-start').value;
            const endDate = document.getElementById('input-edit-date-end').value;
            const shift = document.getElementById('input-edit-shift').value;

            if (!startDate || !endDate) return Swal.fire('แจ้งเตือน', 'กรุณาระบุช่วงวันที่ให้ครบถ้วน', 'warning');
            if(startDate > endDate) return Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้น ต้องน้อยกว่าหรือเท่ากับวันที่สิ้นสุด', 'warning');

            Swal.fire({ title: 'กำลังดึงข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            try {
                // อาศัย Endpoint การดึงรายงานตัวเดิมในการค้นหา
                const url = `${GOOGLE_WEB_APP_URL}?action=getReport&staff=${encodeURIComponent(staff)}&startDate=${startDate}&endDate=${endDate}`;
                const response = await fetch(url);
                const result = await response.json();

                if(result.status === 'success') {
                    let filteredData = result.data;
                    if (shift !== "ทั้งหมด") {
                        filteredData = filteredData.filter(item => item.shift === shift);
                    }
                    editRecordsMap = filteredData; // เก็บข้อมูลไว้สำหรับการกดปุ่มแก้ไข
                    renderEditResults(filteredData);
                    Swal.close();
                } else {
                    Swal.fire('ผิดพลาด', 'ไม่สามารถดึงข้อมูลได้: ' + result.message, 'error');
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้', 'error');
            }
        }

        function renderEditResults(data) {
            const tbody = document.getElementById('edit-table-body');
            const resultsDiv = document.getElementById('edit-results');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500 font-medium">ไม่พบข้อมูลในเงื่อนไขที่ค้นหา</td></tr>';
            } else {
                data.forEach((item, index) => {
                    const amount = parseFloat(item.amount) || 0;
                    let dateStr = item.date;
                    const dateObj = new Date(item.date);
                    if(!isNaN(dateObj)) dateStr = dateObj.toLocaleDateString('th-TH');

                    let displayReceiptNo = item.receiptNo;
                    if(displayReceiptNo && !isNaN(displayReceiptNo) && displayReceiptNo !== '-') {
                        displayReceiptNo = String(displayReceiptNo).padStart(3, '0');

                    body: JSON.stringify(payload)
                });

            }
        }

                            // รวมข้อความในหน้าและลบช่องว่างเพื่อการค้นหาที่แม่นยำขึ้น
                            const rawText = textContent.items.map(item => item.str).join('');
                            const cleanText = rawText.replace(/[\s-]/g, '');
                            
                            // เงื่อนไขหลัก: เลข 13 หลักต้องตรงเป๊ะ
                            const taxMatch = cleanText.includes(targetTax);
                            
                            // เงื่อนไขรอง: ชื่อ หรือ นามสกุล อย่างใดอย่างหนึ่งต้องปรากฏในหน้านั้น (สะกดใกล้เคียง)
                            const nameMatch = cleanText.includes(targetF);
                            const lastNameMatch = cleanText.includes(targetL);

                            // กฎการจับคู่: Tax ตรง AND (ชื่อตรง OR นามสกุลตรง)
                            if (taxMatch && (nameMatch || lastNameMatch)) {
                                matches++;
                                await renderPage(page, printArea);
                            }
                        }
                    } catch (err) { console.error(err); }
                }

                if (matches > 0) {
                    status.innerHTML = `<span class="text-green-600 dark:text-green-400 font-bold text-xl">✅ ตรวจสอบพบเอกสารที่ตรงกัน ${matches} ฉบับ</span>`;
                    resultDiv.classList.remove('hidden');
                    setTimeout(() => resultDiv.scrollIntoView({ behavior: 'smooth' }), 300);
                } else {
                    status.innerHTML = `<div class="bg-rose-100 dark:bg-rose-900/40 p-5 rounded-xl text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800">
                        <p class="font-bold text-lg">✖ ไม่พบข้อมูลที่ตรงกันในฐานเอกสาร</p>
                        <ul class="text-sm list-disc list-inside mt-2 text-left inline-block">
                            <li>เลขประจำตัว 13 หลักไม่ถูกต้อง</li>
                            <li>ชื่อหรือนามสกุลสะกดไม่ตรงกับที่ระบุในเอกสาร</li>
                            <li>ไม่มีชื่อนี้ในรอบการหักภาษีปัจจุบัน</li>
                        </ul>
                    </div>`;
                }
            } finally {
                btn.disabled = false;
            }
        }

        async function renderPage(page, container) {
            const viewport = page.getViewport({ scale: 2.5 });
            const wrapper = document.createElement('div');
            wrapper.className = 'page-break page-preview';
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            canvas.style.width = "210mm"; 
            canvas.style.height = "auto";
            wrapper.appendChild(canvas);
            container.appendChild(wrapper);
            await page.render({ canvasContext: context, viewport }).promise;
        }
    </script>
</body>
</html>

                    <i class="fas fa-sync-alt mr-1"></i> อัปเดตตัวอย่าง PDF
                </button>
            </div>

        <!-- Right Panel: Preview -->
        <section class="w-full md:w-2/3 h-1/2 md:h-full bg-gray-200 p-4 flex flex-col">
            <div class="bg-white rounded-t-lg p-2 border-b flex justify-between items-center shadow-sm shrink-0">
                <h3 class="font-bold text-gray-700"><i class="fas fa-eye mr-1"></i> ตัวอย่าง PDF</h3>

                    <!-- ภาพหน้า PDF จะถูกวาดที่นี่แทน Iframe เพื่อแก้ปัญหา Chrome บล็อก -->
