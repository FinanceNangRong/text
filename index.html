                        <label class="block text-sm font-semibold text-slate-700 mb-2">3. ลักษณะความกว้างตารางรวม</label>
                        <select id="setting-tablewidth" class="w-full md:w-1/2 border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="w-full" selected>ขยายเต็มหน้ากระดาษ (100% Full Width)</option>
                            <option value="w-auto">พอดีกับเนื้อหา (Auto Fit)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">4. ปรับความสูงของแถวในตาราง (Row Height)</label>
                        <input type="text" id="setting-rowheight" class="w-full md:w-1/2 border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" value="auto" placeholder="เช่น auto, 40px, 1.5cm">
                    </div>

                    <div class="border-t border-slate-100 pt-5 mt-4">
                        <label class="block text-sm font-semibold text-slate-700 mb-4 text-blue-700">5. ปรับความกว้างคอลัมน์ตามต้องการ (ระบุหน่วย เช่น auto, 50px, 2cm, 10%)</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">คอลัมน์ ลำดับ</label>
                                <input type="text" id="setting-col-seq" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="auto" placeholder="เช่น 50px หรือ auto">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">คอลัมน์ เลขบัตรประชาชน</label>
                                <input type="text" id="setting-col-id" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="auto" placeholder="เช่น 120px หรือ auto">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">คอลัมน์ เลขที่บัญชี</label>
                                <input type="text" id="setting-col-acc" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="auto" placeholder="เช่น 120px หรือ auto">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">คอลัมน์ ชื่อ - สกุล</label>
                                <input type="text" id="setting-col-name" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="auto" placeholder="เช่น 180px หรือ auto">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">คอลัมน์ ตำแหน่ง</label>
                                <input type="text" id="setting-col-pos" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="auto" placeholder="เช่น 100px หรือ auto">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">คอลัมน์ กลุ่มงาน</label>
                                <input type="text" id="setting-col-dept" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="auto" placeholder="เช่น 100px หรือ auto">
                            </div>
                            <div class="lg:col-span-3">
                                <label class="block text-xs font-medium text-slate-600 mb-1">ช่องจำนวนเงิน/ภาษี (ปรับขนาดทุกช่องตัวเลขพร้อมกัน)</label>
                                <input type="text" id="setting-col-val" class="w-full md:w-1/3 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" value="2.2cm" placeholder="เช่น 2.2cm หรือ 80px">
                                <p class="text-[11px] text-slate-500 mt-1">* ค่าเริ่มต้นส่วนใหญ่คือ auto, หากต้องการให้ข้อความพับบรรทัดเมื่อเกิน ให้ระบุความกว้างที่แน่นอน (เช่น 150px, 2cm)</p>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-100 mt-8 flex flex-wrap gap-3 items-center">
                        <button type="button" onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-md flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            บันทึกการตั้งค่า
                        </button>
                        <button type="button" onclick="resetSettings()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-xl font-bold transition-colors">
                            คืนค่าเริ่มต้น
                        </button>
                        <p id="settings-msg" class="text-emerald-600 font-medium text-sm hidden">✅ บันทึกและนำไปใช้เรียบร้อย</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts ควบคุมระบบทั้งหมด -->
    <script>
        // ==========================================
        // ตั้งค่าทั่วไป & URL ฐานข้อมูล
        // ==========================================
        
        // URL ของเว็บแอป (Web App URL) สำหรับเพิ่ม/ลบ/แก้ไขข้อมูล
        const CRUD_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIQGHXna5_OPz8jYiHXPTp5Q2sTyj-aT5dNVJXwp71G83DfN-a8uL0B9lnZnuzMWya/exec"; 

        const SHEET_ENTRY_URL = "https://docs.google.com/spreadsheets/d/1YeyRqXXXeRiZelxQo3yAftMYOuR_XiKpj4hXhQUW_3M/edit?usp=sharing"; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkEkk4fPQz3OR3s66LC4lxuqaDnWQ33rxMhWfiIBdVBBjm7aKImQMR9_6sPlLqsIRE/exec"; 
        const REPORT_SHEET_URL = "https://docs.google.com/spreadsheets/d/13xOAOaXa1eZSwNzPDGyNF-YMTEkp6BO0-xsYCzUmwxw/edit?usp=sharing";

        const dateStr = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('date-display-entry').innerText = dateStr;
        document.getElementById('date-display-report').innerText = dateStr;

        // สลับแท็บหน้าจอ
        function switchTab(tabId) {
            ['crud', 'entry', 'report', 'settings'].forEach(id => {
                document.getElementById('section-' + id).classList.add('hidden');
                const nav = document.getElementById('nav-' + id);
                if(nav) nav.className = "px-4 py-2.5 sm:px-5 rounded-lg text-sm font-bold text-blue-50 hover:bg-blue-700 hover:text-white transition-all flex items-center gap-2";
            });
            
            document.getElementById('nav-' + tabId).className = "px-4 py-2.5 sm:px-5 rounded-lg text-sm font-bold bg-white text-blue-800 shadow-sm transition-all flex items-center gap-2";
            document.getElementById('section-' + tabId).classList.remove('hidden');
        }

        // โหลดการตั้งค่าและประยุกต์ใช้เมื่อเปิดหน้าเว็บ
        function applySettings() {
            const table = document.getElementById('report-table');
            const fs = document.getElementById('setting-fontsize').value || '14px';
            const tw = document.getElementById('setting-tablewidth').value || 'w-full';
            const mg = document.getElementById('setting-margin').value || '1cm';

            const wSeq = document.getElementById('setting-col-seq').value || 'auto';
            const wId = document.getElementById('setting-col-id').value || 'auto';
            const wAcc = document.getElementById('setting-col-acc').value || 'auto';
            const wName = document.getElementById('setting-col-name').value || 'auto';
            const wPos = document.getElementById('setting-col-pos').value || 'auto';
            const wDept = document.getElementById('setting-col-dept').value || 'auto';
            const wVal = document.getElementById('setting-col-val').value || '2.2cm';
            const rh = document.getElementById('setting-rowheight').value || 'auto';

            // ลบคลาสความกว้างอันเก่าออก
            table.classList.remove('w-full', 'w-auto');
            table.classList.add(tw);
            table.style.fontSize = fs; // เซ็ตขนาดฟอนต์โดยตรง

            function getColCss(cls, w) {
                if (w === 'auto' || w === '') return '';
                return `.${cls} { width: ${w} !important; min-width: ${w} !important; max-width: ${w} !important; white-space: normal !important; word-wrap: break-word; }`;
            }

            // ใส่ CSS เพื่อกำหนดระยะขอบเวลาสั่งพิมพ์ (Print) และ ความกว้างคอลัมน์
            let styleTag = document.getElementById('dynamic-print-style');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-print-style';
                document.head.appendChild(styleTag);
            }
            styleTag.innerHTML = `
                @media print {
                    @page { margin: ${mg} !important; }
                }
                .report-table th, .report-table td { height: ${rh} !important; }
                ${getColCss('col-seq', wSeq)}
                ${getColCss('col-id', wId)}
                ${getColCss('col-acc', wAcc)}
                ${getColCss('col-name', wName)}
                ${getColCss('col-pos', wPos)}
                ${getColCss('col-dept', wDept)}
                .val-col { width: ${wVal} !important; max-width: ${wVal} !important; padding-left: 0.25rem !important; padding-right: 0.25rem !important; white-space: normal !important; word-wrap: break-word; font-size: 0.85em !important; }
            `;
        }

        function saveSettings() {
            const settings = {
                fontSize: document.getElementById('setting-fontsize').value,
                tableWidth: document.getElementById('setting-tablewidth').value,
                margin: document.getElementById('setting-margin').value,
                colSeq: document.getElementById('setting-col-seq').value,
                colId: document.getElementById('setting-col-id').value,
                colAcc: document.getElementById('setting-col-acc').value,
                colName: document.getElementById('setting-col-name').value,
                colPos: document.getElementById('setting-col-pos').value,
                colDept: document.getElementById('setting-col-dept').value,
                colVal: document.getElementById('setting-col-val').value,
                rowHeight: document.getElementById('setting-rowheight').value
            };
            localStorage.setItem('financial_print_settings', JSON.stringify(settings));
            applySettings();
            
            const msg = document.getElementById('settings-msg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }

        function loadSettings() {
            const saved = localStorage.getItem('financial_print_settings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    if (settings.fontSize) {
                        let fs = settings.fontSize;
                        // หากมีค่าเก่าที่เป็น class ให้แปลงเป็น px
                        if (fs === 'text-sm') fs = '14px';
                        if (fs === 'text-xs') fs = '12px';
                        if (fs === 'text-base') fs = '16px';
                        document.getElementById('setting-fontsize').value = fs;
                    }
                    if (settings.tableWidth) document.getElementById('setting-tablewidth').value = settings.tableWidth;
                    if (settings.margin) document.getElementById('setting-margin').value = settings.margin;
                    
                    if (settings.colSeq !== undefined) document.getElementById('setting-col-seq').value = settings.colSeq;
                    if (settings.colId !== undefined) document.getElementById('setting-col-id').value = settings.colId;
                    if (settings.colAcc !== undefined) document.getElementById('setting-col-acc').value = settings.colAcc;
                    if (settings.colName !== undefined) document.getElementById('setting-col-name').value = settings.colName;
                    if (settings.colPos !== undefined) document.getElementById('setting-col-pos').value = settings.colPos;
                    if (settings.colDept !== undefined) document.getElementById('setting-col-dept').value = settings.colDept;
                    if (settings.colVal !== undefined) document.getElementById('setting-col-val').value = settings.colVal;
                    if (settings.rowHeight !== undefined) document.getElementById('setting-rowheight').value = settings.rowHeight;
                } catch(e) { console.error(e); }
            }
            applySettings();
        }
        
        function resetSettings() {
            document.getElementById('setting-fontsize').value = '14px';
            document.getElementById('setting-tablewidth').value = 'w-full';
            document.getElementById('setting-margin').value = '1cm';
            
            document.getElementById('setting-col-seq').value = 'auto';
            document.getElementById('setting-col-id').value = 'auto';
            document.getElementById('setting-col-acc').value = 'auto';
            document.getElementById('setting-col-name').value = 'auto';
            document.getElementById('setting-col-pos').value = 'auto';
            document.getElementById('setting-col-dept').value = 'auto';
            document.getElementById('setting-col-val').value = '2.2cm';
            document.getElementById('setting-rowheight').value = 'auto';
            saveSettings();
        }


        function getCsvUrl(url, gid = "0") {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) {
                return `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:csv&gid=${gid}`;
            }
            return url;
        }

        let staffData = [];

        async function fetchStaffData() {
            try {
                const sheetUrl = getCsvUrl(SHEET_ENTRY_URL, "0");
                Papa.parse(sheetUrl, {
                    download: true,
                    header: false,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            staffData = results.data.slice(1).filter(row => row.length >= 4 && row[3] && row[3].trim() !== '');
                        }
                    }
                });
            } catch (err) { console.error("โหลดข้อมูลล้มเหลว:", err); }
        }

        // ==========================================
        // 0. โลจิกสำหรับหน้า "1. เพิ่ม/ลบ/แก้ไข" (CRUD)
        // ==========================================
        
        const searchInputCrud = document.getElementById('search-input-crud');
        const searchResultsCrud = document.getElementById('search-results-crud');

        function executeSearchCrud() {
            const val = searchInputCrud.value.trim().toLowerCase();
            searchResultsCrud.innerHTML = '';
            
            if (val.length === 0) { searchResultsCrud.classList.add('hidden'); return; }

            if (staffData.length === 0) {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 text-sm text-rose-500 text-center font-medium';
                div.innerText = '⚠️ กำลังโหลดข้อมูล หรือไม่สามารถเข้าถึงได้';
                searchResultsCrud.appendChild(div);
                searchResultsCrud.classList.remove('hidden');
                return;
            }

            const matches = staffData.filter(person => {
                const idCard = person[1] ? String(person[1]).toLowerCase() : ""; // Col B
                const fullName = person[3] ? String(person[3]).toLowerCase() : ""; // Col D
                return fullName.includes(val) || idCard.includes(val);
            }).slice(0, 10);

            if (matches.length > 0) {
                matches.forEach(person => {
                    const div = document.createElement('div');
                    div.className = 'px-4 py-3 hover:bg-indigo-50 cursor-pointer border-b border-slate-100 last:border-0 transition-colors';
                    div.innerHTML = `<p class="font-bold text-slate-800">${person[3] || '-'}</p>
                                     <p class="text-xs text-slate-500">เลขบัตร: ${person[1] || '-'} | บัญชี: ${person[2] || '-'}</p>`;
                    div.onclick = () => fillCrudForm(person);
                    searchResultsCrud.appendChild(div);
                });
                searchResultsCrud.classList.remove('hidden');
            } else {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 text-sm text-slate-500 text-center';
                div.innerText = 'ไม่พบข้อมูลบุคลากร สามารถกรอกข้อมูลใหม่เพื่อเพิ่มได้';
                searchResultsCrud.appendChild(div);
                searchResultsCrud.classList.remove('hidden');
            }
        }

        searchInputCrud.addEventListener('input', function() {
            if (this.value.trim().length >= 2) executeSearchCrud();
            else searchResultsCrud.classList.add('hidden');
        });

        function fillCrudForm(person) {
            document.getElementById('crud_id_card').value = person[1] || '';      
            document.getElementById('crud_acc_number').value = person[2] || '';   
            document.getElementById('crud_full_name').value = person[3] || '';    
            document.getElementById('crud_position').value = person[4] || '';      
            document.getElementById('crud_department').value = person[5] || '';   
            document.getElementById('crud_tax_1').value = person[6] || '';   
            document.getElementById('crud_tax_2').value = person[7] || '';   
            document.getElementById('crud_tax_3').value = person[8] || '';   
            document.getElementById('crud_tax_4').value = person[9] || '';   
            
            searchInputCrud.value = person[3] || '';
            searchResultsCrud.classList.add('hidden');
        }

        function clearCrudForm() {
            document.getElementById('crud-form').reset();
            document.getElementById('search-input-crud').value = '';
        }

        async function submitCrud(actionType) {
            const idCard = document.getElementById('crud_id_card').value.trim();
            if(!idCard) { alert("กรุณากรอก เลขบัตรประชาชน!"); return; }

            let confirmMsg = "";
            let successMsg = "";
            if(actionType === 'add') { 
                confirmMsg = "ยืนยันการเพิ่มข้อมูลบุคลากร?"; 
                successMsg = "ส่งคำสั่งเพิ่มข้อมูลเรียบร้อย (ระบบกำลังบันทึกเบื้องหลัง)"; 
            }
            if(actionType === 'edit') { 
                confirmMsg = "ยืนยันการแก้ไขข้อมูลบุคลากรเลขบัตร " + idCard + "?"; 
                successMsg = "ส่งคำสั่งแก้ไขข้อมูลเรียบร้อย (ระบบกำลังบันทึกเบื้องหลัง)"; 
            }
            if(actionType === 'delete') { 
                confirmMsg = "⚠️ คุณแน่ใจหรือไม่ที่จะลบข้อมูลบุคลากรเลขบัตร " + idCard + "?"; 
                successMsg = "ส่งคำสั่งลบข้อมูลเรียบร้อย (ระบบกำลังบันทึกเบื้องหลัง)"; 
            }
            
            if(!confirm(confirmMsg)) return;

            const payload = {
                action: actionType,
                id_card: idCard,
                acc_number: document.getElementById('crud_acc_number').value.trim(),
                full_name: document.getElementById('crud_full_name').value.trim(),
                position: document.getElementById('crud_position').value.trim(),
                department: document.getElementById('crud_department').value.trim(),
                tax_1: document.getElementById('crud_tax_1').value || 0,
                tax_2: document.getElementById('crud_tax_2').value || 0,
                tax_3: document.getElementById('crud_tax_3').value || 0,
                tax_4: document.getElementById('crud_tax_4').value || 0
            };

            const loader = document.getElementById('crud-loader');
            const loaderText = document.getElementById('crud-loader-text');
            loader.classList.remove('hidden');
            loaderText.innerText = actionType === 'delete' ? 'กำลังส่งคำสั่งลบ...' : 'กำลังส่งข้อมูล...';

            try {
                // อัปเดตตาราง Local ในหน่วยความจำทันทีเพื่อให้ใช้งานต่อได้เลย
                if(actionType === 'add') {
                    staffData.push(['', payload.id_card, payload.acc_number, payload.full_name, payload.position, payload.department, payload.tax_1, payload.tax_2, payload.tax_3, payload.tax_4]);
                } else if(actionType === 'edit') {
                    const idx = staffData.findIndex(p => String(p[1]).trim() === payload.id_card);
                    if(idx !== -1) {
                        staffData[idx] = ['', payload.id_card, payload.acc_number, payload.full_name, payload.position, payload.department, payload.tax_1, payload.tax_2, payload.tax_3, payload.tax_4];
                    }
                } else if(actionType === 'delete') {
                    staffData = staffData.filter(p => String(p[1]).trim() !== payload.id_card);
                }

                // ส่งคำสั่งไปที่ Google Sheet (ถอด Header ที่บล็อกการเชื่อมต่อออกทั้งหมด)
                await fetch(CRUD_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                
                // แจ้งเตือนความสำเร็จและล้างฟอร์ม
                setTimeout(() => {
                    alert(successMsg);
                    if(actionType === 'delete' || actionType === 'add') clearCrudForm();
                    loader.classList.add('hidden');
                }, 800);

            } catch (error) {
                alert("การเชื่อมต่อมีปัญหา กรุณาลองอีกครั้ง: " + error.message);
                loader.classList.add('hidden');
            } finally {
                // รีเฟรชดึงข้อมูลจาก Sheet ซ้ำอีกครั้งในอีก 2 วินาที
                setTimeout(fetchStaffData, 2000); 
            }
        }


        // ==========================================
        // 1. โลจิกสำหรับหน้า "ลงข้อมูล จ่าย" (ยังคงเดิม)
        // ==========================================
        let currentTaxRates = { rate1: 0, rate2: 0, rate3: 0, rate4: 0 };

        const searchInputEntry = document.getElementById('search-input-entry');
        const searchResultsEntry = document.getElementById('search-results-entry');

        function executeSearchEntry() {
            const val = searchInputEntry.value.trim().toLowerCase();
            searchResultsEntry.innerHTML = '';
            
            if (val.length === 0) { searchResultsEntry.classList.add('hidden'); return; }

            if (staffData.length === 0) {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 text-sm text-rose-500 text-center font-medium';
                div.innerText = '⚠️ กำลังโหลดข้อมูล หรือไม่สามารถเข้าถึงได้';
                searchResultsEntry.appendChild(div);
                searchResultsEntry.classList.remove('hidden');
                return;
            }

            const matches = staffData.filter(person => {
                const idCard = person[1] ? String(person[1]).toLowerCase() : "";
                const fullName = person[3] ? String(person[3]).toLowerCase() : "";
                return fullName.includes(val) || idCard.includes(val);
            }).slice(0, 10);

            if (matches.length > 0) {
                matches.forEach(person => {

        function selectStaff(person) {
            document.getElementById('id_card').value = person[1] || '';      
            document.getElementById('acc_number').value = person[2] || '';   
            document.getElementById('full_name').value = person[3] || '';    
            document.getElementById('position').value = person[4] || '';      
            document.getElementById('department').value = person[5] || '';   
            
            currentTaxRates.rate1 = parseFloat(person[6]) || 0;
            currentTaxRates.rate2 = parseFloat(person[7]) || 0;
            currentTaxRates.rate3 = parseFloat(person[8]) || 0;
            currentTaxRates.rate4 = parseFloat(person[9]) || 0;

            searchInputEntry.value = person[3] || '';
            searchResultsEntry.classList.add('hidden');

            calculateTax(1); calculateTax(2); calculateTax(3); calculateTax(4);
        }

        function calculateTax(index) {
            const amountInput = document.querySelector(`input[name="amount_${index}"]`);
            const taxInput = document.querySelector(`input[name="tax_${index}"]`);
            if (!amountInput || !taxInput) return;

            const amount = parseFloat(amountInput.value) || 0;
            let rate = 0;
            if (index === 1) rate = currentTaxRates.rate1;
            if (index === 2) rate = currentTaxRates.rate2;
            if (index === 3) rate = currentTaxRates.rate3;
            if (index === 4) rate = currentTaxRates.rate4;

            if (amount > 0 && rate > 0) {
                taxInput.value = (amount * rate / 100).toFixed(2);
            } else if (amount === 0 || amountInput.value.trim() === '') {
                taxInput.value = ''; 
            }
        }

        function resetForm() {
            const persistentData = {};
            for (let i = 1; i <= 4; i++) {
                const claimMonth = document.querySelector(`select[name="claim_month_${i}"]`);
                const claimYear = document.querySelector(`input[name="claim_year_${i}"]`);
                const payMonth = document.querySelector(`select[name="pay_month_${i}"]`);
                const payYear = document.querySelector(`input[name="pay_year_${i}"]`);

                if(claimMonth) persistentData[`claim_month_${i}`] = claimMonth.value;
                if(claimYear) persistentData[`claim_year_${i}`] = claimYear.value;
                if(payMonth) persistentData[`pay_month_${i}`] = payMonth.value;
                if(payYear) persistentData[`pay_year_${i}`] = payYear.value;
            }

            document.getElementById('payment-form').reset();
            document.getElementById('search-input-entry').value = '';
            currentTaxRates = { rate1: 0, rate2: 0, rate3: 0, rate4: 0 };
            
            const currentYear = new Date().getFullYear() + 543;
            for (let i = 1; i <= 4; i++) {
                const claimMonth = document.querySelector(`select[name="claim_month_${i}"]`);
                const claimYear = document.querySelector(`input[name="claim_year_${i}"]`);
                const payMonth = document.querySelector(`select[name="pay_month_${i}"]`);
                const payYear = document.querySelector(`input[name="pay_year_${i}"]`);

                if (claimMonth && persistentData[`claim_month_${i}`]) claimMonth.value = persistentData[`claim_month_${i}`];
                if (claimYear) claimYear.value = persistentData[`claim_year_${i}`] || currentYear;
                if (payMonth && persistentData[`pay_month_${i}`]) payMonth.value = persistentData[`pay_month_${i}`];
                if (payYear) payYear.value = persistentData[`pay_year_${i}`] || currentYear;
            }
            
            ['full_name', 'id_card', 'acc_number', 'position', 'department'].forEach(f => {
                const el = document.getElementById(f);
                if (el) el.value = '';
            });
        }

            if (chkOt) theadHtml += `<th class="text-right bg-rose-100/50 text-rose-700 val-col" style="white-space: nowrap !important;">ภาษี OT</th>`;
            if (chkOtFood) theadHtml += `<th class="text-right bg-rose-100/50 text-rose-700 val-col" style="white-space: nowrap !important;">ภาษี OT ทำการ</th>`;
            if (chkSmc) theadHtml += `<th class="text-right bg-rose-100/50 text-rose-700 val-col" style="white-space: nowrap !important;">ภาษี SMC</th>`;

            theadHtml += `<th class="text-right bg-blue-100/70 font-bold text-blue-900 val-col" style="white-space: nowrap !important;">ยอดรับสุทธิ</th></tr>`;
            thead.innerHTML = theadHtml;
            
            tbody.innerHTML = '';
            let count = 0;
            let totalAmtOt = 0, totalAmtOtFood = 0, totalAmtSmc = 0, totalAmtP4p = 0;

            data.forEach(row => {

                const otfM = String(row[14] || ''); const otfY = String(row[15] || '');
                const smcM = String(row[19] || ''); const smcY = String(row[20] || '');

                        includeRow = true; showAmtOt = amtOt; showTaxOt = taxOt;

                }
                if (chkOtFood && (amtOtFood > 0 || taxOtFood > 0)) {
                    if ((!filterMonth || otfM === filterMonth) && (!filterYear || otfY === filterYear)) { 
                        includeRow = true; showAmtOtFood = amtOtFood; showTaxOtFood = taxOtFood;

                    if ((!filterMonth || smcM === filterMonth) && (!filterYear || smcY === filterYear)) { 
                        includeRow = true; showAmtSmc = amtSmc; showTaxSmc = taxSmc;
                    }

                        includeRow = true; showAmtP4p = amtP4p; showTaxP4p = taxP4p;
                    }

                    count++;
                    totalAmtOt += showAmtOt; totalAmtOtFood += showAmtOtFood; totalAmtSmc += showAmtSmc; totalAmtP4p += showAmtP4p;
                    totalTaxOt += showTaxOt; totalTaxOtFood += showTaxOtFood; totalTaxSmc += showTaxSmc; totalTaxP4p += showTaxP4p;

                    let rowNetTotal = 0;
                    if (chkOt) rowNetTotal += (showAmtOt - showTaxOt);
                    if (chkOtFood) rowNetTotal += (showAmtOtFood - showTaxOtFood);
                    if (chkSmc) rowNetTotal += (showAmtSmc - showTaxSmc);
                    if (chkP4p) rowNetTotal += (showAmtP4p - showTaxP4p);
                    
                    grandNetTotal += rowNetTotal;

                    const tr = document.createElement('tr');

                        <td class="col-name text-slate-800 font-medium">${fullName}</td>
                        <td class="col-pos text-slate-600">${position}</td>
                        <td class="col-dept text-slate-600">${dept}</td>
                    `;
                    
                    if (chkOt) trHtml += `<td class="text-right font-medium text-emerald-700 val-col">${showAmtOt > 0 ? showAmtOt.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;
                    if (chkOtFood) trHtml += `<td class="text-right font-medium text-emerald-700 val-col">${showAmtOtFood > 0 ? showAmtOtFood.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;
                    if (chkSmc) trHtml += `<td class="text-right font-medium text-emerald-700 val-col">${showAmtSmc > 0 ? showAmtSmc.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;
                    if (chkP4p) trHtml += `<td class="text-right font-medium text-emerald-700 val-col">${showAmtP4p > 0 ? showAmtP4p.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;
                    
                    if (chkOt) trHtml += `<td class="text-right font-medium text-rose-600 val-col">${showTaxOt > 0 ? showTaxOt.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;
                    if (chkOtFood) trHtml += `<td class="text-right font-medium text-rose-600 val-col">${showTaxOtFood > 0 ? showTaxOtFood.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;

                    if (chkP4p) trHtml += `<td class="text-right font-medium text-rose-600 val-col">${showTaxP4p > 0 ? showTaxP4p.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '-'}</td>`;

                    trHtml += `<td class="text-right font-bold text-blue-700 bg-blue-50/50 val-col">${rowNetTotal !== 0 ? rowNetTotal.toLocaleString('th-TH', {minimumFractionDigits: 2}) : '0.00'}</td>`;

                    tr.innerHTML = trHtml;
                    tbody.appendChild(tr);
                }
            });

            if (count === 0) {
                let colSpan = 6 + 1;
                if(chkOt) colSpan += 2; if(chkOtFood) colSpan += 2; if(chkSmc) colSpan += 2; if(chkP4p) colSpan += 2;
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="py-8 text-center text-slate-500">ไม่พบรายการที่ตรงกับเงื่อนไขการค้นหา</td></tr>`;

        // Export to Excel
        function exportTableToExcel(containerId, filename = ''){
            if(document.getElementById('new-report-tbody').innerText.includes('กรุณากด')) {
                alert('กรุณากด "ค้นหาข้อมูล" เพื่อให้ตารางแสดงผลก่อนทำการ Export'); return;
            }

            var downloadLink;
            var dataType = 'application/vnd.ms-excel;charset=utf-8';
            var tableSelect = document.getElementById(containerId);
            var clone = tableSelect.cloneNode(true);
            
            var ths = clone.getElementsByTagName('th');
            var tds = clone.getElementsByTagName('td');
            for(let i=0; i<ths.length; i++) ths[i].style.border = "1px solid #ddd";
            for(let i=0; i<tds.length; i++) tds[i].style.border = "1px solid #ddd";

            var tableHTML = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="UTF-8"></head>
                <body>${clone.innerHTML}</body>
                </html>
            `;
            
            filename = filename?filename+'.xls':'excel_data.xls';
            downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);
            
            if(navigator.msSaveOrOpenBlob){
                var blob = new Blob(['\ufeff', tableHTML], { type: dataType });
                navigator.msSaveOrOpenBlob( blob, filename);
            }else{
                downloadLink.href = 'data:' + dataType + ';base64,' + btoa(unescape(encodeURIComponent(tableHTML)));
                downloadLink.download = filename;
                downloadLink.click();
            }
            document.body.removeChild(downloadLink);
        }

        // Export to Word
        function exportHTMLToWord(containerId, filename = ''){

                alert('กรุณากด "ค้นหาข้อมูล" เพื่อให้ตารางแสดงผลก่อนทำการ Export'); return;
            }

            var preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title><style>table{border-collapse:collapse;width:100%;}th,td{border:1px solid black;padding:5px;text-align:left;}th{background-color:#f2f2f2;}</style></head><body>";
            var postHtml = "</body></html>";
            var html = preHtml + document.getElementById(containerId).innerHTML + postHtml;

            var blob = new Blob(['\ufeff', html], { type: 'application/msword' });

        function ThaiBaht(Number) {
            Number = Number.toString().replace(/[, ]/g, "");
            if (isNaN(Number)) return "ไม่สามารถอ่านตัวเลขได้";
            let BahtText = "";
            let data = Number.split(".");
            if (data.length == 2) { if (data[1].length == 1) data[1] += "0"; } else { data.push("00"); }
            if (data[0] == 0 && data[1] == 0) return "ศูนย์บาทถ้วน";
            const txtNum = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
            const txtUnit = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];
            function processIntText(strInt) {
                let text = ""; let len = strInt.length;
                for (let i = 0; i < len; i++) {
                    let n = parseInt(strInt.charAt(i));
                    if (n !== 0) {
                        if (i == len - 1 && n == 1 && len > 1) text += "เอ็ด";
                        else if (i == len - 2 && n == 2) text += "ยี่";
                        else if (i == len - 2 && n == 1) text += "";
                        else text += txtNum[n];
                        text += txtUnit[len - i - 1];
                    }
                }
                return text;
            }
            let bahtInt = data[0];
            if(bahtInt.length > 6) {
                let mils = bahtInt.substring(0, bahtInt.length - 6);
                let rests = bahtInt.substring(bahtInt.length - 6);
                BahtText += processIntText(mils) + "ล้าน" + processIntText(rests);

            if (data[1] == "00") BahtText += "ถ้วน";
            else {
