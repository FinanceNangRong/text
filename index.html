<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับออเดอร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
        @media print {
            @page {
                size: 15cm auto; /* กำหนดความกว้าง 15cm และความยาวแบบอัตโนมัติ (ตามเนื้อหา) */
                margin: 0.5cm; /* กำหนดขอบกระดาษเล็กน้อย */
            }
            body {
                background-color: white;
                width: 15cm;
                margin: 0 auto;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .shadow-lg {
                box-shadow: none !important;
            }
            .max-w-2xl {
                max-width: 15cm !important; /* บังคับให้ขนาดคอนเทนเนอร์ไม่เกิน 15cm */
            }
            #app-container {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
            /* ซ่อนปุ่มควบคุมจำนวนตอนปริ้น */
            .qty-controls {
                display: none !important;
            }
            /* ปรับแต่งเส้นขอบของรายการให้เป็นแบบบิล (เส้นประ) และลบพื้นหลังตอนปริ้น */
            .menu-row {
                border-left: none !important;
                border-right: none !important;
                border-top: none !important;
                border-bottom: 1px dashed #d1d5db !important;
                border-radius: 0 !important;
                background-color: white !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
            }

            /* สไตล์สำหรับรูปภาพ QR Code ตอนปริ้น */
            .qr-container-print {
                margin-top: 20px !important;
                text-align: center !important;
            }

            #qr-image-print {
                width: 5cm !important;
                height: 10cm !important;
                max-width: none !important; /* ยกเลิก max-width ของ tailwind */
                margin: 0 auto !important; /* จัดกึ่งกลาง */
                display: block !important;
                box-shadow: none !important; /* ลบเงา */
                border-radius: 0 !important; /* ลบมุมโค้ง */
                object-fit: fill; /* บังคับให้ภาพเต็มขนาด 5x10cm (ภาพอาจจะยืดเล็กน้อย) */
            }
        }

        /* CSS พิเศษสำหรับจำลองหน้าจอตอนบันทึกเป็นรูปภาพ (ส่งออกรูป) */
        .export-mode {
            width: 15cm !important;
            margin: 0 auto !important;
            padding: 20px !important;
            background-color: white !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }
        .export-mode .no-print { display: none !important; }
        .export-mode .print-only { display: block !important; }
        .export-mode .qty-controls { display: none !important; }
        .export-mode .menu-row {
            border-left: none !important;
            border-right: none !important;
            border-top: none !important;
            border-bottom: 1px dashed #d1d5db !important;
            border-radius: 0 !important;
            background-color: white !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        .export-mode .qr-container-print {
            margin-top: 20px !important;
            text-align: center !important;
        }
        .export-mode #qr-image-print {
            width: 5cm !important;
            height: 10cm !important;
            max-width: none !important;
            margin: 0 auto !important;
            display: block !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            object-fit: fill;
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <div id="app-container" class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <div class="text-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-pink-600 mb-2">รับออเดอร์</h1>
            <p class="text-gray-500 text-sm print-only hidden" id="print-date"></p>
        </div>

        <form id="orderForm">
            <div class="mb-6">
                <label for="customerName" class="block text-sm font-semibold mb-2 text-gray-700">1. ลงชื่อผู้ฝาก/ชื่อลูกค้า <span class="text-red-500">*</span></label>
                <input type="text" id="customerName" required placeholder="กรอกชื่อผู้ฝาก" 
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent no-print">
                <p id="printCustomerName" class="hidden print-only font-medium text-lg"></p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-4 text-gray-700">2. เลือกรายการสินค้า และจำนวน</label>
                
                <div class="space-y-3" id="menu-container">
                    <!-- รายการสินค้าจะถูกสร้างด้วย JavaScript -->
                </div>
            </div>

            <div class="border-t pt-4 mb-8">
                <div class="flex justify-between items-center text-xl font-bold">
                    <span>ยอดรวมทั้งสิ้น:</span>
                    <span class="text-pink-600"><span id="totalPrice">0</span> บาท</span>
                </div>
            </div>

            <!-- ข้อความเพิ่มใต้ตาราง (แสดงเฉพาะตอนปริ้น/เซฟรูป) -->
            <div class="hidden print-only text-center font-bold text-lg mb-8">
                แชร์ ออเดอร์ ส่ง และ สลิปโอน
            </div>

            <div class="flex flex-col sm:flex-row gap-4 no-print">
                <button type="submit" id="submitBtn" 
                    class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    บันทึกข้อมูล (Google Sheet)
                </button>
                <button type="button" onclick="printBill()" 
                    class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    พิมพ์บิล
                </button>
                <button type="button" onclick="exportImage()" 
                    class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    บันทึกเป็นรูปภาพ
                </button>
            </div>
            <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden"></div>

            <!-- ย้ายรูปภาพออกจาก form มาไว้ด้านล่างสุด และเปลี่ยนวิธีการกำหนด style -->
        </form>

        <div class="mt-8 text-center qr-container-print">
            <!-- ใช้ class ของ tailwind สำหรับการแสดงผลบนเว็บ และใช้ id สำหรับตั้งค่าตอนปริ้น -->
            <img id="qr-image-print" src="https://github.com/FinanceNangRong/text/blob/main/QR.png?raw=true" alt="QR Code" class="mx-auto rounded-lg shadow-sm max-w-xs md:max-w-sm h-auto w-auto">
        </div>
    </div>

    <script>
        // ข้อมูลรายการสินค้า
        const menuItems = [
            { id: 1, name: "เค้กเนยสด เค้กบ้านสวน", price: 50 },
            { id: 2, name: "เค้กกาแฟ เค้กบ้านสวน", price: 50 },
            { id: 3, name: "คัพเค้กธัญพืช เค้กบ้านสวน", price: 50 },
            { id: 4, name: "เค้กใบเตย เค้กบ้านสวน", price: 50 },
            { id: 5, name: "เค้กส้ม เค้กบ้านสวน", price: 60 },
            { id: 6, name: "เค้กสตอเบอรี่ เค้กบ้านสวน", price: 60 },
            { id: 7, name: "เค้กกาแฟอัลมอนด์ เค้กบ้านสวน", price: 60 },
            { id: 8, name: "เค้กฝอยทอง เค้กบ้านสวน", price: 65 },
            { id: 9, name: "เค้กช็อคโกแลต เค้กบ้านสวน", price: 65 },
            { id: 10, name: "เค้กชีส เค้กบ้านสวน", price: 65 },
            { id: 11, name: "เค้กครีมฝอยทอง เค้กบ้านสวน", price: 65 },
            { id: 12, name: "โรตี สายใหม เล็ก ราคาอาจปรับเปลียน", price: 50 },
            { id: 13, name: "โรตี สายใหม กลาง ราคาอาจปรับเปลียน", price: 100 },
            { id: 14, name: "โรตี สายใหม ใหญ่ ราคาอาจปรับเปลียน", price: 150 },
        ];

        // URL ของ Google Web App ที่ได้จากการ Deploy (คุณต้องเปลี่ยนค่านี้)
        // ** สำคัญ: แทนที่ URL ด้านล่างด้วย URL ที่คุณได้หลังจาก Deploy Script ในขั้นตอนที่ 2 **
        const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxaAX3nr2qyHGTq0aTl7qfmg1WKYvm_ix4J_zr1ie000z-lD7Wu6SgWrUigCOOgSka8KQ/exec'; 

        // ฟังก์ชันสร้างรายการสินค้าในหน้าเว็บ
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center justify-between p-3 border rounded-lg bg-gray-50 hover:bg-white transition duration-150 menu-row';
                
                // สำหรับซ่อนเวลาปริ้นบิลถ้ายอดเป็น 0
                itemDiv.id = `row-${item.id}`;

                itemDiv.innerHTML = `
                    <div class="flex-1">
                        <span class="font-medium text-gray-800">${item.name}</span>
                        <div class="text-sm text-gray-500">${item.price} บาท/ชิ้น</div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="qty-controls flex items-center space-x-2">
                            <button type="button" onclick="updateQty(${item.id}, -1)" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center hover:bg-gray-300 focus:outline-none text-gray-600 font-bold">-</button>
                            <input type="number" id="qty-${item.id}" value="0" min="0" class="w-12 text-center font-semibold border-none bg-transparent focus:outline-none" readonly>
                            <button type="button" onclick="updateQty(${item.id}, 1)" class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center hover:bg-pink-200 focus:outline-none text-pink-600 font-bold">+</button>
                        </div>
                        <div class="w-16 text-right font-semibold hidden print-only" id="print-qty-${item.id}">0</div>
                        <div class="w-20 text-right font-semibold text-gray-700"><span id="sum-${item.id}">0</span> ฿</div>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        // ฟังก์ชันอัปเดตจำนวนและราคา
        function updateQty(id, change) {
            const qtyInput = document.getElementById(`qty-${id}`);
            let newQty = parseInt(qtyInput.value) + change;
            
            if (newQty < 0) newQty = 0;
            
            qtyInput.value = newQty;
            
            // อัปเดตข้อมูลสำหรับปริ้น
            document.getElementById(`print-qty-${id}`).innerText = `${newQty} ชิ้น`;
            
            // อัปเดตยอดรวมบรรทัด
            const item = menuItems.find(i => i.id === id);
            const sum = item.price * newQty;
            document.getElementById(`sum-${id}`).innerText = sum;

            // ซ่อน/แสดงบรรทัดเวลาปริ้น
            const row = document.getElementById(`row-${id}`);
            if (newQty > 0) {
                row.classList.remove('print:hidden');
            } else {
                row.classList.add('print:hidden');
            }

            calculateTotal();
        }

        // ฟังก์ชันคำนวณยอดรวมทั้งหมด
        function calculateTotal() {
            let total = 0;
            menuItems.forEach(item => {
                const qty = parseInt(document.getElementById(`qty-${item.id}`).value) || 0;
                total += qty * item.price;
            });
            
            // ใส่คอมม่าในตัวเลข
            document.getElementById('totalPrice').innerText = total.toLocaleString();
        }

        // ฟังก์ชันเตรียมข้อมูลสำหรับปริ้น
        function printBill() {
            const customerName = document.getElementById('customerName').value;
            
            // ตรวจสอบข้อมูลเบื้องต้น
            if (!customerName) {
                alert("กรุณาลงชื่อผู้ฝากก่อนพิมพ์บิล");
                document.getElementById('customerName').focus();
                return;
            }

            let hasItems = false;
            menuItems.forEach(item => {
                if (parseInt(document.getElementById(`qty-${item.id}`).value) > 0) {
                    hasItems = true;
                }
            });

            if (!hasItems) {
                alert("กรุณาเลือกสินค้าอย่างน้อย 1 รายการ");
                return;
            }

            // ตั้งค่าข้อมูลสำหรับหน้าปริ้น
            document.getElementById('printCustomerName').innerText = `ชื่อผู้ฝาก: ${customerName}`;
            
            const now = new Date();
            document.getElementById('print-date').innerText = `วันที่: ${now.toLocaleDateString('th-TH')} เวลา: ${now.toLocaleTimeString('th-TH')}`;
            
            // ซ่อนรายการที่จำนวนเป็น 0 ไว้แล้วตอน updateQty (print:hidden)
            
            window.print();
        }

        // ฟังก์ชันบันทึกเป็นรูปภาพ (Export to Image)
        function exportImage() {
            const customerName = document.getElementById('customerName').value;
            
            // ตรวจสอบข้อมูลเบื้องต้น
            if (!customerName) {
                alert("กรุณาลงชื่อผู้ฝากก่อนบันทึกรูปภาพ");
                document.getElementById('customerName').focus();
                return;
            }

            let hasItems = false;
            menuItems.forEach(item => {
                if (parseInt(document.getElementById(`qty-${item.id}`).value) > 0) {
                    hasItems = true;
                }
            });

            if (!hasItems) {
                alert("กรุณาเลือกสินค้าอย่างน้อย 1 รายการ");
                return;
            }

            // ตั้งค่าข้อมูลสำหรับพรีวิว
            document.getElementById('printCustomerName').innerText = `ชื่อผู้ฝาก: ${customerName}`;
            const now = new Date();
            document.getElementById('print-date').innerText = `วันที่: ${now.toLocaleDateString('th-TH')} เวลา: ${now.toLocaleTimeString('th-TH')}`;
            
            // เรียกใช้คอนเทนเนอร์และเพิ่มคลาสเพื่อจำลองหน้าจอพิมพ์บิล
            const container = document.getElementById('app-container');
            container.classList.add('export-mode');

            // หน่วงเวลาเล็กน้อยเพื่อให้ CSS อัปเดตเต็มที่ก่อนถ่ายภาพ
            setTimeout(() => {
                html2canvas(container, {
                    scale: 2, // เพิ่มความคมชัด (Retina)
                    useCORS: true, // อนุญาตให้โหลดรูป QR Code ข้ามโดเมนได้
                    backgroundColor: '#ffffff'
                }).then(canvas => {
                    // เอาคลาสจำลองการปริ้นออกเพื่อให้กลับสู่หน้าจอปกติ
                    container.classList.remove('export-mode');
                    
                    // แปลงแคนวาสเป็นไฟล์รูปและสั่งดาวน์โหลด
                    const link = document.createElement('a');
                    link.download = `ออเดอร์_${customerName.trim()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error("เกิดข้อผิดพลาดในการบันทึกรูป:", err);
                    container.classList.remove('export-mode');
                    alert("เกิดข้อผิดพลาดในการสร้างรูปภาพ กรุณาลองใหม่อีกครั้ง");
                });
            }, 150);
        }

        // ฟังก์ชันส่งข้อมูลไปยัง Google Sheets
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const customerName = document.getElementById('customerName').value;
            if (!customerName) return;

            let totalOrderQty = 0;
            const orderDetails = [];
            
            // รวบรวมข้อมูลออเดอร์
            const orderData = {
                customerName: customerName,
                totalAmount: parseInt(document.getElementById('totalPrice').innerText.replace(/,/g, '')),
                items: {}
            };

            menuItems.forEach(item => {
                const qty = parseInt(document.getElementById(`qty-${item.id}`).value) || 0;
                orderData.items[item.name] = qty; // เก็บข้อมูลตามชื่อเค้ก
                
                if (qty > 0) {
                    totalOrderQty += qty;
                    orderDetails.push(`${item.name} (${qty})`);
                }
            });

            if (totalOrderQty === 0) {
                alert("กรุณาเลือกสินค้าอย่างน้อย 1 รายการ");
                return;
            }
            
            // สรุปรายการแบบข้อความ
            orderData.summary = orderDetails.join(', ');

            // แสดงสถานะกำลังบันทึก
            const btn = document.getElementById('submitBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = 'กำลังบันทึก...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusMsg.classList.add('text-gray-600');
            statusMsg.innerText = 'กำลังส่งข้อมูลไปยัง Google Sheet...';

            // ถ้ายังไม่ได้ใส่ URL
            if (GOOGLE_APP_SCRIPT_URL === 'YOUR_WEB_APP_URL_HERE') {
                setTimeout(() => {
                    statusMsg.classList.remove('text-gray-600');
                    statusMsg.classList.add('text-red-600');
                    statusMsg.innerHTML = '<strong>เกิดข้อผิดพลาด:</strong> คุณยังไม่ได้ตั้งค่า Google Apps Script URL ในโค้ด';
                    btn.innerHTML = originalBtnHtml;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                }, 1000);
                return;
            }

            // ส่งข้อมูล
            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // สำคัญสำหรับ Google Apps Script
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(orderData)
            })
            .then(() => {
                // อัพเดท UI เมื่อสำเร็จ (no-cors จะไม่คืนค่า response status แบบปกติ)
                statusMsg.classList.remove('text-gray-600');
                statusMsg.classList.add('text-green-600');
                statusMsg.innerText = 'บันทึกออเดอร์สำเร็จ!';
                
                // รีเซ็ตฟอร์ม
                document.getElementById('orderForm').reset();
                document.getElementById('customerName').value = '';
                menuItems.forEach(item => {
                    document.getElementById(`qty-${item.id}`).value = 0;
                    document.getElementById(`sum-${item.id}`).innerText = 0;
                    document.getElementById(`row-${item.id}`).classList.add('print:hidden');
                });
                calculateTotal();

                // คืนค่าปุ่ม
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');

                // ซ่อนข้อความสถานะหลังจาก 3 วินาที
                setTimeout(() => {
                    statusMsg.classList.add('hidden');
                }, 3000);
            })
            .catch(error => {
                statusMsg.classList.remove('text-gray-600');
                statusMsg.classList.add('text-red-600');
                statusMsg.innerText = 'เกิดข้อผิดพลาดในการบันทึกข้อมูล';
                console.error('Error:', error);
                
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
        });

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเสร็จ
        window.onload = () => {
            renderMenu();
            
            // ซ่อนทุกแถวในการปริ้นตอนเริ่มต้น (เพราะจำนวนเป็น 0)
            setTimeout(() => {
                menuItems.forEach(item => {
                    document.getElementById(`row-${item.id}`).classList.add('print:hidden');
                });
            }, 100);
        };
    </script>
</body>
</html>
