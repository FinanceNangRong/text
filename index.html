<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8. รายงานเจ้าหนี้ย้อนหลัง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html{font-size:90%;}body{font-family:'Noto Sans Thai',sans-serif;background-color:#f3f4f6;}
        .print-only{display:none;}
        @media print{
            @page{size:A4 landscape;margin:10mm;}
            body,html{background-color:white;height:auto!important;overflow:visible!important;display:block!important;}
            .h-screen,.overflow-hidden,.overflow-auto,.overflow-x-auto,.flex-1,main,#printArea,#contentContainer{height:auto!important;overflow:visible!important;display:block!important;position:static!important;margin:0!important;padding:0!important;page-break-inside:auto!important;break-inside:auto!important;}
            .shadow-sm{box-shadow:none!important;}.rounded-lg{border-radius:0!important;}
            .no-print{display:none!important;}.print-only{display:block!important;}.print-full-width{width:100%!important;margin:0!important;padding:0!important;box-shadow:none!important;}
            table{width:100%;border-collapse:collapse;page-break-inside:auto;}tr{page-break-inside:avoid;page-break-after:auto;}thead{display:table-header-group;}tfoot{display:table-footer-group;}
            th,td{border:1px solid #000!important;padding:0.6mm 2px!important;height:0.5mm!important;line-height:1!important;font-size:6.5pt!important;}
            th{background-color:#f3f4f6!important;-webkit-print-color-adjust:exact;font-weight:bold!important;}
            td{font-weight:normal!important;}td.font-medium,td.font-semibold,td.font-bold{font-weight:normal!important;}
            tfoot td{background-color:#f3f4f6!important;-webkit-print-color-adjust:exact;font-weight:bold!important;}
            .print-fixed-table{table-layout:fixed!important;width:100%!important;max-width:100%!important;margin:0 auto!important;}
            .print-fixed-table th,.print-fixed-table td{white-space:normal!important;word-wrap:break-word!important;overflow-wrap:break-word!important;}
            .print-truncate{white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;word-wrap:normal!important;overflow-wrap:normal!important;}
            .report1-table-print{width:251mm!important;table-layout:fixed;margin:0 auto;}
        }
        ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:#f1f1f1;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}::-webkit-scrollbar-thumb:hover{background:#94a3b8;}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <header class="bg-blue-800 text-white p-4 shadow-md no-print shrink-0 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="https://financenangrong.github.io/financial-system/" class="text-white hover:bg-blue-700 focus:outline-none p-2 rounded transition-colors flex items-center gap-1" title="ย้อนกลับ">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="hidden sm:inline font-medium text-sm">ย้อนกลับ</span>
            </a>
            <h1 class="text-2xl font-bold">8. รายงานเจ้าหนี้ย้อนหลัง</h1>
        </div>
        <div id="statusBadge" class="text-sm px-3 py-1 rounded-full bg-yellow-100 text-yellow-800 font-medium flex items-center gap-2">พร้อมใช้งาน</div>
    </header>
    <main class="flex-1 bg-white overflow-auto p-6 print-full-width" id="printArea">
        <div id="contentContainer" class="max-w-7xl mx-auto"></div>
    </main>

    <script>
        const HISTORY_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSMQ_KJlIyAnZJJYKMjKqKWaM226gI8W00KBx7fUBvUFh6JC5RXNL2Ix28rLR7dZA/pub?output=csv";
        let appData6 = [], historyList6 = [], selectedHistoryUrl6 = "", isLoadingHistory6 = false, isLoadingData6 = false;

        function extractUrlFromEmbed(str) { let url = String(str).trim(); if (url.toLowerCase().includes('<iframe') && url.includes('src=')) { const match = url.match(/src=["'](.*?)["']/); if (match && match[1]) url = match[1]; } return url.replace(/&amp;/g, '&'); }
        function parseNumberValue(v){if(!v)return 0;if(typeof v==='string')v=v.replace(/,/g,'');const n=parseFloat(v);return isNaN(n)?0:n;}
        function formatNumber(n){const v=parseFloat(n);return (isNaN(v)||v===0)?'0.00':v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
        function getThaiMonthYear(mm_yyyy) { if (!mm_yyyy || typeof mm_yyyy !== 'string') return mm_yyyy; const parts = mm_yyyy.split('/'); if (parts.length === 2) { const m = parseInt(parts[0], 10) - 1; const y = parts[1]; const t = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"]; if (m >= 0 && m < 12) return `${t[m]} ${y}`; } return mm_yyyy; }

        function renderReport6(container) {
            if (historyList6.length === 0 && !isLoadingHistory6) {
                isLoadingHistory6 = true;
                container.innerHTML = '<div class="text-center text-gray-500 py-8">กำลังดึงข้อมูลรายชื่อย้อนหลัง...</div>';
                Papa.parse(HISTORY_SHEET_CSV_URL, {
                    download: true, header: false,
                    complete: function(results) {
                        isLoadingHistory6 = false;
                        const validData = results.data.slice(1).filter(row => row.length >= 2 && row[0] && String(row[0]).trim() !== '');
                        historyList6 = validData.map(row => ({ name: String(row[0]).trim(), url: extractUrlFromEmbed(row[1]) })).filter(item => item.url.startsWith('http'));
                        renderReport6(container);
                    },
                    error: function() { isLoadingHistory6 = false; container.innerHTML = '<div class="text-center text-red-500 py-8">ไม่สามารถโหลดรายการได้</div>'; }
                });
                return;
            }

            let headerHTML = `
                <div class="flex flex-col mb-6 gap-4 no-print">
                    <h3 class="text-2xl font-bold text-gray-800">8. รายงานเจ้าหนี้ย้อนหลัง</h3>
                    <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm w-full flex flex-col sm:flex-row items-start sm:items-center gap-3">
                        <label class="text-gray-700 font-medium whitespace-nowrap">เลือกเดือน:</label>
                        <select onchange="handleHistorySelect6(this.value)" class="border border-gray-300 rounded-lg px-4 py-2 outline-none w-full sm:w-80 cursor-pointer">
                            <option value="">-- กรุณาเลือกข้อมูลย้อนหลัง --</option>
                            ${historyList6.map(h => `<option value="${h.url}" ${selectedHistoryUrl6 === h.url ? 'selected' : ''}>${h.name}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;

            let contentHTML = '';
            if (isLoadingData6) {
                contentHTML = '<div class="text-center text-blue-500 py-8">กำลังโหลดข้อมูลรายงาน...</div>';
            } else if (appData6.length > 0) {
                const selectedItem = historyList6.find(h => h.url === selectedHistoryUrl6);
                const printTitle = `รายงานเจ้าหนี้ เดือน ${getThaiMonthYear(selectedItem ? selectedItem.name : "")}`;

                const groupedData = {};
                appData6.forEach(row => {
                    let valM = String(row[12] || '').trim();
                    if (valM === '') {
                        if(parseNumberValue(row[4])===0 && parseNumberValue(row[5])===0 && parseNumberValue(row[6])===0 && parseNumberValue(row[7])===0) return;
                        valM = 'ไม่ระบุหมวดหมู่';
                    }
                    if (!groupedData[valM]) groupedData[valM] = { E: 0, F: 0, G: 0, H: 0 };
                    groupedData[valM].E += parseNumberValue(row[4]);
                    groupedData[valM].F += parseNumberValue(row[5]);
                    groupedData[valM].G += parseNumberValue(row[6]);
                    groupedData[valM].H += parseNumberValue(row[7]);
                });

                contentHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 gap-4 no-print border-t border-gray-200 pt-6">
                        <h4 class="text-xl font-bold text-gray-700">8.1 แบบรายงานเจ้าหน้า เดือนเก่า</h4>
                        <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded shadow flex items-center gap-2"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg> พิมพ์รายงาน</button>
                    </div>
                    <div class="print-only font-bold text-center" style="font-size: 16pt !important; margin-bottom: 10px;">${printTitle}</div>
                    <div class="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm flex justify-center">
                        <table class="w-full text-sm text-left report1-table-print" style="table-layout: fixed;">
                            <thead class="bg-blue-50 text-blue-900 border-b border-gray-200">
                                <tr>
                                    <th class="px-4 py-3 font-semibold text-center" style="width: 15mm;">ลำดับ</th>
                                    <th class="px-4 py-3 font-semibold" style="width: 96mm;">ค่า</th>
                                    <th class="px-4 py-3 font-semibold text-right" style="width: 35mm;">จำนวนเงิน</th>
                                    <th class="px-4 py-3 font-semibold text-right" style="width: 35mm;">จ่าย</th>
                                    <th class="px-4 py-3 font-semibold text-right" style="width: 35mm;">ปรับปรุง</th>
                                    <th class="px-4 py-3 font-semibold text-right" style="width: 35mm;">คงเหลือ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                `;

                let index = 1, sumE = 0, sumF = 0, sumG = 0, sumH = 0;
                const keys = Object.keys(groupedData).sort(); 
                if (keys.length === 0) contentHTML += `<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">ไม่พบข้อมูลในตาราง</td></tr>`;
                else {
                    keys.forEach(key => {
                        const d = groupedData[key]; sumE += d.E; sumF += d.F; sumG += d.G; sumH += d.H;
                        contentHTML += `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-4 py-2 text-center text-gray-500">${index++}</td>
                                <td class="px-4 py-2 text-gray-800 font-medium truncate print-truncate" style="max-width: 96mm;" title="${key}">${key}</td>
                                <td class="px-4 py-2 text-right text-gray-800">${formatNumber(d.E)}</td>
                                <td class="px-4 py-2 text-right text-gray-800">${formatNumber(d.F)}</td>
                                <td class="px-4 py-2 text-right text-gray-800">${formatNumber(d.G)}</td>
                                <td class="px-4 py-2 text-right text-blue-700 font-semibold">${formatNumber(d.H)}</td>
                            </tr>`;
                    });
                    contentHTML += `</tbody><tfoot class="bg-gray-100 border-t-2 border-gray-300 font-bold">
                        <tr><td colspan="2" class="px-4 py-3 text-center">รวมทั้งสิ้น</td><td class="px-4 py-3 text-right">${formatNumber(sumE)}</td><td class="px-4 py-3 text-right">${formatNumber(sumF)}</td><td class="px-4 py-3 text-right">${formatNumber(sumG)}</td><td class="px-4 py-3 text-right text-blue-800">${formatNumber(sumH)}</td></tr></tfoot>`;
                }
                contentHTML += `</table></div>`;
            } else if (selectedHistoryUrl6 !== "") contentHTML = '<div class="text-center text-gray-500 py-8">ไม่พบข้อมูล หรือข้อมูลไม่ถูกต้อง</div>';
            else contentHTML = `<div class="text-center text-gray-400 mt-10 no-print border-t border-gray-200 pt-10"><p class="text-lg">กรุณาเลือกข้อมูลย้อนหลังจากดรอปดาวน์ด้านบน</p></div>`;

            container.innerHTML = headerHTML + contentHTML;
        }

        function handleHistorySelect6(url) {
            selectedHistoryUrl6 = url;
            if (!url) { appData6 = []; renderReport6(document.getElementById('contentContainer')); return; }
            isLoadingData6 = true; renderReport6(document.getElementById('contentContainer'));

            let fetchUrl = url;
            if(fetchUrl.includes('pubhtml')) fetchUrl = fetchUrl.replace('pubhtml', 'pub').split('?')[0] + '?output=csv';

            Papa.parse(fetchUrl, {
                download: true, header: false,
                complete: function(results) {
                    if(results.data.length < 5) appData6 = [];
                    else appData6 = results.data.slice(4).filter(row => row.length > 0 && row.some(cell => cell !== ""));
                    isLoadingData6 = false; renderReport6(document.getElementById('contentContainer'));
                }, error: function() { appData6 = []; isLoadingData6 = false; renderReport6(document.getElementById('contentContainer')); }
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => { renderReport6(document.getElementById('contentContainer')); });
    </script>
</body>
</html>
