<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าชื่อเจ้าหน้าที่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-semibold flex items-center gap-2">
                <i class="fa-solid fa-users-cog"></i> ระบบตั้งค่าชื่อเจ้าหน้าที่
            </h1>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 overflow-y-auto no-scrollbar">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- ส่วนฟอร์ม (Menu 1: เพิ่ม/แก้ไข) -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sticky top-6">
                    <h2 class="text-xl font-medium mb-4 text-gray-700 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-pen-to-square text-blue-500"></i> <span id="formTitle">เพิ่มข้อมูลเจ้าหน้าที่</span>
                    </h2>
                    
                    <form id="staffForm" onsubmit="handleFormSubmit(event)">
                        <input type="hidden" id="staffId" value="">
                        
                        <div class="mb-4">
                            <label for="staffName" class="block text-sm font-medium text-gray-700 mb-1">1. ชื่อ - สกุล (คอลัมน์ A)</label>
                            <input type="text" id="staffName" required placeholder="ระบุชื่อ-นามสกุล" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>
                        
                        <div class="mb-6">
                            <label for="staffPosition" class="block text-sm font-medium text-gray-700 mb-1">2. ตำแหน่ง (คอลัมน์ B)</label>
                            <input type="text" id="staffPosition" required placeholder="ระบุตำแหน่ง" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>
                        
                        <div class="flex gap-2">
                            <button type="submit" id="btnSave" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                                <i class="fa-solid fa-save"></i> 3. บันทึกข้อมูล
                            </button>
                            <button type="button" id="btnCancel" onclick="resetForm()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors">
                                ยกเลิก
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ส่วนตาราง (Menu 2: ตารางแสดงผล) -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                        <h2 class="text-xl font-medium text-gray-700 flex items-center gap-2">
                            <i class="fa-solid fa-table-list text-emerald-500"></i> รายการเจ้าหน้าที่ทั้งหมด
                        </h2>
                        <div id="connectionStatus" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium">
                            <i class="fa-solid fa-sync fa-spin"></i> กำลังตรวจสอบการเชื่อมต่อ...
                        </div>
                    </div>

                    <div class="overflow-x-auto rounded-lg border border-gray-200">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-gray-700 font-medium border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 w-16 text-center">ลำดับ</th>
                                    <th class="px-6 py-3">ชื่อ - สกุล</th>
                                    <th class="px-6 py-3">ตำแหน่ง</th>
                                    <th class="px-6 py-3 text-center w-28">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="staffTableBody" class="divide-y divide-gray-200 bg-white">
                                <!-- ข้อมูลจะมาแสดงที่นี่ -->
                                <tr>
                                    <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                                        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> กำลังโหลดข้อมูลจาก Google Sheet...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
        
        window.onload = () => {
            const statusBadge = document.getElementById('connectionStatus');
            if (isGAS) {
                statusBadge.className = 'px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium flex items-center gap-1';
                statusBadge.innerHTML = '<i class="fa-solid fa-check-circle"></i> เชื่อมต่อระบบจริงแล้ว';
            } else {
                statusBadge.className = 'px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-medium flex items-center gap-1';
                statusBadge.innerHTML = '<i class="fa-solid fa-circle-info"></i> โหมดตัวอย่าง (พรีวิว)';
            }
            loadData();
        };

        function loadData() {
            showLoading(true, "กำลังโหลดข้อมูล...");
            if (isGAS) {
                google.script.run
                    .withSuccessHandler(data => {
                        renderTable(data);
                        showLoading(false);
                    })
                    .withFailureHandler(err => {
                        Swal.fire('Error', 'โหลดข้อมูลไม่สำเร็จ: ' + err, 'error');
                        showLoading(false);
                    })
                    .getUserData();
            } else {
                // ข้อมูลตัวอย่างสำหรับแสดงใน Canvas
                const mockData = [
                    {id: 2, name: "นางสาวณัฐธยาน์ ดีสวัสดิ์", position: "เจ้าพนักงานการเงินและบัญชี"},
                    {id: 3, name: "นายชุตินันท์ เรือโป๊ะ", position: "นักวิเคราะห์นโยบายและแผน"}
                ];
                setTimeout(() => { renderTable(mockData); showLoading(false); }, 800);
            }
        }

        function renderTable(dataList) {
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '';
            
            if (!dataList || dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">ไม่พบข้อมูลใน Google Sheet</td></tr>`;
                return;
            }

            dataList.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50 transition-colors group';
                tr.innerHTML = `
                    <td class="px-6 py-4 text-center text-gray-500">${index + 1}</td>
                    <td class="px-6 py-4 font-medium text-gray-800">${escapeHtml(item.name)}</td>
                    <td class="px-6 py-4 text-gray-600">${escapeHtml(item.position)}</td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="editData('${item.id}', '${escapeHtml(item.name)}', '${escapeHtml(item.position)}')" class="p-2 text-blue-600 hover:bg-blue-100 rounded-lg">
                                <i class="fa-solid fa-edit"></i>
                            </button>
                            <button onclick="confirmDelete('${item.id}')" class="p-2 text-red-600 hover:bg-red-100 rounded-lg">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('staffId').value;
            const name = document.getElementById('staffName').value.trim();
            const position = document.getElementById('staffPosition').value.trim();

            if (!name || !position) return;

            if (isGAS) {
                showLoading(true, "กำลังบันทึกข้อมูล...");
                google.script.run
                    .withSuccessHandler(res => {
                        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
                        resetForm();
                        loadData();
                    })
                    .withFailureHandler(err => {
                        Swal.fire('ข้อผิดพลาด', 'บันทึกลง Sheet ไม่สำเร็จ: ' + err, 'error');
                        showLoading(false);
                    })
                    .saveUserData(id, name, position);
            } else {
                Swal.fire('พรีวิว', 'คุณอยู่ในหน้าตัวอย่าง ระบบจะไม่บันทึกข้อมูลจริง', 'info');
            }
        }

        function editData(id, name, position) {
            document.getElementById('staffId').value = id;
            document.getElementById('staffName').value = name;
            document.getElementById('staffPosition').value = position;
            
            document.getElementById('formTitle').innerText = 'แก้ไขข้อมูลเจ้าหน้าที่';
            const btn = document.getElementById('btnSave');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> อัปเดตข้อมูล';
            btn.classList.replace('bg-blue-600', 'bg-amber-500');
            btn.classList.replace('hover:bg-blue-700', 'hover:bg-amber-600');
            document.getElementById('btnCancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function confirmDelete(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "ข้อมูลในแถวที่ " + id + " จะถูกลบถาวร",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed && isGAS) {
                    showLoading(true, "กำลังลบ...");
                    google.script.run
                        .withSuccessHandler(() => {
                            Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
                            loadData();
                        })
                        .withFailureHandler(err => {
                            Swal.fire('ข้อผิดพลาด', 'ลบไม่สำเร็จ: ' + err, 'error');
                            showLoading(false);
                        })
                        .deleteUserData(id);
                }
            });
        }

        function resetForm() {
            document.getElementById('staffForm').reset();
            document.getElementById('staffId').value = '';
            document.getElementById('formTitle').innerText = 'เพิ่มข้อมูลเจ้าหน้าที่';
            const btn = document.getElementById('btnSave');
            btn.innerHTML = '<i class="fa-solid fa-save"></i> 3. บันทึกข้อมูล';
            btn.classList.replace('bg-amber-500', 'bg-blue-600');
            btn.classList.replace('hover:bg-amber-600', 'hover:bg-blue-700');
            document.getElementById('btnCancel').classList.add('hidden');
        }

        function showLoading(isLoading, text) {
            const btn = document.getElementById('btnSave');
            btn.disabled = isLoading;
            if (isLoading) {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${text}`;
                btn.classList.add('opacity-70');
            } else {
                btn.classList.remove('opacity-70');
                if (document.getElementById('staffId').value) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> อัปเดตข้อมูล';
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-save"></i> 3. บันทึกข้อมูล';
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
